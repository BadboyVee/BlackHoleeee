<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opus 5 — eggs, in code</title>
<meta name="description" content="An 8-second launch film recreated in code: procedurally drawn birds' eggs assembling into a 5. No images, no video, no libraries.">
<style>
  :root{
    --paper:#ccba9c;
    --chrome:#17150f;
    --line:rgba(236,228,210,.16);
    --dim:rgba(236,228,210,.5);
    --ink:#ece4d2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--chrome);color:var(--ink);
    font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px 18px;
  }
  .app{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
  .stage-wrap{
    position:relative;aspect-ratio:4/5;height:min(78vh,860px);max-width:100%;
    border-radius:8px;overflow:hidden;background:#000;cursor:pointer;
    box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);
  }
  .stage-wrap:fullscreen{border-radius:0;height:100%;max-width:100%;box-shadow:none}
  canvas{display:block;width:100%;height:100%}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(20,17,10,.34);opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .overlay.show{opacity:1}
  .overlay .g{
    width:70px;height:70px;border-radius:50%;border:1px solid rgba(236,228,210,.55);
    display:flex;align-items:center;justify-content:center;
  }
  .overlay .g::after{
    content:"";width:0;height:0;margin-left:5px;
    border-left:18px solid rgba(236,228,210,.9);
    border-top:12px solid transparent;border-bottom:12px solid transparent;
  }
  .bar{display:flex;align-items:center;gap:12px;width:min(520px,100%)}
  button{
    appearance:none;background:transparent;color:var(--ink);border:1px solid var(--line);
    border-radius:5px;padding:6px 10px;font:500 11px/1 inherit;letter-spacing:.07em;
    cursor:pointer;transition:border-color .18s ease,background .18s ease,color .18s ease;
  }
  button:hover{border-color:rgba(236,228,210,.42);background:rgba(236,228,210,.06)}
  button.on{color:#d9a066;border-color:rgba(217,160,102,.5)}
  .scrub{position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .track{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(236,228,210,.18)}
  .fill{position:absolute;left:0;height:3px;border-radius:2px;background:var(--paper);pointer-events:none}
  .knob{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--paper);transform:translateX(-50%);pointer-events:none}
  .time{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim);white-space:nowrap}
  .meta{font-size:12px;color:rgba(236,228,210,.4);text-align:center;max-width:560px;line-height:1.6}
  .meta b{color:rgba(236,228,210,.66);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="wrap">
    <canvas id="stage"></canvas>
    <div class="overlay" id="overlay"><div class="g"></div></div>
  </div>
  <div class="bar">
    <button id="play" title="Play / pause (space)">Pause</button>
    <div class="scrub" id="scrub"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <span class="time" id="time">0.0 / 8.0</span>
    <button id="loop" class="on" title="Loop (l)">Loop</button>
    <button id="full" title="Fullscreen (f)">Full</button>
  </div>
  <p class="meta"><b>Every egg is drawn, not photographed.</b> Shell, mottling, speckles and ink outline are generated from a seeded PRNG into an offscreen canvas — no images, no video, no libraries. Playback is quantised to 24fps to keep the stop-motion cadence.</p>
</div>
<script>
(function(){
'use strict';

var cv = document.getElementById('stage');
var ctx = cv.getContext('2d', { alpha: false });

/* 4:5, the format of the original */
var W = 1080, H = 1350, TAU = Math.PI * 2;
var FPS = 24, DUR = 8.0, CUT = 5.0;

var SERIF = 'Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif';
var WORDMARK = '"Times New Roman",Times,Georgia,"Liberation Serif",serif';
var PAPER = [204, 186, 156];

function clamp(x, a, b){ return x < a ? a : x > b ? b : x; }
function lerp(a, b, t){ return a + (b - a) * t; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgba(c, a){ return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function jitterCol(c, r, amt){
  return [clamp(c[0] + (r() - 0.5) * amt, 0, 255),
          clamp(c[1] + (r() - 0.5) * amt, 0, 255),
          clamp(c[2] + (r() - 0.5) * amt, 0, 255)];
}

/* ---------------------------------------------------------------------------
   THE EGG
   An ovoid is a circle whose width is skewed toward the blunt end:
     x = b sin t (1 - k cos t),  y = -a cos t
   Everything else — shell mottling, the grey underlayer, the dark blotches,
   the peppering and the ink outline — is painted into that clipped path.
--------------------------------------------------------------------------- */
function eggPath(g, cx, cy, a, b, k, wob){
  var N = 90;
  g.beginPath();
  for (var i = 0; i <= N; i++){
    var t = i / N * TAU;
    var m = 1 + wob[0] * Math.sin(3 * t + wob[1]) + wob[2] * Math.sin(5 * t + wob[3]);
    var x = b * Math.sin(t) * (1 - k * Math.cos(t)) * m;
    var y = -a * Math.cos(t) * m;
    if (i === 0) g.moveTo(cx + x, cy + y); else g.lineTo(cx + x, cy + y);
  }
  g.closePath();
}
/* an irregular closed blob, smoothed through its own midpoints */
function blobPath(g, cx, cy, r, squash, rnd, n){
  n = n || 9;
  var pts = [], i;
  for (i = 0; i < n; i++){
    var t = i / n * TAU, rr = r * (0.42 + 0.9 * rnd());
    pts.push([cx + Math.cos(t) * rr, cy + Math.sin(t) * rr * squash]);
  }
  g.beginPath();
  g.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
  for (i = 0; i < n; i++){
    var p = pts[i], q = pts[(i + 1) % n];
    g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  g.closePath();
}

var SHELLS = [
  [186, 176, 128], [172, 158,  98], [199, 188, 146], [206, 179, 122],
  [154, 148,  96], [188, 158, 106], [176, 170, 120], [144, 142,  92],
  [204, 192, 152], [186, 130,  82], [132, 132,  92], [196, 188, 150],
  [162, 164, 134], [148, 138,  96]
];
var MARKS  = [[59, 46, 30], [74, 58, 34], [46, 36, 24], [90, 70, 48], [34, 28, 20]];
var UNDER  = [[138, 131, 120], [126, 122, 116], [154, 142, 128]];

/* pick a point inside the ovoid, biased toward the blunt (lower) end */
function pointInEgg(a, b, k, rnd, bias){
  for (var i = 0; i < 24; i++){
    var y = a * (2 * Math.pow(rnd(), bias) - 1);
    var ct = clamp(-y / a, -1, 1), t = Math.acos(ct);
    var wdt = b * Math.sin(t) * (1 - k * ct);
    var x = (rnd() * 2 - 1) * wdt;
    if (Math.abs(x) <= wdt) return [x, y];
  }
  return [0, 0];
}

function makeEgg(sp){
  var pad = 5, w = Math.ceil(sp.b * 2 + pad * 2), h = Math.ceil(sp.a * 2 + pad * 2);
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d'), cx = w / 2, cy = h / 2, r = sp.rnd, i, p;

  g.save();
  eggPath(g, cx, cy, sp.a, sp.b, sp.k, sp.wob);
  g.clip();

  /* shell ground */
  g.fillStyle = rgba(sp.base, 1);
  g.fillRect(0, 0, w, h);

  /* mottling, so the ground is never flat */
  for (i = 0; i < 52; i++){
    var mx = cx + (r() - 0.5) * sp.b * 2.2, my = cy + (r() - 0.5) * sp.a * 2.2;
    var mr = sp.b * (0.14 + 0.45 * r());
    var tint = jitterCol(sp.base, r, 46);
    var gg = g.createRadialGradient(mx, my, 0, mx, my, mr);
    gg.addColorStop(0, rgba(tint, 0.05 + 0.13 * r()));
    gg.addColorStop(1, rgba(tint, 0));
    g.fillStyle = gg;
    g.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  }

  /* the soft grey underlayer real eggs show beneath their markings */
  var under = UNDER[(r() * UNDER.length) | 0];
  for (i = 0; i < sp.nUnder; i++){
    p = pointInEgg(sp.a, sp.b, sp.k, r, sp.bias);
    blobPath(g, cx + p[0], cy + p[1], sp.b * (0.1 + 0.26 * r()), 0.7 + 0.5 * r(), r, 8);
    g.fillStyle = rgba(under, 0.1 + 0.18 * r());
    g.fill();
  }

  /* the markings */
  var mark = MARKS[(r() * MARKS.length) | 0];
  if (sp.style === 'scrawl'){
    g.lineCap = 'round';
    for (i = 0; i < sp.nBlob; i++){
      p = pointInEgg(sp.a, sp.b, sp.k, r, sp.bias);
      var len = sp.b * (0.3 + 0.8 * r());
      g.strokeStyle = rgba(jitterCol(mark, r, 16), 0.55 + 0.4 * r());
      g.lineWidth = sp.b * (0.04 + 0.07 * r());
      g.beginPath();
      g.moveTo(cx + p[0], cy + p[1]);
      g.quadraticCurveTo(cx + p[0] + (r() - 0.5) * len, cy + p[1] + (r() - 0.5) * len,
                         cx + p[0] + (r() - 0.5) * len * 1.6, cy + p[1] + (r() - 0.5) * len * 1.2);
      g.stroke();
    }
  } else {
    for (i = 0; i < sp.nBlob; i++){
      p = pointInEgg(sp.a, sp.b, sp.k, r, sp.bias);
      blobPath(g, cx + p[0], cy + p[1], sp.b * sp.blobR * (0.5 + r()), 0.6 + 0.7 * r(), r, 9);
      g.fillStyle = rgba(jitterCol(mark, r, 14), 0.55 + 0.42 * r());
      g.fill();
    }
  }
  /* peppering */
  for (i = 0; i < sp.nDot; i++){
    p = pointInEgg(sp.a, sp.b, sp.k, r, sp.bias);
    var dr = 0.5 + 1.9 * r() * (sp.b / 40);
    g.fillStyle = rgba(jitterCol(mark, r, 18), 0.35 + 0.55 * r());
    g.beginPath();
    g.ellipse(cx + p[0], cy + p[1], dr, dr * (0.6 + 0.7 * r()), r() * TAU, 0, TAU);
    g.fill();
  }

  /* volume: a soft highlight up-left, shadow at the rim */
  g.save();
  g.translate(cx, cy); g.scale(1, sp.a / sp.b);
  var sg = g.createRadialGradient(-sp.b * 0.3, -sp.b * 0.34, sp.b * 0.1, 0, 0, sp.b * 1.42);
  sg.addColorStop(0, 'rgba(255,250,236,0.17)');
  sg.addColorStop(0.5, 'rgba(255,250,236,0)');
  sg.addColorStop(0.82, 'rgba(46,36,22,0.10)');
  sg.addColorStop(1, 'rgba(38,29,17,0.34)');
  g.fillStyle = sg;
  g.fillRect(-sp.b * 1.6, -sp.b * 1.6, sp.b * 3.2, sp.b * 3.2);
  g.restore();
  g.restore();

  /* the plate's ink outline */
  eggPath(g, cx, cy, sp.a, sp.b, sp.k, sp.wob);
  g.strokeStyle = 'rgba(44,35,23,0.7)';
  g.lineWidth = Math.max(1, sp.b * 0.028);
  g.stroke();

  return c;
}

/* ---------------------------------------------------------------------------
   THE COMPOSITION
   The numeral is sampled as a mask, then eggs are packed into it largest
   first — the same way you would lay real ones out on a table.
--------------------------------------------------------------------------- */
var COMP = null;
function buildComp(){
  if (COMP) return COMP;
  var r = mulberry32(20260724), i, j;

  var mw = 260, mh = 330;
  var oc = document.createElement('canvas');
  oc.width = mw; oc.height = mh;
  var g = oc.getContext('2d');
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 300px ' + SERIF;
  g.fillText('5', mw / 2, mh / 2);
  var d = g.getImageData(0, 0, mw, mh).data;

  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, x, y;
  for (y = 0; y < mh; y++){
    for (x = 0; x < mw; x++){
      if (d[(y * mw + x) * 4 + 3] > 128){
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  var TX = 198, TY = 188, TW = 680, TH = 972;
  function inside(px, py){
    var mx = Math.round(x0 + (px - TX) / TW * (x1 - x0));
    var my = Math.round(y0 + (py - TY) / TH * (y1 - y0));
    if (mx < 0 || my < 0 || mx >= mw || my >= mh) return false;
    return d[(my * mw + mx) * 4 + 3] > 120;
  }

  /* pack: the radius target shrinks as attempts go on, so big eggs land first */
  var eggs = [], ATT = 9000;
  for (i = 0; i < ATT && eggs.length < 36; i++){
    var a = lerp(88, 26, Math.pow(i / ATT, 0.6)) * (0.88 + 0.26 * r());
    var px = TX + r() * TW, py = TY + r() * TH;
    if (!inside(px, py)) continue;
    if (!(inside(px + a * 0.45, py) && inside(px - a * 0.45, py) &&
          inside(px, py + a * 0.45) && inside(px, py - a * 0.45))) continue;
    var clash = false;
    for (j = 0; j < eggs.length; j++){
      var dx = eggs[j].x - px, dy = eggs[j].y - py;
      if (dx * dx + dy * dy < Math.pow((eggs[j].a + a) * 0.76, 2)){ clash = true; break; }
    }
    if (clash) continue;
    eggs.push({ x: px, y: py, a: a });
  }

  /* give each one a shell, a marking style and a lie of its own */
  for (i = 0; i < eggs.length; i++){
    var e = eggs[i];
    var seed = (r() * 1e9) | 0, er = mulberry32(seed);
    var roll = er(), style = roll < 0.17 ? 'plain' : roll < 0.4 ? 'pepper' : roll < 0.87 ? 'blotch' : 'scrawl';
    var b = e.a * (0.66 + 0.12 * er());
    var spec = {
      a: e.a, b: b, k: 0.16 + 0.14 * er(), rnd: er,
      wob: [0.012 * er(), er() * TAU, 0.009 * er(), er() * TAU],
      base: jitterCol(SHELLS[(er() * SHELLS.length) | 0], er, 18),
      bias: 0.6 + 0.5 * er(),
      style: style,
      blobR: 0.1 + 0.12 * er(),
      nUnder: style === 'plain' ? 3 : 8 + ((er() * 14) | 0),
      nBlob: style === 'plain' ? 0 : (style === 'pepper' ? 5 + ((er() * 9) | 0)
            : (style === 'scrawl' ? 10 + ((er() * 10) | 0) : 22 + ((er() * 30) | 0))),
      nDot: style === 'plain' ? ((er() * 30) | 0)
            : (style === 'pepper' ? 240 + ((er() * 300) | 0) : 120 + ((er() * 220) | 0))
    };
    e.rot = (er() * 2 - 1) * 1.45;
    e.sprite = makeEgg(spec);
  }

  /* they arrive roughly top to bottom, but not in a queue */
  var order = [];
  for (i = 0; i < eggs.length; i++) order.push(i);
  order.sort(function(p, q){
    return (eggs[p].y + (mulberry32(p * 977 + 5)() - 0.5) * 210) -
           (eggs[q].y + (mulberry32(q * 977 + 5)() - 0.5) * 210);
  });

  COMP = { eggs: eggs, order: order, step: (2.84 - 0.08) / Math.max(1, eggs.length) };
  return COMP;
}

/* ---------------------------------------------------------------------------
   PAPER AND GRAIN
--------------------------------------------------------------------------- */
var paperSheet = null, grainTile = null, grainPat = null;
function buildPaper(){
  if (paperSheet) return;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d'), r = mulberry32(31415), i;
  g.fillStyle = rgba(PAPER, 1);
  g.fillRect(0, 0, W, H);
  /* slow mottle, like stock that has aged unevenly */
  for (i = 0; i < 90; i++){
    var mx = r() * W, my = r() * H, mr = 140 + r() * 460;
    var tint = jitterCol(PAPER, r, 16);
    var gg = g.createRadialGradient(mx, my, 0, mx, my, mr);
    gg.addColorStop(0, rgba(tint, 0.05 + 0.07 * r()));
    gg.addColorStop(1, rgba(tint, 0));
    g.fillStyle = gg;
    g.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  }
  /* the little pale flecks in the pulp */
  for (i = 0; i < 260; i++){
    g.fillStyle = 'rgba(247,242,228,' + (0.12 + 0.5 * r()) + ')';
    g.beginPath();
    g.ellipse(r() * W, r() * H, 0.5 + r() * 1.7, 0.5 + r() * 1.2, r() * TAU, 0, TAU);
    g.fill();
  }
  for (i = 0; i < 70; i++){
    g.fillStyle = 'rgba(122,106,82,' + (0.05 + 0.13 * r()) + ')';
    g.beginPath();
    g.ellipse(r() * W, r() * H, 0.6 + r() * 1.5, 0.6 + r() * 1.1, r() * TAU, 0, TAU);
    g.fill();
  }
  paperSheet = c;

  var t = document.createElement('canvas');
  t.width = t.height = 150;
  var tg = t.getContext('2d'), img = tg.createImageData(150, 150), rr2 = mulberry32(2718);
  for (i = 0; i < 150 * 150; i++){
    var v = (rr2() * 255) | 0;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 20;
  }
  tg.putImageData(img, 0, 0);
  grainTile = t;
}

/* ---------------------------------------------------------------------------
   FRAME
--------------------------------------------------------------------------- */
function render(raw){
  var t = Math.floor(raw * FPS) / FPS;          /* stop-motion cadence */
  buildPaper();
  var C = buildComp();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  var s = Math.min(cv.width / W, cv.height / H);
  ctx.setTransform(s, 0, 0, s, (cv.width - W * s) / 2, (cv.height - H * s) / 2);

  ctx.drawImage(paperSheet, 0, 0);

  if (t < CUT){
    for (var i = 0; i < C.order.length; i++){
      var e = C.eggs[C.order[i]];
      var ti = 0.08 + i * C.step;
      if (t < ti) break;
      var age = Math.round((t - ti) * FPS);
      var sc = age <= 0 ? 0.88 : (age === 1 ? 1.05 : 1);
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.rot);
      ctx.scale(sc, sc);
      ctx.drawImage(e.sprite, -e.sprite.width / 2, -e.sprite.height / 2);
      ctx.restore();
    }
  } else {
    ctx.fillStyle = '#131009';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    var size = 150;
    ctx.font = '400 ' + size + 'px ' + WORDMARK;
    size = size * (W * 0.525) / ctx.measureText('Opus 5').width;
    ctx.font = '400 ' + size + 'px ' + WORDMARK;
    ctx.fillText('Opus 5', W / 2, H * 0.482 + size * 0.34);
  }

  if (!grainPat && grainTile) grainPat = ctx.createPattern(grainTile, 'repeat');
  if (grainPat){
    var f = Math.round(t * FPS), rr3 = mulberry32(f * 7919 + 13);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.translate(-((rr3() * 150) | 0), -((rr3() * 150) | 0));
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W + 160, H + 160);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
   TRANSPORT
--------------------------------------------------------------------------- */
var time = 0, playing = false, looping = true, last = performance.now();
var elPlay = document.getElementById('play'), elLoop = document.getElementById('loop'),
    elFull = document.getElementById('full'), elScrub = document.getElementById('scrub'),
    elFill = document.getElementById('fill'), elKnob = document.getElementById('knob'),
    elTime = document.getElementById('time'), elWrap = document.getElementById('wrap'),
    elOverlay = document.getElementById('overlay');

function resize(){
  var rect = elWrap.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(2, Math.round(rect.width * dpr));
  cv.height = Math.max(2, Math.round(rect.height * dpr));
}
function setPlaying(v){
  playing = v;
  elPlay.textContent = v ? 'Pause' : 'Play';
  elOverlay.classList.toggle('show', !v);
}
function seek(t){ time = clamp(t, 0, DUR); }
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing){
    time += dt;
    if (time >= DUR){
      if (looping) time -= DUR;
      else { time = DUR; setPlaying(false); }
    }
  }
  render(time);
  var f = time / DUR, bw = elScrub.clientWidth;
  elFill.style.width = (bw * f) + 'px';
  elKnob.style.left = (bw * f) + 'px';
  elTime.textContent = time.toFixed(1) + ' / ' + DUR.toFixed(1);
  requestAnimationFrame(frame);
}

elPlay.addEventListener('click', function(){ if (time >= DUR) seek(0); setPlaying(!playing); });
elWrap.addEventListener('click', function(){ if (time >= DUR) seek(0); setPlaying(!playing); });
elLoop.addEventListener('click', function(){
  looping = !looping;
  elLoop.classList.toggle('on', looping);
});
elFull.addEventListener('click', function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (elWrap.requestFullscreen) elWrap.requestFullscreen();
});
var dragging = false;
function scrubTo(ev){
  var r = elScrub.getBoundingClientRect();
  seek((ev.clientX - r.left) / r.width * DUR);
}
elScrub.addEventListener('pointerdown', function(ev){ dragging = true; elScrub.setPointerCapture(ev.pointerId); scrubTo(ev); });
elScrub.addEventListener('pointermove', function(ev){ if (dragging) scrubTo(ev); });
elScrub.addEventListener('pointerup', function(){ dragging = false; });
elScrub.addEventListener('pointercancel', function(){ dragging = false; });
document.addEventListener('keydown', function(ev){
  if (ev.key === ' '){ ev.preventDefault(); if (time >= DUR) seek(0); setPlaying(!playing); }
  else if (ev.key === 'ArrowRight') seek(time + 1 / FPS * 6);
  else if (ev.key === 'ArrowLeft') seek(time - 1 / FPS * 6);
  else if (ev.key === 'l' || ev.key === 'L') elLoop.click();
  else if (ev.key === 'f' || ev.key === 'F') elFull.click();
  else if (ev.key === 'Home') seek(0);
});
window.addEventListener('resize', resize);
resize();
setPlaying(true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
