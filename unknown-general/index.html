<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Unknown General</title>
<meta name="description" content="A 15-second feudal-Japan NFT crossover trailer: four generals gather at the castle, and a stranger with green eyes rides in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d8b46a; --ink: #050307; --paper: #f2e8d6; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Cormorant Garamond", Georgia, serif; color: var(--paper); }
  #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  #ui { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
        background: radial-gradient(ellipse at center, rgba(40,8,16,.55), rgba(0,0,0,.85)); transition: opacity .6s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  #ui h1 { margin: 0 0 .2em; font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: clamp(28px, 5.4vw, 76px);
           letter-spacing: .12em; color: var(--paper); text-shadow: 0 0 30px rgba(200,40,50,.45); }
  #ui p { margin: 0 0 1.6em; font-size: clamp(14px, 1.7vw, 24px); letter-spacing: .32em; color: var(--gold); }
  #ui button { font: 600 clamp(14px, 1.5vw, 20px) "Cormorant Garamond", serif; letter-spacing: .2em; color: var(--paper);
               background: rgba(120,16,28,.55); border: 1px solid var(--gold); padding: .7em 2.2em; cursor: pointer; }
  #ui button:hover, #ui button:focus-visible { background: rgba(160,24,38,.8); outline: none; }
  #ui small { display: block; margin-top: 1.4em; font-size: clamp(11px, 1vw, 14px); letter-spacing: .1em; opacity: .65; }
  #err { position: absolute; left: 16px; bottom: 16px; font: 13px monospace; color: #f88; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080" aria-label="Trailer: The Unknown General"></canvas>
  <div id="ui">
    <div>
      <h1>名もなき将軍</h1>
      <p>THE UNKNOWN GENERAL</p>
      <button id="play" disabled>LOADING…</button>
      <small>15 seconds · sound on · space to replay</small>
    </div>
  </div>
  <div id="err"></div>
</div>
<script>
'use strict';
/* ==========================================================================
   THE UNKNOWN GENERAL — a 15 second trailer drawn live on one canvas.
   Every frame is a pure function of time t (seconds), so the same code plays
   in the browser and renders to video frame-by-frame (tools/render.cjs).
   ========================================================================== */
const W = 1920, H = 1080, DUR = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const QS = new URLSearchParams(location.search);

/* ---------- small maths ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const bump = (t, a, b) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const TAU = Math.PI * 2;
function RNG(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function noise1(seed) { const r = RNG(seed), v = new Float32Array(1024); for (let i = 0; i < 1024; i++) v[i] = r(); return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(v[i & 1023], v[(i + 1) & 1023], u); }; }
function fbm(n, x, o = 5) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3); a *= .5; f *= 2.03; } return s; }

/* ---------- palette ---------- */
const GOLD = '#c9a24a', GOLD_HI = '#f1d58b', CRIMSON = '#8e1b24', CRIMSON_HI = '#c4323a', INK = '#0b080a';

/* ---------- assets ---------- */
const IMG = {};
const SRC = {
  bear: 'assets/cut/crowned-bear.png', fish: 'assets/cut/blind-fish.png', bucket: 'assets/cut/bucket-hat.png',
  pixel: 'assets/cut/pixel-shades.png', rays: 'assets/cut/pixel-rays.png',
  eyes: 'assets/cut/green-eyes-eyes.png', katana: 'assets/cut/green-eyes-katana.png',
};
function loadImg(k, src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => rej(new Error('could not load ' + src)); i.src = src; }); }

/* =========================================================================
   PAINTERS — static layers painted once into offscreen canvases
   ========================================================================= */
function blurred(src, px) { const c = mk(src.width, src.height), g = c.getContext('2d'); g.filter = `blur(${px}px)`; g.drawImage(src, 0, 0); return c; }

function paintRidge(seed, w, h, base, amp, freq, top, bottom, rim, pines) {
  const c = mk(w, h), g = c.getContext('2d'), n = noise1(seed), r = RNG(seed + 1);
  const ys = []; for (let x = 0; x <= w; x += 4) ys.push(base - amp * (fbm(n, x * freq) - .2) * 1.6);
  g.beginPath(); g.moveTo(0, h); ys.forEach((y, i) => g.lineTo(i * 4, y)); g.lineTo(w, h); g.closePath();
  const gr = g.createLinearGradient(0, base - amp, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fill();
  if (pines) {
    g.fillStyle = top;
    for (let i = 0; i < ys.length; i++) { if (r() < .55) continue; const x = i * 4, y = ys[i] + 2, ph = 8 + r() * pines;
      g.beginPath(); g.moveTo(x - ph * .28, y); g.lineTo(x, y - ph); g.lineTo(x + ph * .28, y); g.fill(); }
  }
  g.beginPath(); ys.forEach((y, i) => i ? g.lineTo(i * 4, y) : g.moveTo(0, y));
  g.strokeStyle = rim; g.lineWidth = 2; g.stroke();
  return c;
}

function paintMist(seed, w, h, rgb, n = 150, amin = .04, amax = .11) {
  const c = mk(w, h), g = c.getContext('2d'), r = RNG(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = h * .5 + (r() - .5) * h * .55, rx = 90 + r() * 280, ry = rx * (.18 + r() * .14), a = amin + r() * (amax - amin);
    for (const ox of [-w, 0, w]) {
      g.save(); g.translate(x + ox, y); g.scale(1, ry / rx);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
    }
  }
  return c;
}

function paintClouds(seed, w, h) {
  const c = mk(w, h), g = c.getContext('2d'), r = RNG(seed);
  for (let i = 0; i < 70; i++) {
    const x = r() * w, y = h * (.15 + r() * .8), len = 160 + r() * 520, th = 6 + r() * 18;
    for (const ox of [-w, 0, w]) {
      g.save(); g.translate(x + ox, y); g.scale(1, th / len);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, len);
      gr.addColorStop(0, `rgba(30,8,20,${.35 + r() * .3})`); gr.addColorStop(1, 'rgba(30,8,20,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, len, 0, TAU); g.fill(); g.restore();
      g.save(); g.translate(x + ox, y - th * .6); g.scale(1, th * .4 / len);
      const g2 = g.createRadialGradient(0, 0, 0, 0, 0, len * .8);
      g2.addColorStop(0, `rgba(255,140,90,${.06 + r() * .08})`); g2.addColorStop(1, 'rgba(255,140,90,0)');
      g.fillStyle = g2; g.beginPath(); g.arc(0, 0, len * .8, 0, TAU); g.fill(); g.restore();
    }
  }
  return c;
}

function windowLight(g, x, y, w, h, lit) {
  if (lit) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const gl = g.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w * 1.9);
    gl.addColorStop(0, 'rgba(255,150,60,.32)'); gl.addColorStop(1, 'rgba(255,150,60,0)');
    g.fillStyle = gl; g.fillRect(x - w * 2, y - w * 2, w * 5, h + w * 4); g.restore();
    const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#ffd88a'); gr.addColorStop(1, '#d9692a');
    g.fillStyle = gr;
  } else g.fillStyle = '#070506';
  g.fillRect(x, y, w, h);
  g.fillStyle = '#20120c'; for (let k = 1; k < 4; k++) g.fillRect(x + k * w / 4 - 1.5, y, 3, h);
  g.fillRect(x - 3, y - 4, w + 6, 4); g.fillRect(x - 3, y + h, w + 6, 4);
}

function mon(g, x, y, r, col = GOLD) {          // mitsudomoe-style crest
  g.save(); g.translate(x, y);
  g.strokeStyle = col; g.lineWidth = r * .12; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
  g.fillStyle = col;
  for (let k = 0; k < 3; k++) {
    g.save(); g.rotate(k * TAU / 3);
    g.beginPath(); g.arc(0, -r * .38, r * .27, 0, TAU); g.fill();
    g.beginPath(); g.arc(0, 0, r * .66, -Math.PI / 2, -Math.PI / 2 + 1.7); g.arc(0, 0, r * .4, -Math.PI / 2 + 1.5, -Math.PI / 2 + .15, true); g.fill();
    g.restore();
  }
  g.restore();
}

function eyeMon(g, x, y, r, col = GOLD) {      // the stranger's crest: an open eye
  g.save(); g.translate(x, y); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = r * .12;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
  g.beginPath(); g.moveTo(-r * .72, 0); g.quadraticCurveTo(0, -r * .62, r * .72, 0); g.quadraticCurveTo(0, r * .62, -r * .72, 0); g.stroke();
  g.beginPath(); g.arc(0, 0, r * .2, 0, TAU); g.fill(); g.restore();
}

function roofPath(g, cx, ey, w, ov, ty, topW, rh) {
  g.beginPath();
  g.moveTo(cx - w / 2 - ov, ey - 24);
  g.quadraticCurveTo(cx - w / 2 - ov * .3, ey + 6, cx - w / 2 + 30, ey + 4);
  g.lineTo(cx + w / 2 - 30, ey + 4);
  g.quadraticCurveTo(cx + w / 2 + ov * .3, ey + 6, cx + w / 2 + ov, ey - 24);
  g.quadraticCurveTo(cx + topW / 2 + 40, ty + rh * .35, cx + topW / 2, ty);
  g.lineTo(cx - topW / 2, ty);
  g.quadraticCurveTo(cx - topW / 2 - 40, ty + rh * .35, cx - w / 2 - ov, ey - 24);
  g.closePath();
}

function drawRoof(g, cx, ey, w, ov, ty, topW, rh, r) {
  roofPath(g, cx, ey, w, ov, ty, topW, rh);
  const gr = g.createLinearGradient(0, ty, 0, ey); gr.addColorStop(0, '#2c2328'); gr.addColorStop(1, '#100b0e');
  g.fillStyle = gr; g.fill();
  g.save(); roofPath(g, cx, ey, w, ov, ty, topW, rh); g.clip();
  g.strokeStyle = 'rgba(255,220,200,.07)'; g.lineWidth = 2;
  for (let x = cx - w / 2 - ov; x < cx + w / 2 + ov; x += 9) { g.beginPath(); g.moveTo(cx + (x - cx) * (topW / (w + 2 * ov)), ty); g.lineTo(x, ey + 6); g.stroke(); }
  g.restore();
  // gilded eave edge
  g.beginPath(); g.moveTo(cx - w / 2 - ov, ey - 24); g.quadraticCurveTo(cx - w / 2 - ov * .3, ey + 6, cx - w / 2 + 30, ey + 4);
  g.lineTo(cx + w / 2 - 30, ey + 4); g.quadraticCurveTo(cx + w / 2 + ov * .3, ey + 6, cx + w / 2 + ov, ey - 24);
  g.strokeStyle = GOLD; g.lineWidth = 4; g.stroke();
  g.fillStyle = GOLD_HI; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * (w / 2 + ov), ey - 24, 5, 0, TAU); g.fill(); }
}

function shachi(g, x, y, dir, s = 1) {
  g.save(); g.translate(x, y); g.scale(dir * s, s);
  const gr = g.createLinearGradient(0, -50, 0, 0); gr.addColorStop(0, GOLD_HI); gr.addColorStop(1, '#8a6420');
  g.fillStyle = gr; g.beginPath(); g.moveTo(-6, 0); g.quadraticCurveTo(10, -24, -4, -46); g.quadraticCurveTo(-14, -56, -22, -44);
  g.quadraticCurveTo(-8, -42, -8, -30); g.quadraticCurveTo(-10, -14, -20, -6); g.closePath(); g.fill();
  g.restore();
}

function paintCastle() {
  const Wc = 1400, Hc = 1500, c = mk(Wc, Hc), g = c.getContext('2d'), r = RNG(11);
  const cx = 700, base = Hc, bw0 = 1120, bw1 = 860, bh = 300, top = base - bh;
  const stone = () => { g.beginPath(); g.moveTo(cx - bw0 / 2, base); g.quadraticCurveTo(cx - bw1 / 2 - 18, base - bh * .25, cx - bw1 / 2, top);
    g.lineTo(cx + bw1 / 2, top); g.quadraticCurveTo(cx + bw1 / 2 + 18, base - bh * .25, cx + bw0 / 2, base); g.closePath(); };
  stone(); let gr = g.createLinearGradient(cx - bw0 / 2, 0, cx + bw0 / 2, 0);
  gr.addColorStop(0, '#59433f'); gr.addColorStop(.45, '#2e2224'); gr.addColorStop(1, '#130d10'); g.fillStyle = gr; g.fill();
  g.save(); stone(); g.clip();
  for (let y = top; y < base; y += 26) { let x = cx - bw0 / 2 - 40 + r() * 30;
    while (x < cx + bw0 / 2 + 40) { const w = 40 + r() * 70; g.fillStyle = `rgba(255,220,200,${r() * .07})`; g.fillRect(x + 2, y + 2, w - 4, 22);
      g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 2; g.strokeRect(x, y, w, 26); x += w; } }
  gr = g.createLinearGradient(0, top, 0, base); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = gr; g.fillRect(0, top, Wc, bh);
  g.restore();
  g.fillStyle = '#5a4544'; g.fillRect(cx - bw1 / 2, top - 6, bw1, 8);
  const tiers = [[820, 150], [690, 132], [560, 118], [440, 108], [330, 128]];
  let y = top;
  for (let i = 0; i < tiers.length; i++) {
    const [w, h] = tiers[i], last = i === tiers.length - 1, wn = last ? 280 : tiers[i + 1][0];
    const wy = y - h;
    gr = g.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0); gr.addColorStop(0, '#3f3035'); gr.addColorStop(.5, '#1d1519'); gr.addColorStop(1, '#0f0a0d');
    g.fillStyle = gr; g.fillRect(cx - w / 2, wy, w, h);
    g.fillStyle = 'rgba(140,110,110,.16)'; g.fillRect(cx - w / 2, wy, w, h * .38);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 2;
    for (let x = cx - w / 2 + 13; x < cx + w / 2; x += 13) { g.beginPath(); g.moveTo(x, wy + h * .5); g.lineTo(x, y); g.stroke(); }
    const n = Math.max(2, Math.floor(w / 105));
    for (let k = 0; k < n; k++) windowLight(g, cx - w / 2 + (k + .5) * w / n - 17, wy + h * .36, 34, 42, r() > .28);
    const ov = last ? 96 : 80, rh = last ? 125 : 64, ey = wy + 8, ty = wy - rh;
    drawRoof(g, cx, ey, w, ov, ty, last ? wn : wn + 30, rh, r);
    if (i === 0 || i === 2) {           // chidori-hafu gable
      g.beginPath(); g.moveTo(cx - 120, ey - 4); g.lineTo(cx, ey - rh - 28); g.lineTo(cx + 120, ey - 4); g.closePath();
      g.fillStyle = '#1a1317'; g.fill(); g.strokeStyle = GOLD; g.lineWidth = 3; g.stroke();
      g.fillStyle = GOLD; g.beginPath(); g.arc(cx, ey - rh * .55, 7, 0, TAU); g.fill();
    }
    if (i === 1) {                      // kara-hafu cusp
      g.beginPath(); g.moveTo(cx - 90, ey + 2); g.quadraticCurveTo(cx - 40, ey - 4, cx, ey - 30); g.quadraticCurveTo(cx + 40, ey - 4, cx + 90, ey + 2);
      g.strokeStyle = GOLD; g.lineWidth = 4; g.stroke();
    }
    if (last) {
      g.fillStyle = '#0d090b'; g.fillRect(cx - wn / 2 - 10, ty - 14, wn + 20, 16);
      g.fillStyle = GOLD; g.fillRect(cx - wn / 2 - 10, ty - 16, wn + 20, 3);
      shachi(g, cx - wn / 2 - 4, ty - 12, -1, 1.2); shachi(g, cx + wn / 2 + 4, ty - 12, 1, 1.2);
    }
    y = ty + 6;
  }
  g.globalCompositeOperation = 'source-atop';
  gr = g.createLinearGradient(0, 0, Wc, 0); gr.addColorStop(0, 'rgba(255,120,70,.26)'); gr.addColorStop(.5, 'rgba(255,120,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, Wc, Hc);
  return c;
}

function paintBranch(seed, w, h, flip) {
  const c = mk(w, h), g = c.getContext('2d'), r = RNG(seed), tips = [];
  if (flip) { g.translate(w, 0); g.scale(-1, 1); }
  function br(x, y, a, len, wid, d) {
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    g.strokeStyle = '#120809'; g.lineCap = 'round'; g.lineWidth = wid; g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo((x + x2) / 2 + (r() - .5) * len * .25, (y + y2) / 2 + (r() - .5) * len * .25, x2, y2); g.stroke();
    if (d <= 2) tips.push([x2, y2], [(x + x2) / 2, (y + y2) / 2]);
    if (d === 0) return;
    const n = d > 2 ? 2 : 1 + (r() < .5 ? 1 : 0);
    for (let i = 0; i < n; i++) br(x2, y2, a + (r() - .5) * 1.1 + .18, len * (.62 + r() * .16), wid * .64, d - 1);
  }
  br(-30, h * .1, .36, w * .3, 30, 4);
  for (const [x, y] of tips) {
    if (x < 30 || x > w - 70 || y < 20 || y > h - 70) continue;
    const n = 5 + (r() * 7 | 0);
    for (let i = 0; i < n; i++) {
      const rr = 6 + r() * 15, px = x + (r() - .5) * 52, py = y + (r() - .5) * 34;
      const gr = g.createRadialGradient(px - rr * .3, py - rr * .3, 1, px, py, rr);
      gr.addColorStop(0, r() > .5 ? '#ffdbe4' : '#f6bccb'); gr.addColorStop(.75, '#d9879f'); gr.addColorStop(1, 'rgba(150,60,90,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(px, py, rr, 0, TAU); g.fill();
    }
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(70,10,30,.3)'; g.fillRect(0, 0, w, h);
  return c;
}

function paintPetal(tone) {
  const c = mk(32, 32), g = c.getContext('2d');
  g.translate(16, 16);
  const gr = g.createLinearGradient(0, -14, 0, 14);
  gr.addColorStop(0, ['#ffe0e8', '#f9c0cf', '#f0a0b6'][tone]); gr.addColorStop(1, ['#e98aa6', '#d06d8c', '#b85676'][tone]);
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, 13);
  g.bezierCurveTo(-13, 4, -11, -10, -3, -13); g.lineTo(0, -9); g.lineTo(3, -13); g.bezierCurveTo(11, -10, 13, 4, 0, 13); g.fill();
  return c;
}

function paintGate() {
  // a yaguramon gate in a plaster wall; the opening is left transparent for the light
  const Wc = 2600, Hc = 760, c = mk(Wc, Hc), g = c.getContext('2d'), cx = Wc / 2, gy = 690, r = RNG(5);
  // walls
  for (const [x0, x1] of [[0, cx - 230], [cx + 230, Wc]]) {
    g.fillStyle = '#3a2f33'; g.fillRect(x0, gy - 230, x1 - x0, 230);
    const gr = g.createLinearGradient(0, gy - 230, 0, gy); gr.addColorStop(0, 'rgba(160,120,120,.2)'); gr.addColorStop(1, 'rgba(0,0,0,.4)');
    g.fillStyle = gr; g.fillRect(x0, gy - 230, x1 - x0, 230);
    g.fillStyle = '#18110f'; g.fillRect(x0, gy - 70, x1 - x0, 70);
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2; for (let x = x0; x < x1; x += 46) g.strokeRect(x + (r() * 6), gy - 70, 46, 35);
    g.fillStyle = '#100b0d'; g.fillRect(x0, gy - 262, x1 - x0, 36);        // tiled cap
    g.fillStyle = '#2a2025'; g.fillRect(x0, gy - 270, x1 - x0, 9);
    g.fillStyle = GOLD; g.fillRect(x0, gy - 228, x1 - x0, 3);
    g.fillStyle = '#0b0708';
    for (let x = x0 + 60; x < x1 - 40; x += 150) { g.beginPath(); g.moveTo(x, gy - 150); g.lineTo(x + 14, gy - 175); g.lineTo(x + 28, gy - 150); g.fill(); }
  }
  // posts and beam

/* =========================================================================
   GENERALS — each NFT kept as drawn; armour, cape and war-flag fitted round it
   ========================================================================= */
const RIGS = {
  fish:   { cx: 572, headH: 650,  tw: 900,  shY: 740,  shL: 140, shR: 1000, torso: '#1a2131', hw: 182, cape: '#2a1a3e', lining: '#6a2f8a' },
  bear:   { cx: 324, headH: 600,  tw: 560,  shY: 670,  shL: 72,  shR: 586,  torso: null,      hw: 182, cape: '#151013', lining: '#6d1420' },
  bucket: { cx: 650, headH: 1150, tw: 1150, shY: 1195, shL: 80,  shR: 1205, torso: '#ececec', hw: 188, cape: '#1b2d88', lining: '#0e1850', ink: true },
  pixel:  { cx: 9,   headH: 12,   tw: 16,   shY: 9,    shL: 1,   shR: 17,   torso: '#0fc4d4', hw: 150, cape: '#7a1422', lining: '#30070c', pixel: true },
};
const FIG = {};

function sodePlate(g, x, y, w, h, ang, ink) {
  g.save(); g.translate(x, y); g.rotate(ang);
  const rows = 5, rh = h / rows;
  for (let i = 0; i < rows; i++) {
    const yy = i * rh, ww = w * (1 + i * .04);
    g.fillStyle = i % 2 ? '#120e11' : '#18121a'; g.fillRect(-ww / 2, yy, ww, rh + 1);
    g.fillStyle = GOLD; g.fillRect(-ww / 2, yy, ww, Math.max(1.2, rh * .1));
    g.fillStyle = CRIMSON_HI; for (let k = 1; k < 5; k++) g.fillRect(-ww / 2 + k * ww / 5 - 1.2, yy + rh * .3, 2.4, rh * .5);
  }
  if (ink) { g.strokeStyle = '#0a0a0a'; g.lineWidth = 5; g.strokeRect(-w / 2 - 2, 0, w * 1.18 + 4, h); }
  g.restore();
}

function buildFigure(name) {
  const R = RIGS[name], img = IMG[name];
  const s = R.hw / R.headH, bustW = img.width * s, bustH = img.height * s, TW = R.tw * s;
  const torsoH = R.torso ? 56 : 0, obiH = 14, kusH = 60, legH = R.pixel ? 70 : 92;
  const lowerH = torsoH + obiH + kusH + legH;
  const pad = 40, cw = Math.max(bustW, TW * 2) + pad * 2, ch = bustH + lowerH + pad * 2;
  const ox = cw / 2, oy = ch - pad;                 // feet
  const by = oy - lowerH;                           // bust bottom
  const bx0 = ox - R.cx * s;                        // bust left
  const back = mk(cw, ch), front = mk(cw, ch), b = back.getContext('2d'), f = front.getContext('2d');
  const shL = [bx0 + R.shL * s, by - (img.height - R.shY) * s], shR = [bx0 + R.shR * s, by - (img.height - R.shY) * s];

  // cape (jinbaori) behind
  b.beginPath(); b.moveTo(shL[0] - 4, shL[1] + 6); b.lineTo(shR[0] + 4, shR[1] + 6);
  b.lineTo(ox + TW * .62, oy - legH * .3);
  b.quadraticCurveTo(ox, oy - legH * .2, ox - TW * .62, oy - legH * .3);
  b.closePath();
  b.fillStyle = R.lining; b.fill();
  b.save(); b.translate(0, -8); b.scale(1, 1); b.fillStyle = R.cape; b.fill(); b.restore();
  b.strokeStyle = GOLD; b.lineWidth = 2.5; b.stroke();

  if (R.pixel) {
    // armour in the sprite's own pixel grid
    const px = s, cols = 18, sx = bx0, rows = Math.round(lowerH / px), pc = mk(cols, rows), pg = pc.getContext('2d');
    const P = (c, x, y, w = 1, h = 1) => { pg.fillStyle = c; pg.fillRect(x, y, w, h); };
    P('#09b5c6', 2, 0, 14, 3); P('#5ad8e6', 4, 0, 3, 1); P('#bdf3f9', 10, 1, 2, 1); P('#06a2b3', 2, 2, 14, 1);
    P(CRIMSON, 2, 3, 14, 1); P(GOLD, 8, 3, 2, 1);
    for (let k = 0; k < 5; k++) { P('#151017', 1 + k * 3.2 | 0, 4, 3, 4); P(GOLD, 1 + k * 3.2 | 0, 4, 3, 1); P(CRIMSON_HI, (1 + k * 3.2 | 0) + 1, 6, 1, 1); }
    P('#1b1419', 3, 8, 5, rows - 9); P('#1b1419', 10, 8, 5, rows - 9); P('#2a2026', 3, rows - 2, 5, 1); P('#2a2026', 10, rows - 2, 5, 1);
    P('#0b0809', 2, rows - 1, 6, 1); P('#0b0809', 10, rows - 1, 6, 1);
    b.imageSmoothingEnabled = false; b.drawImage(pc, sx, by, cols * px, rows * px);
    f.imageSmoothingEnabled = false; f.drawImage(img, bx0, by - bustH, bustW, bustH);
    const so = mk(4, 5), sg = so.getContext('2d');
    sg.fillStyle = '#151017'; sg.fillRect(0, 0, 4, 5); sg.fillStyle = GOLD; sg.fillRect(0, 0, 4, 1); sg.fillStyle = CRIMSON_HI; sg.fillRect(1, 2, 1, 1); sg.fillRect(2, 3, 1, 1);
    f.drawImage(so, bx0 - 2 * px, by - 6 * px, 4 * px, 5 * px); f.drawImage(so, bx0 + 16 * px, by - 6 * px, 4 * px, 5 * px);
  } else {
    let y = by;
    if (R.torso) {
      b.beginPath(); b.moveTo(ox - TW / 2, y - 10); b.lineTo(ox + TW / 2, y - 10); b.lineTo(ox + TW * .42, y + torsoH); b.lineTo(ox - TW * .42, y + torsoH); b.closePath();
      b.fillStyle = R.torso; b.fill();
      const sh = b.createLinearGradient(0, y, 0, y + torsoH); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.35)'); b.fillStyle = sh; b.fill();
      if (R.ink) { b.strokeStyle = '#0a0a0a'; b.lineWidth = 6; b.stroke(); }
      y += torsoH;
    }
    const ow = TW * (R.torso ? .86 : .9);
    b.fillStyle = '#7a1522'; b.fillRect(ox - ow / 2, y - 4, ow, obiH + 4); b.fillStyle = GOLD; b.fillRect(ox - ow / 2, y + obiH * .4, ow, 2.2);
    if (R.ink) { b.strokeStyle = '#0a0a0a'; b.lineWidth = 4; b.strokeRect(ox - ow / 2, y - 4, ow, obiH + 4); }
    y += obiH;
    // hakama legs
    const lt = y + kusH - 16, lw0 = TW * .22, lw1 = TW * .28;
    for (const sgn of [-1, 1]) {
      b.beginPath(); b.moveTo(ox + sgn * 4, lt); b.lineTo(ox + sgn * (4 + lw0), lt); b.lineTo(ox + sgn * (4 + lw1), oy - 8); b.lineTo(ox + sgn * 6, oy - 8); b.closePath();
      b.fillStyle = '#1c1519'; b.fill(); b.strokeStyle = 'rgba(255,255,255,.05)'; b.lineWidth = 2;
      for (let k = 1; k < 4; k++) { b.beginPath(); b.moveTo(ox + sgn * (4 + lw0 * k / 4), lt); b.lineTo(ox + sgn * (5 + lw1 * k / 4), oy - 8); b.stroke(); }
      b.fillStyle = '#0c0809'; b.beginPath(); b.ellipse(ox + sgn * (6 + lw1 * .55), oy - 4, lw1 * .62, 8, 0, 0, TAU); b.fill();
    }
    // kusazuri tassets
    const kw1 = ow * 1.2, n = 5;
    for (let i = 0; i < n; i++) {
      const a0 = i / n, a1 = (i + 1) / n;
      const xt0 = ox - ow / 2 + a0 * ow + 2, xt1 = ox - ow / 2 + a1 * ow - 2, xb0 = ox - kw1 / 2 + a0 * kw1 + 2, xb1 = ox - kw1 / 2 + a1 * kw1 - 2;
      b.beginPath(); b.moveTo(xt0, y); b.lineTo(xt1, y); b.lineTo(xb1, y + kusH); b.lineTo(xb0, y + kusH); b.closePath();
      const kg = b.createLinearGradient(0, y, 0, y + kusH); kg.addColorStop(0, '#1d161c'); kg.addColorStop(1, '#0d090c'); b.fillStyle = kg; b.fill();
      if (R.ink) { b.strokeStyle = '#0a0a0a'; b.lineWidth = 3; b.stroke(); }
      for (let k = 1; k <= 4; k++) { const v = k / 5, yy = y + kusH * v;
        b.fillStyle = 'rgba(201,162,74,.75)'; b.fillRect(lerp(xt0, xb0, v), yy - 1, lerp(xt1, xb1, v) - lerp(xt0, xb0, v), 1.6);
        b.fillStyle = CRIMSON_HI; for (let m = 1; m < 4; m++) b.fillRect(lerp(lerp(xt0, xb0, v), lerp(xt1, xb1, v), m / 4) - 1, yy + 2, 2, 5); }
    }
    // the NFT itself, untouched
    f.drawImage(img, bx0, by - bustH, bustW, bustH);
    const sw = TW * .27, shh = TW * .33;
    sodePlate(f, shL[0] + sw * .15, shL[1] - shh * .05, sw, shh, .22, R.ink);
    sodePlate(f, shR[0] - sw * .15, shR[1] - shh * .05, sw, shh, -.22, R.ink);
  }
  const F = { name, back, front, ox, oy, lowerH, bustH, TW, headTop: lowerH + bustH, s, cw, ch, flagX: TW * .28, var: {} };
  FIG[name] = F;
  return F;
}

// light a figure layer: multiply grade, then a rim on the side facing the light
function variant(src, mask, mul, rim) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  if (mul) { g.globalCompositeOperation = 'multiply'; g.fillStyle = mul; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(src, 0, 0); }
  if (rim) {
    const rc = mk(src.width, src.height), rg = rc.getContext('2d');
    rg.drawImage(mask, 0, 0); rg.globalCompositeOperation = 'source-in'; rg.fillStyle = rim.color; rg.fillRect(0, 0, rc.width, rc.height);
    rg.globalCompositeOperation = 'destination-out'; rg.filter = `blur(${rim.blur}px)`; rg.drawImage(mask, rim.dx, rim.dy); rg.filter = 'none';
    rg.globalCompositeOperation = 'destination-in'; rg.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = rim.alpha; g.drawImage(rc, 0, 0);
  }
  return c;
}
function silhouette(F, rimCol) {
  const c = mk(F.cw, F.ch), g = c.getContext('2d');
  g.drawImage(F.back, 0, 0); g.drawImage(F.front, 0, 0);
  const m = mk(F.cw, F.ch); m.getContext('2d').drawImage(c, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0d090c'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over';
  const rc = mk(F.cw, F.ch), rg = rc.getContext('2d');
  rg.drawImage(m, 0, 0); rg.globalCompositeOperation = 'source-in'; rg.fillStyle = rimCol; rg.fillRect(0, 0, F.cw, F.ch);
  rg.globalCompositeOperation = 'destination-out'; rg.filter = 'blur(3px)'; rg.drawImage(m, 0, 7); rg.filter = 'none';
  return { sil: c, rim: rc };
}

function prepFigures() {
  for (const n of Object.keys(RIGS)) {
    const F = buildFigure(n);
    const all = mk(F.cw, F.ch), ag = all.getContext('2d'); ag.drawImage(F.back, 0, 0); ag.drawImage(F.front, 0, 0);
    F.var.warm = { back: variant(F.back, all, '#e6c9c4', { color: '#ffb47a', dx: 6, dy: 4, blur: 2, alpha: .75 }),
                   front: variant(F.front, all, '#e6c9c4', { color: '#ffb47a', dx: 6, dy: 4, blur: 2, alpha: .75 }) };
    F.var.green = { back: variant(F.back, all, '#cdbfcf', { color: '#7dff8a', dx: -7, dy: 2, blur: 3, alpha: .7 }),
                    front: variant(F.front, all, '#cdbfcf', { color: '#7dff8a', dx: -7, dy: 2, blur: 3, alpha: .7 }) };
    F.var.dusk = { back: variant(F.back, all, '#b9a2ad', null), front: variant(F.front, all, '#b9a2ad', null) };
    Object.assign(F.var, { sil: silhouette(F, '#ffcf8f') });
  }
}

function drawFlag(g, F, t, dark) {
  const n = F.name, fx = F.flagX, top = -F.headTop - 92, fw = 46, fh = 118, sway = Math.sin(t * 2.3 + fx) * 4;
  g.fillStyle = '#120c0b'; g.fillRect(fx - 2.5, top - 8, 5, F.headTop * .55 + 100);
  g.save(); g.translate(fx + 2, top); g.transform(1, sway * .004, 0, 1, 0, 0);
  if (n === 'pixel') { g.imageSmoothingEnabled = false; g.drawImage(IMG.rays, 8, 0, 14, 18, 0, 0, fw, fh); }
  else {
    g.fillStyle = { bear: '#141012', fish: '#3a2160', bucket: '#2747c9' }[n]; g.fillRect(0, 0, fw, fh);
    if (n === 'bear') { g.fillStyle = GOLD; g.beginPath(); g.moveTo(9, 64); g.lineTo(9, 36); g.lineTo(16, 48); g.lineTo(23, 30); g.lineTo(30, 48); g.lineTo(37, 36); g.lineTo(37, 64); g.fill(); }
    if (n === 'fish') { g.fillStyle = '#e9e6dc'; g.fillRect(0, 30, fw, 18); g.fillStyle = '#d06bb0'; g.beginPath(); g.arc(fw / 2, 80, 12, 0, TAU); g.fill(); }
    if (n === 'bucket') { g.strokeStyle = '#fff'; g.lineWidth = 4; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(13 + k * 10, 58, 6, Math.PI, TAU * .95); g.stroke(); } }
  }
  g.fillStyle = GOLD; g.fillRect(0, 0, fw, 4);
  if (dark) { g.fillStyle = 'rgba(8,5,8,.62)'; g.fillRect(0, 0, fw, fh); }
  g.restore();

// x,y = feet; o: {v:'warm'|'green'|'dusk', dip, rot, flip, t, sil, rimA, alpha}
function drawFigure(g, name, x, y, sc, o = {}) {
  const F = FIG[name];
  g.save(); g.translate(x, y); g.scale(sc, sc); if (o.flip) g.scale(-1, 1);
  if (o.alpha != null) g.globalAlpha = o.alpha;
  if (!o.noFlag) drawFlag(g, F, o.t || 0, !!o.sil);
  if (F.name === 'pixel') g.imageSmoothingEnabled = false;
  if (o.sil) {
    g.drawImage(F.var.sil.sil, -F.ox, -F.oy);
    if (o.rimA) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = o.rimA; g.drawImage(F.var.sil.rim, -F.ox, -F.oy); }
    g.restore(); return;
  }
  const V = F.var[o.v || 'warm'];
  g.drawImage(V.back, -F.ox, -F.oy);
  g.translate(0, -F.lowerH + (o.dip || 0)); g.rotate(o.rot || 0); g.translate(0, F.lowerH);
  g.drawImage(V.front, -F.ox, -F.oy);
  g.restore();
}

/* =========================================================================
   THE STRANGER — warhorse and rider, drawn in vector each frame
   Local units: ground y=0, up is -y, horse faces +x; withers ≈ 410 units.
   ========================================================================= */
const GAIT = { P: .8, D: .62, sweep: 180, lift: 46 };
GAIT.stride = GAIT.sweep / GAIT.D;                   // units travelled per cycle
// global gait clock — one horse, one rhythm, shared by picture and sound
function gaitPhase(t) {
  if (t < 5) return 0;
  const tA = 10.35, T = .6;
  if (t <= tA) return (t - 5) / GAIT.P;
  const u = Math.min(t - tA, T);
  return (tA - 5) / GAIT.P + (u - u * u / (2 * T)) / GAIT.P;
}
function gaitAmp(t) { return 1 - sstep(10.35, 10.95, t); }

function rimFill(g, path, dark, rim, dx, dy) {
  g.save(); path(); g.fillStyle = rim; g.fill(); g.clip();
  g.translate(dx, dy); path(); g.fillStyle = dark; g.fill(); g.restore();
}

function legIK(rx, ry, tx, ty, L1, L2, bend) {
  const dx = tx - rx, dy = ty - ry; let d = Math.hypot(dx, dy); d = clamp(d, Math.abs(L1 - L2) + .01, L1 + L2 - .01);
  const a = Math.atan2(dy, dx), b = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [rx + Math.cos(a + bend * b) * L1, ry + Math.sin(a + bend * b) * L1];
}
function capsulePath(g, pts, ws) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a), ny = Math.cos(a);
    g.moveTo(x0 + nx * ws[i] / 2, y0 + ny * ws[i] / 2); g.lineTo(x1 + nx * ws[i + 1] / 2, y1 + ny * ws[i + 1] / 2);
    g.lineTo(x1 - nx * ws[i + 1] / 2, y1 - ny * ws[i + 1] / 2); g.lineTo(x0 - nx * ws[i] / 2, y0 - ny * ws[i] / 2); g.closePath();
    g.moveTo(x1 + ws[i + 1] / 2, y1); g.arc(x1, y1, ws[i + 1] / 2, 0, TAU, true);
  }
}
function legPose(front, phase, amp, bodyY) {
  const root = front ? [150, -262 + bodyY] : [-168, -266 + bodyY];
  const L1 = front ? 112 : 104, L2 = front ? 90 : 104, past = 30;
  let p = ((phase % 1) + 1) % 1, fx, fy;
  const S = GAIT.sweep * amp, lift = GAIT.lift * amp;
  if (p < GAIT.D) { const u = p / GAIT.D; fx = S / 2 - S * u; fy = 0; }
  else { const u = (p - GAIT.D) / (1 - GAIT.D); fx = -S / 2 + S * eio(u); fy = -lift * Math.sin(Math.PI * u); }
  const hoof = [root[0] + (front ? 10 : 18) + fx, fy], fet = [hoof[0] - (front ? 6 : 8), hoof[1] - past];
  const joint = legIK(root[0], root[1], fet[0], fet[1], L1, L2, front ? -1 : 1);
  return { pts: [root, joint, fet, hoof], ws: front ? [58, 32, 24, 27] : [84, 34, 24, 27] };
}
function hoofPath(g, h) { const [x, y] = h; g.moveTo(x - 15, y); g.lineTo(x + 16, y); g.lineTo(x + 11, y - 18); g.lineTo(x - 12, y - 18); g.closePath(); }

function bodyPath(g, by) {
  g.beginPath();
  g.moveTo(-225, -265 + by);
  g.bezierCurveTo(-246, -300 + by, -246, -345 + by, -226, -372 + by);
  g.bezierCurveTo(-205, -406 + by, -140, -406 + by, -80, -392 + by);
  g.bezierCurveTo(-20, -385 + by, 60, -392 + by, 120, -410 + by);
  g.lineTo(178, -392 + by);
  g.bezierCurveTo(216, -370 + by, 229, -320 + by, 219, -280 + by);
  g.bezierCurveTo(210, -250 + by, 190, -232 + by, 150, -225 + by);
  g.bezierCurveTo(60, -205 + by, -80, -205 + by, -150, -220 + by);
  g.bezierCurveTo(-185, -228 + by, -205, -240 + by, -225, -265 + by);
  g.closePath();
}
function neckPath(g) {
  g.beginPath();
  g.moveTo(96, -402);
  g.bezierCurveTo(150, -470, 212, -562, 262, -588);
  g.quadraticCurveTo(282, -598, 300, -578);
  g.bezierCurveTo(330, -545, 365, -500, 386, -466);
  g.quadraticCurveTo(398, -448, 386, -436);
  g.quadraticCurveTo(372, -428, 352, -436);
  g.bezierCurveTo(330, -444, 318, -452, 300, -458);
  g.bezierCurveTo(282, -462, 270, -470, 266, -484);
  g.bezierCurveTo(250, -440, 222, -395, 205, -350);
  g.lineTo(150, -330); g.closePath();
}
function earPath(g, dx) { g.beginPath(); g.moveTo(258 + dx, -586); g.quadraticCurveTo(250 + dx, -622, 266 + dx, -640); g.quadraticCurveTo(280 + dx, -612, 282 + dx, -590); g.closePath(); }

function tassel(g, x, y, len, t, ph) {
  const sw = Math.sin(t * 7 + ph) * 5;
  g.strokeStyle = CRIMSON_HI; g.lineWidth = 3;
  for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + k * 3 + sw * .5, y + len * .5, x + k * 4 + sw, y + len); g.stroke(); }
  g.fillStyle = GOLD; g.beginPath(); g.arc(x, y + 2, 4, 0, TAU); g.fill();

function tile(g, img, x, y, w, h, alpha = 1) {     // horizontally wrapping strip

function initPetals() {
  const r = RNG(77);
  for (let i = 0; i < 260; i++) PETALS.push({ x: r() * (W + 400), y: r() * (H + 300), z: .35 + r() * r() * 1.9, vx: -40 - r() * 70, vy: 55 + r() * 60,
    sw: 15 + r() * 45, f: .6 + r() * 1.6, ph: r() * TAU, rot: r() * TAU, vr: (r() - .5) * 5, fl: 2 + r() * 5, k: r() * 3 | 0 });
}
// o: {wind, n, sizeMul, swirl:{x,y,rx,ry,k,spin}, burst:{x,y,t0,k}, minZ, maxZ, alpha}
function petals(g, t, o = {}) {
  const wind = o.wind ?? 1, n = Math.min(PETALS.length, o.n ?? 160), sm = o.sizeMul ?? 1;
  for (let i = 0; i < n; i++) {
    const p = PETALS[i];
    if (o.minZ != null && p.z < o.minZ) continue; if (o.maxZ != null && p.z >= o.maxZ) continue;
    let x = ((p.x + p.vx * wind * t * p.z + p.sw * Math.sin(p.f * t + p.ph)) % (W + 400) + (W + 400)) % (W + 400) - 200;
    let y = ((p.y + p.vy * t * (.6 + p.z * .4)) % (H + 300) + (H + 300)) % (H + 300) - 150;
    if (o.swirl) { const s = o.swirl, a = p.ph + t * (s.spin ?? 1.4) * (1 + p.f * .4), rr = .35 + .65 * ((i * 0.618) % 1);
      const sx = s.x + Math.cos(a) * s.rx * rr, sy = s.y + Math.sin(a) * s.ry * rr - ((t * 60 * p.f + p.y) % 300) * .3;
      x = lerp(x, sx, s.k); y = lerp(y, sy, s.k); }
    if (o.burst) { const b = o.burst, u = Math.max(0, t - b.t0 - (i % 17) * .03), ang = p.ph, sp = 220 + p.sw * 9;
      const bx = b.x + Math.cos(ang) * sp * u * (1 + u), by = b.y + Math.sin(ang) * sp * .45 * u * (1 + u) - 40 * u;
      x = lerp(x, bx, b.k); y = lerp(y, by, b.k); }
    const size = 13 * p.z * sm;
    g.save(); g.globalAlpha = (o.alpha ?? 1) * clamp(.35 + p.z * .5);
    g.translate(x, y); g.rotate(p.rot + p.vr * t); g.scale(1, Math.cos(p.fl * t + p.ph) * .8 + .2 * Math.sign(Math.cos(p.fl * t + p.ph) || 1));
    g.drawImage(p.z > 1.35 ? L.petalBlur[p.k] : L.petal[p.k], -size / 2, -size / 2, size, size);
    g.restore();
  }
}

  // dust at each footfall
  for (let k = 0; k < 4; k++) { const off = [.5, .75, 0, .25][k], fp = ph + off, last = Math.floor(fp), u = (fp - last) * GAIT.P;

  { a: 12.52, b: 13.98, jp: 'なんという威圧感だ……', en: 'What an overwhelming presence…' },

let BUF;

function draw(t) {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const live = SHOTS.filter(s => t >= s.a && t < s.b);
  live.forEach((s, i) => {
    if (i === 0) { s.f(g, t); return; }
    const prev = live[i - 1], a = clamp((t - s.a) / (prev.b - s.a));
    const bg = BUF.getContext('2d'); bg.setTransform(1, 0, 0, 1, 0, 0); bg.globalAlpha = 1; bg.globalCompositeOperation = 'source-over';
    bg.fillStyle = '#000'; bg.fillRect(0, 0, W, H); s.f(bg, t); bg.setTransform(1, 0, 0, 1, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = eio(a); g.drawImage(BUF, 0, 0); g.globalAlpha = 1;
  });
  post(g, t);
}

/* fades, vignette, grain, letterbox, subtitles and title — shared by both versions */
function post(g, t, o = {}) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  // fades: in from black, dip at the scene-3 boundary, out to black
  const fade = Math.max(1 - sstep(0, .9, t), bump(t, 9.78, 10.22) * 1.0, t >= 14.4 ? 1 : 0);
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
  // vignette and grain
  if (o.vignette !== false) g.drawImage(L.vignette, 0, 0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = o.grain ?? .1; g.drawImage(L.grain[Math.floor(t * 30) % L.grain.length], 0, 0, W, H);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  // letterbox
  g.fillStyle = '#000'; g.fillRect(0, 0, W, 64); g.fillRect(0, H - 64, W, 64);
  // subtitles
  for (const s of SUBS) {
    const a = sstep(s.a, s.a + .12, t) * (1 - sstep(s.b - .12, s.b, t)); if (a <= 0) continue;
    g.save(); g.globalAlpha = a; g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = 14;
    g.font = '700 52px "Shippori Mincho B1", serif'; g.fillStyle = '#f6ecda'; g.fillText(s.jp, W / 2, 944);

    g.restore();
  }
  // title on black
  const ta = sstep(14.52, 14.78, t);
  if (ta > 0) {
    g.save(); g.globalAlpha = ta; g.textAlign = 'center';
    g.font = '800 92px "Shippori Mincho B1", serif'; g.fillStyle = '#efe3cc'; g.shadowColor = 'rgba(200,30,40,.6)'; g.shadowBlur = 30; g.fillText('名もなき将軍', W / 2, 540);

    const txt = 'T H E   U N K N O W N   G E N E R A L'; g.fillText(txt, W / 2, 612);
    g.fillRect(W / 2 - 220, 640, 440, 2);
    g.restore();
  }
}

/* =========================================================================
   SCORE — taiko, koto, shakuhachi, wind and hooves, synthesised
   ========================================================================= */
function buildScore(ac, t0, out) {
  const SR = ac.sampleRate, R = RNG(2024);
  const master = ac.createGain(); master.gain.value = .62;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .25;
  master.connect(comp); comp.connect(out);
  const ir = ac.createBuffer(2, SR * 3.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = .45; verb.connect(vg); vg.connect(master);
  const dry = ac.createGain(); dry.connect(master);
  const nb = ac.createBuffer(1, SR * 2, SR); { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const T = x => t0 + x;
  const noiseSrc = (at, dur) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; s.start(T(at), R() * 1.5); s.stop(T(at + dur)); return s; };
  const send = (node, wet = .5) => { node.connect(dry); const w = ac.createGain(); w.gain.value = wet; node.connect(w); w.connect(verb); };

  function taiko(at, p, wet = .55) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(130, T(at)); o.frequency.exponentialRampToValueAtTime(46, T(at + .3));
    g.gain.setValueAtTime(0, T(at)); g.gain.linearRampToValueAtTime(p, T(at + .005)); g.gain.exponentialRampToValueAtTime(.0005, T(at + 1.4));
    o.connect(g); send(g, wet); o.start(T(at)); o.stop(T(at + 1.5));
    const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.frequency.setValueAtTime(240, T(at)); o2.frequency.exponentialRampToValueAtTime(90, T(at + .12));
    g2.gain.setValueAtTime(p * .35, T(at)); g2.gain.exponentialRampToValueAtTime(.0005, T(at + .3)); o2.connect(g2); send(g2, wet); o2.start(T(at)); o2.stop(T(at + .35));
    const n = noiseSrc(at, .2), f = ac.createBiquadFilter(), ng = ac.createGain(); f.type = 'lowpass'; f.frequency.value = 1100;
    ng.gain.setValueAtTime(p * .5, T(at)); ng.gain.exponentialRampToValueAtTime(.0005, T(at + .16)); n.connect(f); f.connect(ng); send(ng, wet);
  }
  function boom(at, p) {
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(56, T(at)); o.frequency.exponentialRampToValueAtTime(30, T(at + 1.8));
    g.gain.setValueAtTime(0, T(at)); g.gain.linearRampToValueAtTime(p, T(at + .01)); g.gain.exponentialRampToValueAtTime(.0005, T(at + 2.6));
    o.connect(g); send(g, .3); o.start(T(at)); o.stop(T(at + 2.7));
  }
  function koto(at, f, p = .16) {
    const g = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
    lp.frequency.setValueAtTime(5200, T(at)); lp.frequency.exponentialRampToValueAtTime(700, T(at + .5));
    g.gain.setValueAtTime(0, T(at)); g.gain.linearRampToValueAtTime(p, T(at + .003)); g.gain.exponentialRampToValueAtTime(.0005, T(at + 1.9));
    for (const [type, m] of [['sawtooth', 1], ['triangle', 2.003]]) { const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * m * 1.012, T(at)); o.frequency.exponentialRampToValueAtTime(f * m, T(at + .06)); o.connect(lp); o.start(T(at)); o.stop(T(at + 2)); }
    lp.connect(g); send(g, .6);
  }
  function flute(at, dur, f0, f1, p = .07) {
    const o = ac.createOscillator(), g = ac.createGain(), vib = ac.createOscillator(), vg = ac.createGain();
    o.frequency.setValueAtTime(f0, T(at)); o.frequency.exponentialRampToValueAtTime(f1, T(at + dur * .5));
    vib.frequency.value = 5.2; vg.gain.setValueAtTime(0, T(at)); vg.gain.linearRampToValueAtTime(f1 * .008, T(at + dur)); vib.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0, T(at)); g.gain.linearRampToValueAtTime(p, T(at + .35)); g.gain.setValueAtTime(p, T(at + dur - .4)); g.gain.linearRampToValueAtTime(0, T(at + dur));
    o.connect(g); send(g, .8); o.start(T(at)); o.stop(T(at + dur)); vib.start(T(at)); vib.stop(T(at + dur));
    const n = noiseSrc(at, dur), bp = ac.createBiquadFilter(), ng = ac.createGain(); bp.type = 'bandpass'; bp.frequency.value = f1 * 2; bp.Q.value = 6;
    ng.gain.setValueAtTime(0, T(at)); ng.gain.linearRampToValueAtTime(p * .9, T(at + .15)); ng.gain.linearRampToValueAtTime(p * .25, T(at + .6)); ng.gain.linearRampToValueAtTime(0, T(at + dur));
    n.connect(bp); bp.connect(ng); send(ng, .8);
  }
  function drone(a, b, freqs, p, cut0, cut1) {
    const lp = ac.createBiquadFilter(), g = ac.createGain(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut0, T(a)); lp.frequency.linearRampToValueAtTime(cut1, T(b));
    g.gain.setValueAtTime(0, T(a)); g.gain.linearRampToValueAtTime(p, T(a + 1.2)); g.gain.setValueAtTime(p, T(b - .25)); g.gain.linearRampToValueAtTime(0, T(b));
    for (const f of freqs) for (const d of [-7, 7]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = d; o.connect(lp); o.start(T(a)); o.stop(T(b + .05)); }
    lp.connect(g); send(g, .4);
  }
  function wind(a, b, pts) {
    const n = noiseSrc(a, b - a), bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = .8;
    bp.frequency.setValueAtTime(380, T(a)); g.gain.setValueAtTime(0, T(a));
    for (const [x, gain, f] of pts) { g.gain.linearRampToValueAtTime(gain, T(x)); bp.frequency.linearRampToValueAtTime(f, T(x)); }
    n.connect(bp); bp.connect(g); send(g, .3);
  }
  function hoof(at, p, far) {
    const n = noiseSrc(at, .09), bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.frequency.value = far ? 650 : 1500 + R() * 300; bp.Q.value = 1.6;
    g.gain.setValueAtTime(p * .9, T(at)); g.gain.exponentialRampToValueAtTime(.0005, T(at + .07)); n.connect(bp); bp.connect(g);
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(170, T(at)); o.frequency.exponentialRampToValueAtTime(62, T(at + .07));
    og.gain.setValueAtTime(p, T(at)); og.gain.exponentialRampToValueAtTime(.0005, T(at + .11)); o.connect(og); o.start(T(at)); o.stop(T(at + .12));
    if (far) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; g.connect(lp); og.connect(lp); send(lp, .9); }
    else { send(g, .35); send(og, .35); }
  }
  function creak(a, dur, p) {
    const o = ac.createOscillator(), bp = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 7;
    o.frequency.setValueAtTime(52, T(a)); for (let i = 1; i <= 12; i++) o.frequency.linearRampToValueAtTime(46 + R() * 30, T(a + dur * i / 12));
    g.gain.setValueAtTime(0, T(a)); g.gain.linearRampToValueAtTime(p, T(a + .2)); g.gain.linearRampToValueAtTime(0, T(a + dur));
    o.connect(bp); bp.connect(g); send(g, .7); o.start(T(a)); o.stop(T(a + dur));
  }
  function riser(a, b, p) {
    const n = noiseSrc(a, b - a), hp = ac.createBiquadFilter(), g = ac.createGain(); hp.type = 'bandpass'; hp.Q.value = 1.2;
    hp.frequency.setValueAtTime(300, T(a)); hp.frequency.exponentialRampToValueAtTime(5000, T(b));
    g.gain.setValueAtTime(.0005, T(a)); g.gain.exponentialRampToValueAtTime(p, T(b - .02)); g.gain.linearRampToValueAtTime(0, T(b));
    n.connect(hp); hp.connect(g); send(g, .5);
  }
  function snort(at) {
    const n = noiseSrc(at, .45), bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 3;
    bp.frequency.setValueAtTime(1300, T(at)); bp.frequency.exponentialRampToValueAtTime(380, T(at + .4));
    g.gain.setValueAtTime(0, T(at)); g.gain.linearRampToValueAtTime(.22, T(at + .03)); g.gain.exponentialRampToValueAtTime(.0005, T(at + .42)); n.connect(bp); bp.connect(g); send(g, .3);
  }

  // D "in" scale: D Eb G A Bb
  const N = { D3: 146.8, G3: 196, A3: 220, Bb3: 233.1, D4: 293.7, Eb4: 311.1, G4: 392, A4: 440, Bb4: 466.2, D5: 587.3 };
  // scene 1 — stately
  taiko(.05, .9); boom(.05, .5);
  drone(0, 5.2, [73.4, 110], .05, 600, 900);
  [[.7, N.D5], [1.0, N.A4], [1.3, N.Bb4], [1.9, N.A4], [2.2, N.G4], [2.55, N.D4], [3.1, N.Eb4], [3.4, N.D4], [3.8, N.A3], [4.3, N.D4]].forEach(([a, f]) => koto(a, f));
  flute(1.4, 2.4, N.G4, N.A4, .06);
  taiko(2.7, .45); taiko(3.9, .3);
  wind(0, 15, [[1, .03, 420], [4.6, .04, 500], [5.4, .13, 820], [7, .09, 620], [10, .07, 520], [14.3, .05, 480], [14.6, 0, 400]]);
  // scene 2 — the air turns
  taiko(4.95, .95); boom(4.95, .55);
  drone(4.9, 10.1, [73.4, 77.8, 110], .07, 300, 1400);
  creak(6.25, 1.15, .14); taiko(6.3, .8); boom(7.35, .45);
  for (let i = 0; i < 10; i++) taiko(7.4 + i * .08 - i * i * .002, .18 + i * .05, .4);
  taiko(8.12, 1); boom(8.12, .6);
  koto(8.5, N.D4, .12); koto(8.8, N.Eb4, .12);
  taiko(9.15, .5); riser(9.0, 9.6, .12); taiko(9.6, .7);
  // scene 3 — who is he?
  drone(10.0, 14.42, [73.4, 103.8, 146.8], .06, 400, 2600);
  taiko(10.02, .9); boom(10.02, .5); snort(10.95);
  taiko(11.25, .45); koto(11.3, N.A3, .1); taiko(12.45, .45); koto(12.5, N.Bb3, .1);
  riser(12.9, 13.55, .16); taiko(13.55, 1); boom(13.55, .7);
  riser(13.95, 14.4, .2); taiko(14.4, 1.1, .7); boom(14.4, .9);
  // hooves, sharing the picture's gait clock
  const offs = [0, .25, .5, .75];
  let prev = gaitPhase(5.0);
  for (let x = 5.0; x < 11.2; x += .005) {
    const cur = gaitPhase(x);
    for (const o of offs) if (Math.floor(prev + o) !== Math.floor(cur + o)) {
      const far = x < 6.9, p = (x < 6.3 ? .12 : x < 7.2 ? .25 : x < 8.1 ? .45 : .7) * (.85 + R() * .3) * gaitAmp(x);
      if (p > .02) hoof(x, p, far);
    }
    prev = cur;
  }
}

function wavBase64(buf) {
  const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate, ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const S = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  S(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); S(8, 'WAVE'); S(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, ch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  S(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const data = []; for (let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { v.setInt16(o, Math.max(-1, Math.min(1, data[c][i])) * 32767, true); o += 2; }
  const bytes = new Uint8Array(ab); let s = ''; for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(s);
}

/* =========================================================================
   BOOT
   ========================================================================= */
async function init() {
  await Promise.all(Object.entries(SRC).map(([k, s]) => loadImg(k, s)));
  await Promise.all([
    document.fonts.load('700 52px "Shippori Mincho B1"', '誰だ、あの男は？なんという威圧感だ……'),
    document.fonts.load('800 92px "Shippori Mincho B1"', '名もなき将軍'),
    document.fonts.load('italic 600 36px "Cormorant Garamond"', 'Who is that man?'),
    document.fonts.load('600 34px "Cormorant Garamond"', 'THE UNKNOWN GENERAL'),
  ]).catch(() => {});
  BUF = mk(W, H);
  L.mtnFar = paintRidge(3, 2800, 520, 120, 150, .0023, '#4a1b28', '#5a2630', 'rgba(255,170,120,.4)', 0);
  L.mtnMid = paintRidge(4, 2800, 520, 150, 120, .0035, '#2a0f19', '#38161f', 'rgba(255,150,110,.28)', 10);
  L.mtnNear = paintRidge(5, 2900, 520, 120, 90, .005, '#170a10', '#120a0d', 'rgba(255,140,100,.2)', 22);
  L.mistWarm = paintMist(8, 2400, 300, '235,170,165');
  L.mistDark = paintMist(9, 2400, 260, '45,25,35', 140, .12, .25);
  L.clouds = paintClouds(10, 2600, 560);
  L.castle = paintCastle(); L.castleBlur = blurred(L.castle, 7);
  L.branchBlur = blurred(paintBranch(21, 980, 560, false), 5);
  L.branchBlurR = blurred(paintBranch(22, 980, 520, true), 6);
  L.petal = [0, 1, 2].map(paintPetal); L.petalBlur = L.petal.map(p => blurred(p, 2));
  L.gate = paintGate(); L.door = paintDoor();
  L.grain = [1, 2, 3, 4].map(s => paintNoise(s, 640, 360));
  L.vignette = mk(W, H); { const g = L.vignette.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.75)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  GLOW.eyes = mk(IMG.eyes.width * 1.5, IMG.eyes.height * 2); { const g = GLOW.eyes.getContext('2d'); g.filter = 'blur(26px)'; g.drawImage(IMG.eyes, IMG.eyes.width * .25, IMG.eyes.height * .5); }
  GLOW.katana = mk(IMG.katana.width * 1.2, IMG.katana.height * 1.8); { const g = GLOW.katana.getContext('2d'); g.filter = 'blur(22px)'; g.drawImage(IMG.katana, IMG.katana.width * .1, IMG.katana.height * .4); }
  prepFigures(); initPetals();
}

const ready = init();
window.TRAILER = {
  ready, DUR, draw,
  frame(t, q = .93) { draw(t); return cv.toDataURL('image/jpeg', q); },
  post,
  // ---- for the Blender version: composite rendered shots, then the shared overlay
  async compose(t, layers, q = .95) {
    const g = ctx; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    for (const { url, alpha } of layers) { const i = new Image(); i.src = url; await i.decode(); g.globalAlpha = alpha; g.drawImage(i, 0, 0, W, H); }
    // bloom: the bright parts, blurred and screened back over the frame
    BUF.getContext('2d').drawImage(cv, 0, 0);
    g.globalAlpha = .4; g.globalCompositeOperation = 'screen'; g.filter = 'brightness(.85) contrast(2.8) blur(22px)'; g.drawImage(BUF, 0, 0);
    g.globalAlpha = .3; g.filter = 'contrast(2) blur(60px)'; g.drawImage(BUF, 0, 0);
    g.filter = 'none'; g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    post(g, t, { grain: .06 }); return cv.toDataURL('image/jpeg', q);
  },
  // ---- sprites exported as transparent PNGs for the 3D scene
  sprite: {
    figure(name, v, part) {
      const F = FIG[name], top = 130, c = mk(F.cw, F.ch + top), g = c.getContext('2d');
      g.translate(F.ox, F.oy + top);
      if (v === 'sil') { drawFlag(g, F, 0, true); g.drawImage(F.var.sil.sil, -F.ox, -F.oy); g.globalCompositeOperation = 'lighter'; g.drawImage(F.var.sil.rim, -F.ox, -F.oy); }
      else if (part === 'back') { drawFlag(g, F, 0, false); g.drawImage(F.var[v].back, -F.ox, -F.oy); }
      else g.drawImage(F.var[v].front, -F.ox, -F.oy);
      return { url: c.toDataURL('image/png'), w: c.width, h: c.height, feetX: F.ox, feetY: F.oy + top, pivotY: F.oy + top - F.lowerH };
    },
    rider(t, o = {}) {
      const S = 1.5, c = mk(760 * S, 800 * S), g = c.getContext('2d');
      g.translate(330 * S, 780 * S); g.scale(S, S);
      drawRider(g, { t, phase: gaitPhase(t), amp: gaitAmp(t), rim: o.rim || '#ff9c66', toss: o.toss || 0, eye: o.eye ?? 1 });
      return { url: c.toDataURL('image/png'), w: c.width, h: c.height, feetX: 330 * S, feetY: 780 * S, unit: S };
    },
    riderFront(t, eyeA) {
      const S = 1.2, c = mk(560 * S, 820 * S), g = c.getContext('2d');
      g.translate(280 * S, 790 * S); g.scale(S, S); drawRiderFront(g, gaitPhase(t), eyeA, t);
      return { url: c.toDataURL('image/png'), w: c.width, h: c.height, feetX: 280 * S, feetY: 790 * S, unit: S };
    },
    banner(color, plain) {
      const c = mk(256, 1024), g = c.getContext('2d'); g.scale(256 / 70, 1024 / 280);
      nobori(g, 0, 0, 64, 280, 0, 0, { amp: 0, below: 0, color, plain });
      return { url: c.toDataURL('image/png'), w: 256, h: 1024 };
    },
  },
  async audio(sr = 48000) { const oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildScore(oc, 0, oc.destination); return wavBase64(await oc.startRendering()); },
};

/* ---------- player ---------- */
const ui = document.getElementById('ui'), btn = document.getElementById('play');
let ac = null, start = 0, raf = 0;
function loop() {
  const t = ac ? ac.currentTime - start : 0;
  draw(Math.min(t, DUR - .001));
  if (t < DUR) raf = requestAnimationFrame(loop);
  else { btn.textContent = '↻  REPLAY'; ui.classList.remove('hide'); }
}
function play() {
  cancelAnimationFrame(raf);
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  const out = ac.createGain(); out.connect(ac.destination);
  start = ac.currentTime + .12; buildScore(ac, start, out);
  ui.classList.add('hide'); loop();
}
ready.then(() => {
  if (QS.has('render')) { ui.remove(); return; }
  const t = parseFloat(QS.get('t')); draw(isNaN(t) ? 14.9 : t);
  btn.disabled = false; btn.textContent = '▶  PLAY TRAILER';
  btn.onclick = play;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play(); } });
}).catch(e => { document.getElementById('err').textContent = e.message; });
