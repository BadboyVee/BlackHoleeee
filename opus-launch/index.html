<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opus 5.5 Launch Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
<style>
  [hidden]{ display:none !important; }
  :root,body{ margin:0; height:100%; overflow:hidden; background:#0f1216; color-scheme:dark; }
  canvas{ display:block; position:fixed; inset:0; width:100%; height:100%; }
  #msg{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px;
    text-align:center; font:400 17px/1.5 "Newsreader", Georgia, serif; color:#cfd6de; z-index:6; }
  #ui{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:rgba(12,14,18,.55); border:1px solid rgba(255,255,255,.12); border-radius:999px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font:500 13px/1 "Newsreader", Georgia, serif; color:#e9e6df;
    transition:opacity .4s; opacity:1; z-index:5; max-width:calc(100vw - 32px); box-sizing:border-box;
  }
  #ui.hidden{ opacity:0; pointer-events:none; }
  #ui button{
    all:unset; cursor:pointer; padding:6px 10px; border-radius:999px; white-space:nowrap;
    color:#e9e6df; font:inherit;
  }
  #ui button:hover{ background:rgba(255,255,255,.1); }
  #ui button.on{ background:rgba(255,255,255,.16); }
  #ui button.rec{ color:#ff8a70; }
  #bar{ width:160px; min-width:60px; flex:1; height:3px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden; }
  #fill{ height:100%; width:0; background:#e9e6df; }
</style>
</head>
<body>
<div id="msg" hidden></div>
<div id="ui">
  <button id="bPlay" title="Pause / play (Space)">Pause</button>
  <button id="bRestart" title="Restart (R)">Restart</button>
  <div id="bar"><div id="fill"></div></div>
  <button id="bSound" title="Sound (M)">Sound off</button>
  <button id="bRec" title="Record one loop to a .webm file">Record</button>
</div>

<script>
  // If the film hasn't drawn a frame after a while, say why instead of leaving a blank screen.
  (function () {
    var show = window.__filmError = function (text) { var m = document.getElementById("msg"); if (m) { m.textContent = text; m.hidden = false; } };
    window.addEventListener("error", function (e) { show("The film couldn\u2019t start (" + (window.__stage || "loading") + "): " + (e.message || "a script failed to load")); });
    setTimeout(function () { if (!window.__filmStarted) show("The film didn\u2019t start. It stopped while " + (window.__stage || "loading scripts") + ". Try reloading, or open the page in Chrome."); }, 8000);
  })();
</script>
<!-- three.js r159 (UMD build, vendored so the film needs no CDN) -->
<script src="three.min.js"></script>
<script>
"use strict";
(function () {
window.__stage = "starting";
if (!window.THREE) throw new Error("three.js did not load");

THREE.ColorManagement.enabled = false; // palette hexes are used as display colours, untouched

/* ------------------------------------------------------------------------------------------
   Timeline — every cut measured from the original film (20.05 s, 25 fps, 38 shots).
   Most shots are the same idea: the curved rim of a sphere seen from just above its surface,
   dressed in a different procedural material. The exceptions are the planet (opening and
   titles) and the galloping horse, a real horse rendered in Blender (the original's
   hand-coloured phenakistiscope print, drawn in 2D, stands in if those frames can't load).
   pat: sphere material, bg: backdrop, pal: sphere palette, alpha: angular radius of the sphere
   (bigger = flatter horizon), rimY: rim height in the 16:9 frame [start, end] (0 = top),
   cx: where the top of the rim sits across the frame (0.5 = centre).
   Words: tw is the word's width as a fraction of the frame width (it steps up at every cut,
   like the original), tb its baseline, ta its opacity; "discover" bends along the horizon.
------------------------------------------------------------------------------------------- */
const END = 20.05;
const W1 = "There’s", W2 = "more to", W3 = "discover";
const SHOTS = [
  { t: 0.00, planet: true },
  { t: 1.24, pat: 1, bg: 1, pal: ["#b07a18","#e8bd55","#e6e0d2","#ffffff"], bgA:"#15171b", bgB:"#08090b", alpha: 67, cx:.45, rimY:[.476,.469], glow:[1,"#8a7a6a",.25] },

  { t: 7.04, pat: 7, bg: 0, pal: ["#dc9c88","#eab8a4","#1c3836","#1e1a18"], bgA:"#171717", bgB:"#141414", alpha: 45, cx:.50, rimY:[.493,.492] },
  { t: 7.56, pat:36, bg: 2, pal: ["#c4722a","#e6a452","#140e0a","#7a3e14"], bgA:"#d8c09f", alpha: 70, cx:.50, rimY:[.505,.502], roll: 5.5, overlay:"threads" },
  { t: 8.12, horses: true, bg:10, bgA:"#e2c992", bgB:"#ae9e46" },
  { t: 8.72, pat:37, bg:14, pal: ["#a4642e","#ecd2ac","#5a3c96","#2a1608"], bgA:"#1f1c1f", bgB:"#141214", alpha: 74.5, cx:.50, rimY:[.522,.518], word:W1, tw:.1146, ink:"#f6f2ec", ta:.92 },
  { t: 9.04, pat:12, bg: 0, pal: ["#e0461e","#98200e","#f58a58"], bgA:"#06070a", bgB:"#040506", alpha: 58, cx:.51, rimY:[.497,.493], word:W1, tw:.1266, ink:"#fff" },
  { t: 9.44, pat:38, bg:11, pal: ["#3ee6b0","#b4f070","#169c9c","#6a5a3a"], bgA:"#c02a78", bgB:"#a8a83a", alpha: 72, cx:.78, rimY:[.505,.500], word:W1, tw:.1380, tb:.486, ink:"#fff" },
  { t: 9.76, pat:14, bg: 1, pal: ["#f4f0e6","#111111"], bgA:"#060606", bgB:"#020202", alpha: 59, cx:.50, rimY:[.497,.495], word:W1, tw:.1510, ink:"#fff" },
  { t:10.20, pat:15, bg: 0, pal: ["#262a33","#4a515c"], bgA:"#131410", bgB:"#0e0f0c", alpha: 61.5, cx:.50, rimY:[.480,.477], word:W1, tw:.1656, ink:"#fff", glow:[2,"#ffffff",.9] },
  { t:10.68, pat:16, bg: 7, pal: ["#2a0a10","#b02a1c"], bgA:"#e27a2e", bgB:"#b02a1c", alpha: 66, cx:.54, rimY:[.470,.468], word:W2, tw:.194, ink:"#fff", ta:.6 },
  { t:11.00, pat:39, bg:15, pal: ["#120404","#b04818"], bgA:"#c84a18", bgB:"#1c0604", alpha: 54, cx:.53, rimY:[.508,.506], disp:6, amp:.008, word:W2, tw:.206, tb:.47, ink:"#fff", ta:.55 },
  { t:11.40, pat:17, bg: 3, pal: ["#c8402a","#7a1a12","#ec9462"], bgA:"#384c6c", bgB:"#6b7d99", alpha: 74.5, cx:.53, rimY:[.490,.488], disp:3, amp:.004, word:W2, tw:.2156, ink:"#fff", ta:.88 },
  { t:11.72, pat:18, bg: 6, pal: ["#f040a0","#f4e640","#40e080","#8020c0"], alpha: 67, cx:.44, rimY:[.530,.530], word:W2, tw:.2255, ink:"#fff" },
  { t:12.04, pat:19, bg: 0, pal: ["#090909","#f4f4ee"], bgA:"#050505", bgB:"#020202", alpha: 63, cx:.52, rimY:[.522,.522], disp:4, amp:.016, word:W2, tw:.2323, tb:.466, ink:"#fff" },
  { t:12.48, pat:20, bg: 0, pal: ["#f1e8cc","#b0408e","#2e3020","#e8d890"], bgA:"#963a8c", bgB:"#98408e", alpha: 56, cx:.53, rimY:[.523,.521], word:W3, tw:.2995, tb:.476, ink:"#f3eee6" },
  { t:12.76, pat:10, bg: 2, pal: ["#abccff","#1f55d8"], bgA:"#abccff", alpha: 62.5, cx:.52, rimY:[.520,.520], word:W3, tw:.3078, ink:"#f6f2ea", ta:.9 },
  { t:13.00, pat:11, bg: 1, pal: ["#caa050","#553810"], bgA:"#0a0908", bgB:"#040303", alpha: 65, cx:.56, rimY:[.522,.514], disp:3, amp:.014, word:W3, tw:.3203, ink:"#f0ece4" },
  { t:13.32, pat:23, bg: 0, pal: ["#f4efdf","#6c6c74"], bgA:"#030303", bgB:"#000000", alpha: 53, cx:.51, rimY:[.505,.505], disp:7, amp:.013, word:W3, tw:.3214, tb:.475, ink:"#fff" },
  { t:13.64, pat:40, bg:12, pal: ["#ece6d8","#9a9080","#4e4030"], bgA:"#8f7450", bgB:"#5c4632", alpha: 72.5, cx:.46, rimY:[.542,.540], word:W3, tw:.345, ink:"#f6f2ea", shadeText:[.47,.56,.5] },
  { t:13.92, pat:24, bg: 8, pal: ["#d9cdb6","#2e261e"], bgA:"#ecc944", bgB:"#d2a82c", alpha: 81, cx:.42, rimY:[.535,.535], word:W3, tw:.3583, ink:"#f6f0e4" },
  { t:14.24, pat:25, bg: 2, pal: ["#2e5aa2","#f0d030","#6a1a20","#3a8a4a"], bgA:"#feffee", alpha: 72, cx:.46, rimY:[.503,.503], word:W3, tw:.372, tb:.47, ink:"#111" },
  { t:14.48, pat:26, bg: 2, pal: ["#eef2ee","#7ab8b0","#138a8a","#0a2a4a"], bgA:"#f7ebe0", alpha: 54, cx:.52, rimY:[.503,.503], word:W3, tw:.3833, ink:"#141414", blur:6 },
  { t:14.76, pat:27, bg:16, pal: ["#140606","#c03a1a","#ff6a2a"], bgA:"#2e140c", bgB:"#1e0c08", alpha: 77.5, cx:.56, rimY:[.560,.560], word:W3, tw:.4026, ink:"#f4f0ea" },
  { t:15.04, pat:28, bg: 2, pal: ["#fffcf4","#d04040","#4050c0","#40a060"], bgA:"#fffcf4", alpha: 52, cx:.50, rimY:[.545,.545], word:W3, tw:.4146, ink:"#141414" },
  { t:15.32, pat:29, bg: 2, pal: ["#e4ce9e","#1c140e"], bgA:"#e4ce9e", alpha: 50, cx:.54, rimY:[.532,.532], word:W3, tw:.4266, tb:.483, ink:"#221c14", ta:.9, blur:1.5, overlay:"ink" },
  { t:15.56, pat:30, bg: 0, pal: ["#fafafa","#7a7a7a"], bgA:"#0e0e0e", bgB:"#0a0a0a", alpha: 70, cx:.50, rimY:[.540,.540], disp:2, amp:.05, word:W3, tw:.4313, ink:"#f4f4f2" },
  { t:15.76, pat:31, bg: 0, pal: ["#c4501e","#561208","#e8c090"], bgA:"#131313", bgB:"#0e0e0e", alpha: 77.5, cx:.42, rimY:[.535,.535], word:W3, tw:.4255, ink:"#efe8dc" },
  { t:15.96, planet: true, finale: true },
];
SHOTS.forEach((s, i) => {
  s.end = i + 1 < SHOTS.length ? SHOTS[i + 1].t : END;
  s.seed = (i * 7.31) % 17;
});

// Title cards and the closing move, measured off the original:
// "Opus 5.5" 15.96 → 17.28, then the wordmark; from 18.28 the whole frame rises (titles and the
// glow of the atmosphere together) until the horizon lands back on the opening frame.
const T_CLAUDE = 17.28, T_RISE = 18.28;
const RISE = [ // [time, how far the frame has risen, in frame heights]
  [18.28, 0], [18.44, .013], [18.56, .024], [18.68, .039], [18.80, .059], [18.92, .085], [19.04, .118],
  [19.16, .158], [19.28, .212], [19.40, .280], [19.52, .367], [19.64, .480], [19.72, .561],
  [19.80, .650], [19.88, .707], [19.96, .738], [20.05, .745],
];
const HORIZON = .47;                        // where the planet's limb sits in the opening frame
const HORIZON_LOW = HORIZON + RISE[RISE.length - 1][1];   // ... and under the titles, below the frame
function riseAt(t) {
  if (t <= RISE[0][0]) return 0;
  for (let i = 1; i < RISE.length; i++) {
    const [t1, d1] = RISE[i], [t0, d0] = RISE[i - 1];
    if (t <= t1) {
      // Catmull-Rom through the samples keeps the move smooth
      const p = RISE[Math.max(0, i - 2)][1], n = RISE[Math.min(RISE.length - 1, i + 1)][1];
      const k = (t - t0) / (t1 - t0), k2 = k * k, k3 = k2 * k;
      return .5 * (2 * d0 + (-p + d1) * k + (2 * p - 5 * d0 + 4 * d1 - n) * k2 + (-p + 3 * d0 - 3 * d1 + n) * k3);
    }
  }
  return RISE[RISE.length - 1][1];
}

/* ------------------------------------------------------------------------------------------
   Renderer, camera
------------------------------------------------------------------------------------------- */
// Phones get a lighter mesh and fewer pixels
const MOBILE = matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 700;
// Exporting to a video file (?export) builds a shader program per shot, because software renderers
// run every branch of the big shaders for every pixel
const EXPORT = new URLSearchParams(location.search).has("export");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, powerPreference: "high-performance" });
} catch (e) {
  const m = document.getElementById("msg");
  m.textContent = "This film needs WebGL, which this browser or viewer doesn\u2019t provide. Open the page in Chrome, Safari or Firefox.";
  m.hidden = false;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
window.__stage = "compiling shaders";
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = (gl.getShaderInfoLog(fs) || gl.getShaderInfoLog(vs) || gl.getProgramInfoLog(program) || "").trim().split("\n")[0];
  window.__filmError("This device\u2019s graphics driver rejected a shader: " + (log || "unknown error"));
};
renderer.domElement.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  window.__filmError("The graphics context was lost \u2014 the device may be low on GPU memory. Reload to try again.");
});
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.01, 100);
const DEG = Math.PI / 180, DIST = 10;
// The film is framed for 16:9. Wider screens see a little more at the sides; narrower ones keep
// most of the frame's width, and portrait crops a little off the sides so the words stay large.
const TAN_V = Math.tan(18 * DEG), TAN_H = TAN_V * 16 / 9;    // half-extent of the 16:9 frame
const frame = { k: 1, w: 1, h: 1, x: 0, y: 0 };               // visible share of the frame's width; frame box in canvas px

/* ------------------------------------------------------------------------------------------
   Shared GLSL: simplex noise, fbm, cellular noise, hashes
------------------------------------------------------------------------------------------- */
const NOISE = /* glsl */`
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm(vec3 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ s += a * snoise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return s;
}
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash22(vec2 p){ float n = hash21(p); return vec2(n, hash21(p + n + 1.7)); }
// x: distance to nearest point, y: to second nearest, z: id of the nearest cell
vec3 voronoi(vec2 x){
  vec2 n = floor(x), f = fract(x);
  float F1 = 8.0, F2 = 8.0, id = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + hash22(n + g) - f;
    float d = dot(r, r);
    if (d < F1){ F2 = F1; F1 = d; id = hash21(n + g); } else if (d < F2){ F2 = d; }
  }
  return vec3(sqrt(F1), sqrt(F2), id);
}
`;

/* ------------------------------------------------------------------------------------------
   Palette uniforms shared by every material so one shot switch recolours everything
------------------------------------------------------------------------------------------- */
const U = {
  uA: { value: new THREE.Color() }, uB: { value: new THREE.Color() },
  uC: { value: new THREE.Color() }, uD: { value: new THREE.Color() },
  uSeed: { value: 0 }, uTime: { value: 0 },
};

/* ------------------------------------------------------------------------------------------
   Backdrop: full-screen quad. Knows where the sphere is so it can draw rim glows and,
   for the planet shots, the whole planet with a soft defocused edge and atmosphere.
------------------------------------------------------------------------------------------- */
const bgMat = new THREE.ShaderMaterial({
  defines: EXPORT ? { BG: 0 } : {},
  depthTest: false, depthWrite: false,
  uniforms: {
    ...U,
    uBg: { value: 0 }, uBgA: { value: new THREE.Color() }, uBgB: { value: new THREE.Color() },
    uInvProj: { value: new THREE.Matrix4() }, uCenterDir: { value: new THREE.Vector3(0, -1, 0) },
    uAlpha: { value: 1 }, uAspect: { value: 1 },
    uGlowMode: { value: 0 }, uGlowCol: { value: new THREE.Color() }, uGlowK: { value: 0 },
    uSoft: { value: .01 }, uHaze: { value: 1 },
    uFrame: { value: new THREE.Vector2(1, 1) }, uJit: { value: new THREE.Vector2() },
  },
  vertexShader: /* glsl */`
    varying vec2 vNdc;
    void main(){ vNdc = position.xy; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB, uC, uD; uniform float uSeed, uTime;
    ${EXPORT ? "#define uBg BG" : "uniform int uBg;"}
    uniform vec3 uBgA, uBgB;
    uniform mat4 uInvProj; uniform vec3 uCenterDir; uniform float uAlpha, uAspect;
    uniform int uGlowMode; uniform vec3 uGlowCol; uniform float uGlowK;
    uniform float uSoft, uHaze;
    uniform vec2 uFrame, uJit;
    varying vec2 vNdc;
    ${NOISE}
    vec3 pal4(float t){

/* ------------------------------------------------------------------------------------------
   The rim. A spherical cap whose vertices are laid out in (phi, s) and turned into a sphere in
   the vertex shader, so every vertex is spent between the nadir and just past the horizon —
   dense enough for fur and rock to break the silhouette.
   Object space: +z points at the camera, the on-screen rim top is phi = PI/2.
------------------------------------------------------------------------------------------- */
function capGeometry(nPhi, nS, phiSpan) {
  const pos = new Float32Array((nPhi + 1) * (nS + 1) * 3);
  const idx = [];
  let k = 0;
  for (let j = 0; j <= nS; j++) for (let i = 0; i <= nPhi; i++) {
    pos[k++] = Math.PI / 2 + (i / nPhi - 0.5) * phiSpan;
    pos[k++] = j / nS;
    pos[k++] = 0;
  }
  for (let j = 0; j < nS; j++) for (let i = 0; i < nPhi; i++) {
    const a = j * (nPhi + 1) + i, b = a + 1, c = a + nPhi + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}

const SPHERE_COMMON = /* glsl */`
  uniform float uThetaR, uRimR, uMargin, uSpin, uScale, uDispAmp;
  ${EXPORT ? "#define uDisp DISP" : "uniform int uDisp;"}
  const float HALF_PI = 1.5707963;
  vec3 rotZ(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c*p.x - s*p.y, s*p.x + c*p.y, p.z); }
  // u: position along the rim, v: distance in from the rim, both in units of the rim radius
  void rimCoords(vec3 p, out float u, out float v, out vec3 pn){
    float th = acos(clamp(p.z, -1.0, 1.0));
    u = atan(p.y, p.x) - HALF_PI;
    v = (uThetaR - th) / uRimR;
    pn = p / uRimR * uScale + uSeed;
  }
`;

const sphereMat = new THREE.ShaderMaterial({
  defines: EXPORT ? { PAT: 0, DISP: 0 } : {},
  side: THREE.DoubleSide,
  extensions: { derivatives: true },
  uniforms: {
    ...U,
    uPat: { value: 1 }, uThetaR: { value: .4 }, uRimR: { value: .4 }, uMargin: { value: .12 },
    uSpin: { value: 0 }, uScale: { value: 1 }, uDisp: { value: 0 }, uDispAmp: { value: 0 },
    uRes: { value: new THREE.Vector2(1, 1) }, uTan: { value: new THREE.Vector2(1, 1) },
    uCDir: { value: new THREE.Vector3(0, -1, 0) }, uCosA: { value: .5 }, uBgBack: { value: new THREE.Color() },

  vertexShader: /* glsl */`
    uniform vec3 uA, uB, uC, uD; uniform float uSeed, uTime;

    varying vec3 vObj; varying vec3 vViewPos; varying vec3 vViewN; varying float vH;
    float displace(vec3 p){
      float u, v; vec3 pn; rimCoords(p, u, v, pn);
      if (uDisp == 1) return fbm(pn * 3.0) * 0.7 + 0.35 + snoise(pn * 14.0) * 0.08;               // rock

    // fp is the pixel's place in the 16:9 frame (height 2, y up) and depth how far it lies

    // ray whose angle to the sphere's centre equals the sphere's angular radius.

rim.frustumCulled = false;
scene.add(rim);

/* ------------------------------------------------------------------------------------------
   Droplets: glass beads and red drops sitting on the horizon (instanced spheres)
------------------------------------------------------------------------------------------- */
const MAX_DROPS = 90;
const dropMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uMode: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){

      vV = -mv.xyz;
      vN = normalize(normalMatrix * mat3(instanceMatrix) * normal);
      gl_Position = projectionMatrix * mv;

  fragmentShader: /* glsl */`
    uniform vec3 uA, uB, uC, uD; uniform float uSeed, uTime; uniform int uMode;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;

    void main(){

/* ------------------------------------------------------------------------------------------

const textCanvas = document.createElement("canvas");

/* ------------------------------------------------------------------------------------------
   Layout helpers
------------------------------------------------------------------------------------------- */
const tmpV = new THREE.Vector3();
const rimState = { alpha: 1, thetaR: .5, R: 1, center: new THREE.Vector3(), spin: 0 };

// Put the sphere so its angular radius is `alphaDeg`, the top of its rim sits at `rimY` in the
// 16:9 frame and at `cx` across it, with an optional roll of the horizon in degrees.
const Y_AXIS = new THREE.Vector3(0, 1, 0), Z_AXIS = new THREE.Vector3(0, 0, 1);
function placeSphere(alphaDeg, rimY, spin, cx = .5, roll = 0) {
  const a = alphaDeg * DEG;
  const th = Math.atan((1 - 2 * rimY) * TAN_V);
  const yaw = Math.atan((2 * cx - 1) * TAN_H);
  const c = th - a;
  const R = DIST * Math.sin(a);
  rimState.alpha = a; rimState.thetaR = Math.PI / 2 - a; rimState.R = R; rimState.spin = spin;
  rimState.center.set(0, Math.sin(c), -Math.cos(c)).applyAxisAngle(Y_AXIS, -yaw).applyAxisAngle(Z_AXIS, roll * DEG).multiplyScalar(DIST);
  rim.position.copy(rimState.center);
  rim.scale.setScalar(R);
  rim.up.set(-Math.sin(roll * DEG), Math.cos(roll * DEG), 0);
  rim.lookAt(0, 0, 0);
  rim.updateMatrixWorld();
  const su = sphereMat.uniforms;
  su.uThetaR.value = rimState.thetaR;
  su.uRimR.value = Math.sin(rimState.thetaR);
  su.uSpin.value = spin;
  bgMat.uniforms.uCenterDir.value.copy(rimState.center).normalize();
  bgMat.uniforms.uAlpha.value = a;
  su.uCDir.value.copy(bgMat.uniforms.uCenterDir.value);
  su.uCosA.value = Math.cos(a);
}

// World-space point on the horizon at pattern angle `phi` (PI/2 = top), lifted by `lift` radians of arc.
function rimPoint(phi, lift = 0, out = tmpV) {
  const th = rimState.thetaR + lift, ph = phi - rimState.spin;
  out.set(Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th));
  return rim.localToWorld(out);
}

function mulberry(seed) {
  let s = seed * 1e4 >>> 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const dummy = new THREE.Object3D();
const nrm = new THREE.Vector3();
// The pink gel's beads, left to right, as in the original: place across the frame, radius in frame heights
const BEADS = [[.023,.035],[.10,.09],[.217,.042],[.305,.08],[.444,.069],[.572,.094],[.663,.05],[.754,.078],[.873,.083],[.988,.028]];
function layoutDrops(kind, seed) {
  if (!kind) { drops.count = 0; return; }
  const rnd = mulberry(seed + 1);
  const L = DIST * Math.cos(rimState.alpha);                  // distance to the horizon
  const px = L * TAN_V * 2;                                    // world size of one frame height there
  let n = 0;
  const put = (phi, lift, r, out) => {
    const p = rimPoint(phi, lift, new THREE.Vector3());
    nrm.copy(p).sub(rimState.center).normalize();
    dummy.position.copy(p).addScaledVector(nrm, r * out);
    dummy.scale.setScalar(r);
    dummy.rotation.set(n * 1.3, n * 2.1, n * .7);          // so no two beads show the same mottling
    dummy.updateMatrix();
    drops.setMatrixAt(n++, dummy.matrix);
  };
  if (kind === "red") {
    dropMat.uniforms.uMode.value = 1;
    // find the rim angle under each bead's place on screen, then sit the bead a little proud of the rim
    const W = textCanvas.width, H = textCanvas.height, tab = [];
    for (let j = 0; j <= 48; j++) {
      const phi = Math.PI / 2 + 1.2 - j / 48 * 2.4 + rimState.spin;
      tab.push([(toScreen(rimPoint(phi), W, H)[0] - frame.x) / frame.w, phi]);
    }
    for (const [bx, br] of BEADS) {
      let j = 1;
      while (j < tab.length - 1 && tab[j][0] < bx) j++;
      const [x0, p0] = tab[j - 1], [x1, p1] = tab[j];
      put(lerp(p0, p1, (bx - x0) / ((x1 - x0) || 1)), 0, px * br, .3);
    }
  } else {
    dropMat.uniforms.uMode.value = 0;
    let phi = Math.PI / 2 - .75;
    while (phi < Math.PI / 2 + .75 && n < MAX_DROPS) {
      const r = px * (.012 + rnd() * .012);
      put(phi, -r / rimState.R * .4, r, .1);
      phi += r / (rimState.R * Math.sin(rimState.thetaR)) * 2.1;
    }

/* ------------------------------------------------------------------------------------------
   Shot switching + per-frame animation
------------------------------------------------------------------------------------------- */
const col = (h, c) => c.set(h || "#000000");
let current = -1;

function applyShot(i) {
  const s = SHOTS[i];
  current = i;
  U.uSeed.value = s.seed;
  if (s.pal) { col(s.pal[0], U.uA.value); col(s.pal[1], U.uB.value); col(s.pal[2] || s.pal[1], U.uC.value); col(s.pal[3] || s.pal[2] || s.pal[1], U.uD.value); }
  const b = bgMat.uniforms;
  b.uBg.value = s.planet ? 5 : s.bg;
  col(s.bgA, b.uBgA.value); col(s.bgB || s.bgA, b.uBgB.value);
  b.uGlowMode.value = s.glow ? s.glow[0] : 0;
  if (s.glow) { col(s.glow[1], b.uGlowCol.value); b.uGlowK.value = s.glow[2]; }
  b.uJit.value.set(0, 0);
  const m = sphereMat.uniforms;
  m.uPat.value = s.pat || 0;
  m.uDisp.value = s.disp || 0;
  m.uScale.value = s.scale || 1;
  if (EXPORT) {
    const d = sphereMat.defines, bd = bgMat.defines;
    if (d.PAT !== m.uPat.value || d.DISP !== m.uDisp.value) { d.PAT = m.uPat.value; d.DISP = m.uDisp.value; sphereMat.needsUpdate = true; }
    if (bd.BG !== b.uBg.value) { bd.BG = b.uBg.value; bgMat.needsUpdate = true; }
  }
  col(s.bgA, m.uBgBack.value);
  rim.visible = !s.planet && !s.horses;
  drops.visible = !!s.drops;
  // the print is inked and painted onto its paper: multiply the overlay instead of laying it on top
  textQuad.material.blending = s.horses ? THREE.MultiplyBlending : THREE.NormalBlending;
  overlayKey = "";
}

const clamp01 = x => Math.min(1, Math.max(0, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = x => x * x * (3 - 2 * x);
const hash1 = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function update(t) {
  let i = SHOTS.length - 1;
  while (i > 0 && SHOTS[i].t > t) i--;
  if (i !== current) applyShot(i);
  const s = SHOTS[i];
  const k = (t - s.t) / (s.end - s.t);
  const b = bgMat.uniforms;

  if (s.planet) {
    // Opening: the limb holds still. Titles: the horizon is below the frame and only the
    // atmosphere's glow shows; from T_RISE the frame rises until it is the opening frame again.
    const rise = s.finale ? riseAt(t) : 0;
    const rimY = s.finale ? HORIZON_LOW - rise : HORIZON;
    placeSphere(72, rimY, 0);
    b.uSoft.value = .012;
    b.uHaze.value = s.finale ? smooth(clamp01(rise / RISE[RISE.length - 1][1])) : 1;
    return { rimY, rise };
  }

  if (s.horses) {
    // one figure per film frame; the disc wobbles a little from frame to frame
    const f = Math.min(WOBBLE.length - 1, Math.floor((t - s.t) * 25 + 1e-4));
    b.uJit.value.set(WOBBLE[f][0], WOBBLE[f][1]);
    return { frame: f };
  }

  const r0 = s.rimY ? s.rimY[0] : .54, r1 = s.rimY ? s.rimY[1] : .52;
  placeSphere(s.alpha * (1 + .012 * k), lerp(r0, r1, k), (s.spin ?? .04) * (k - .5), s.cx ?? .5, s.roll || 0);
  sphereMat.uniforms.uDispAmp.value = (s.amp || 0) / Math.tan(rimState.alpha);
  if (s.drops) layoutDrops(s.drops, s.seed);
  return {};
}

/* ------------------------------------------------------------------------------------------
   The horses (8.12 – 8.72 s). A close-up of a hand-coloured phenakistiscope disc: every film
   frame shows the next figure, so the horse gallops on the spot, eight poses to a stride,
   one pose per frame. The foxed paper and the green arches are in the backdrop shader; the
   horses are drawn here in 2D, in 1920 x 1080 frame pixels, and multiplied onto the paper
   the way ink and watercolour sit on a print.
------------------------------------------------------------------------------------------- */
// Each arch is a parabola, flat across the top; the figures stand on them. Measured off the
// original: 0.000263 px of sag per px² from the apex, a new arch every 2000 px, and the whole
// disc wobbling from frame to frame by these offsets (x, y in frame pixels).
const ARCH = { P: 2000, K: .000263, AP: 470 };         // must match the arches in the backdrop
const WOBBLE = [[33,-4],[-10,1],[98,24],[-32,11],[106,-4],[-45,12],[0,-16],[55,-7],[-8,1],[88,25],[-108,10],[-38,12],[105,-5],[-7,-17],[49,-8]];
function archTop(x, jx, jy) {
  const xc = ((x - 960 - jx + ARCH.P / 2) % ARCH.P + ARCH.P) % ARCH.P - ARCH.P / 2;
  return ARCH.AP + ARCH.K * xc * xc + jy;
}

// The stride, read off the print one frame at a time (f = frame of the shot, stride = 8 frames):
// f0 fore legs planted ahead, hind legs trailing high; f1–f2 hind legs land under the belly
// while the fore legs fold up; f3 hinds push, fores reach; f4 fully stretched, all four down;
// f5–f7 fore legs planted, hinds trailing. Body space: origin at the lowest point of the belly,
// x forward (the horse runs to the right), y down; x positions are in that space.
const LEGS = [
  { fore: false, near: false, root: [-290, -48], a: 226, b: 240, on: .14, off: .56, land: -120, push: -520, back: -700, lift: 190, sink: 10 },
  { fore: true,  near: false, root: [362, -34],  a: 200, b: 222, on: .53, off: 1.0, land: 540, push: 260, fold: 440, lift: 125, sink: 40 },
  { fore: false, near: true,  root: [-318, -40], a: 226, b: 240, on: .11, off: .53, land: -100, push: -500, back: -690, lift: 200, sink: 14 },
  { fore: true,  near: true,  root: [330, -24],  a: 200, b: 222, on: .48, off: .95, land: 510, push: 250, fold: 410, lift: 135, sink: 48 },
];
const BODY = [[-440,-560],[-452,-420],[-462,-320],[-462,-240],[-450,-170],[-428,-110],[-398,-62],[-352,-26],[-280,-8],[-160,-2],[-40,2],[110,0],[230,-6],[320,-16],[380,-34],[420,-80],[446,-160],[458,-260],[462,-560]];
const INK = "#2e1a10";
// Colours to paint with, already divided by the paper they are multiplied onto
const HIDE = "#b0602e", HIDE_FAR = "#8c4722";

function ik(root, tgt, a, b, kneeForward) {
  const dx = tgt[0] - root[0], dy = tgt[1] - root[1];
  const d0 = Math.hypot(dx, dy) || 1;
  const d = Math.min(a + b - 2, Math.max(Math.abs(a - b) + 2, d0));
  const end = [root[0] + dx / d0 * d, root[1] + dy / d0 * d];
  const base = Math.atan2(dy, dx);
  const A = Math.acos(Math.min(1, Math.max(-1, (a * a + d * d - b * b) / (2 * a * d))));
  const k1 = [root[0] + a * Math.cos(base + A), root[1] + a * Math.sin(base + A)];
  const k2 = [root[0] + a * Math.cos(base - A), root[1] + a * Math.sin(base - A)];
  return [kneeForward ? (k1[0] > k2[0] ? k1 : k2) : (k1[0] < k2[0] ? k1 : k2), end];
}

// A closed outline through `P`, smoothed by curving through the midpoints of its edges
function smoothPath(ctx, P) {
  const n = P.length, mid = i => [(P[i % n][0] + P[(i + 1) % n][0]) / 2, (P[i % n][1] + P[(i + 1) % n][1]) / 2];
  const m = mid(n - 1);
  ctx.moveTo(m[0], m[1]);
  for (let i = 0; i < n; i++) { const q = mid(i); ctx.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
  ctx.closePath();
}

// A limb through the joints `pts`, `ws` wide at each (plus a bulge `bs` at the back of the
// leg for the hock and fetlock). Its top melts into the body: the outline is inked down the
// sides and round the foot only, and the shaded back edge is hatched.
function openSmooth(ctx, P) {
  ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}
function limb(ctx, pts, ws, bs, fill, hatch) {
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0];
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (nx > 0) { nx = -nx; ny = -ny; }                   // n points to the back of the leg
    const w = ws[i] / 2, bb = bs[i] || 0;
    L.push([pts[i][0] + nx * (w + bb), pts[i][1] + ny * (w + bb)]);   // back edge
    R.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);                  // front edge
  }
  const outline = L.concat(R.slice().reverse());
  ctx.beginPath(); openSmooth(ctx, outline); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.beginPath(); openSmooth(ctx, outline.slice(1, -1));
  ctx.lineWidth = 3.4; ctx.strokeStyle = INK; ctx.stroke();
  if (!hatch) return;
  ctx.beginPath();
  for (let i = 1; i < L.length - 1; i++) {
    const [x0, y0] = L[i], [x1, y1] = L[i + 1];
    const n = Math.floor(Math.hypot(x1 - x0, y1 - y0) / 6.5);
    const ix = pts[i][0] - x0, iy = pts[i][1] - y0, il = Math.hypot(ix, iy) || 1;
    for (let j = 0; j < n; j++) {
      const f = j / n, x = lerp(x0, x1, f), y = lerp(y0, y1, f), s = (5 + 8 * hash1(i * 31 + j)) * Math.min(1, ws[i] / 40);
      ctx.moveTo(x, y); ctx.lineTo(x + ix / il * s + 2, y + iy / il * s + 3);
    }
  }
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(46,26,16,.8)"; ctx.stroke();
}

function hoofAt(leg, phi, ground) {
  const span = leg.off - leg.on;
  const p = ((phi - leg.on) % 1 + 1) % 1;
  if (p < span) { const x = lerp(leg.land, leg.push, p / span); return { x, y: ground(x) + leg.sink, q: -1 }; }
  const q = (p - span) / (1 - span);
  let x;
  if (leg.fore) x = q < .35 ? lerp(leg.push, leg.fold, smooth(q / .35)) : lerp(leg.fold, leg.land, smooth((q - .35) / .65));   // fold up under the chest, then reach
  else x = q < .55 ? lerp(leg.push, leg.back, smooth(q / .55)) : lerp(leg.back, leg.land, smooth((q - .55) / .45));          // trail out behind, then swing through
  const lift = leg.fore ? Math.sin(Math.PI * Math.pow(q, .7)) : Math.pow(Math.sin(Math.PI * q), .8);   // fores peak early, then reach down
  return { x, y: ground(x) + leg.sink - leg.lift * lift, q };
}

function drawLeg(ctx, leg, phi, ground, fill, hatch) {
  const h = hoofAt(leg, phi, ground);
  const [knee, T] = ik(leg.root, [h.x, h.y - 30], leg.a, leg.b, leg.fore);
  // fetlock three quarters down the cannon; the pastern angles forward under load, tucks in flight
  const dx = T[0] - knee[0], dy = T[1] - knee[1], dl = Math.hypot(dx, dy) || 1;
  let bx = -dy / dl, by = dx / dl;
  if (bx > 0) { bx = -bx; by = -by; }
  const bend = h.q < 0 ? 16 : -10 * Math.sin(Math.PI * h.q);
  const fet = [knee[0] + dx * .76 + bx * bend, knee[1] + dy * .76 + by * bend];
  const upper = [lerp(leg.root[0], knee[0], .45), lerp(leg.root[1], knee[1], .45)];
  const cannon = [lerp(knee[0], fet[0], .5), lerp(knee[1], fet[1], .5)];
  const top = [leg.root[0] + (leg.fore ? -14 : 14), leg.root[1] - 70];    // where the leg's muscle starts, inside the body
  const pts = [top, leg.root, upper, knee, cannon, fet, T];
  const ws = leg.fore ? [80, 84, 58, 40, 27, 34, 25] : [104, 112, 74, 42, 28, 34, 25];
  const bs = leg.fore ? [0, 0, 0, 4, 0, 8, 0] : [0, 0, 8, 18, 0, 8, 0];
  limb(ctx, pts, ws, bs, fill, hatch);
  // pale ergot and fetlock hair, then the hoof: dark horn under a pale coronet band
  ctx.fillStyle = "rgba(250,244,232,.9)";
  ctx.beginPath(); ctx.ellipse(fet[0] + bx * 12, fet[1] + by * 12 + 6, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
  const ang = Math.atan2(T[1] - fet[1], T[0] - fet[0]) - Math.PI / 2;
  ctx.save(); ctx.translate(T[0], T[1]); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(-17, -4); ctx.lineTo(17, -4); ctx.lineTo(22, 30); ctx.lineTo(-20, 32); ctx.closePath();
  ctx.fillStyle = "#56566a"; ctx.fill(); ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = "rgba(226,226,236,.9)"; ctx.fillRect(-15, -2, 30, 7);
  ctx.restore();
}

function drawHorse(ctx, cx, phi, jx, jy) {
  const bob = 14 * Math.cos(2 * Math.PI * (phi - .85));
  const baseY = ARCH.AP + jy - 226 - bob;                   // belly height over the arch's apex
  const pitch = .03 * Math.sin(2 * Math.PI * (phi - .1));
  const ground = x => archTop(cx + x, jx, jy) - baseY;
  ctx.save();
  ctx.translate(cx, baseY); ctx.rotate(pitch);
  for (const leg of LEGS) if (!leg.near) drawLeg(ctx, leg, phi, ground, HIDE_FAR, false);
  // one wash for the barrel and the near legs, so where a leg's top overlaps the body it disappears
  const g = ctx.createLinearGradient(0, -330, 0, 8);
  g.addColorStop(0, "#c07038"); g.addColorStop(.7, HIDE); g.addColorStop(1, "#a45a2c");
  ctx.beginPath(); smoothPath(ctx, BODY); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3.6; ctx.strokeStyle = INK; ctx.stroke();
  // muscle lines, and hatching along the belly
  ctx.beginPath();
  ctx.moveTo(-388, -98); ctx.quadraticCurveTo(-350, -190, -380, -330);
  ctx.moveTo(-250, -22); ctx.quadraticCurveTo(-205, -90, -222, -170);
  ctx.moveTo(330, -34); ctx.quadraticCurveTo(290, -130, 322, -290);
  ctx.moveTo(90, -2); ctx.quadraticCurveTo(118, -50, 104, -104);
  for (let x = -330; x < 330; x += 8) {
    const y = Math.abs(x) < 150 ? 0 : (Math.abs(x) - 150) * -.2;
    ctx.moveTo(x, y - 3); ctx.lineTo(x + 3, y - 12 - 9 * hash1(x));
  }
  ctx.lineWidth = 1.7; ctx.strokeStyle = "rgba(46,26,16,.72)"; ctx.stroke();
  const near = LEGS.filter(l => l.near);
  drawLeg(ctx, near[0], phi, ground, g, true);
  // the rider's leg: yellow breeches, white knee, brown boot top, black boot
  ctx.lineWidth = 3.2; ctx.strokeStyle = INK;
  const part = (pts, fill) => { ctx.beginPath(); smoothPath(ctx, pts); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  part([[80,-620],[200,-620],[208,-300],[198,-204],[150,-194],[116,-236]], "#e6bd18");
  part([[146,-200],[198,-208],[212,-146],[202,-106],[160,-100],[146,-132]], "#f6efe2");
  part([[152,-108],[204,-110],[206,-86],[154,-82]], "#c49660");
  part([[154,-86],[206,-88],[208,20],[214,70],[240,100],[256,118],[244,128],[206,122],[182,110],[166,100],[160,30]], "#262738");
  drawLeg(ctx, near[1], phi, ground, g, true);
  ctx.restore();
}

// Dark figures on the disc's inner ring: only their ears and flung legs reach into the frame
function drawHound(ctx, f, jx, jy) {
  const x = 980 + 230 * Math.sin(f * 2.1) + jx, y = 1000 + 30 * Math.cos(f * 1.3) + jy, rot = .55 * Math.sin(f * 1.7);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  if (f % 3 === 1) {        // a leg flung up and back
    ctx.moveTo(-50, 150); ctx.lineTo(-74, 20); ctx.lineTo(-130, -104); ctx.lineTo(-108, -114); ctx.lineTo(-40, 0); ctx.lineTo(40, 150);
  } else {                  // head and pricked ears
    ctx.moveTo(-70, 160); ctx.lineTo(-52, 30); ctx.lineTo(-36, -50); ctx.lineTo(-32, -140); ctx.lineTo(-12, -60);
    ctx.lineTo(8, -60); ctx.lineTo(22, -155); ctx.lineTo(36, -48); ctx.lineTo(56, 20); ctx.lineTo(84, 160);
  }
  ctx.closePath();
  ctx.fillStyle = "#28304a"; ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = "#141824"; ctx.stroke();
  ctx.restore();
}

/* The horse as the film now shows it: a real horse at a gallop along the crest of a hill,
   rendered in Blender (Cycles) one frame per film frame from a rigged scan (horse/blender).
   PHOTO_GAIT is that gallop's footfalls, for the hoofbeats: the stride phase at which each hoof
   lands, a stride every ten frames, the first frame of the shot at phase PHOTO_PHASE0. */
const HORSE_SRC = Array.from({ length: 15 }, (_, i) => `horse/h${String(i + 1).padStart(2, "0")}.jpg`);
const HORSE_PHOTOS = HORSE_SRC.map(src => { const im = new Image(); im.src = src; return im; });
const photoReady = im => im.complete && im.naturalWidth > 0;
const photosReady = () => HORSE_PHOTOS.every(photoReady);      // all or none, never a mix
const PHOTO_GAIT = [{ on: 0, fore: false }, { on: .09, fore: false }, { on: .33, fore: true }, { on: .43, fore: true }];
const PHOTO_PHASE0 = .62;
// 16:9 and wider: fill the width. Narrower: keep the film's framing, nudged so the horse's head
// stays in, and carry the sky up and the grass down past the frame's edges.
function drawHorsePhoto(im) {
  const W = textCanvas.width, H = textCanvas.height, iw = im.naturalWidth, ih = im.naturalHeight;
  if (W / H >= 16 / 9) { const h = W * 9 / 16; tctx.drawImage(im, 0, (H - h) / 2, W, h); return; }
  const x = frame.x - (1 - frame.k) * .075 * frame.w, b = Math.round(frame.w / 60);
  tctx.drawImage(im, x, frame.y, frame.w, frame.h);
  if (frame.y <= 0) return;
  // above and below: the photo's edge rows, stretched and blurred, faded in over its edges
  for (const top of [true, false]) {
    const F = Math.round(frame.h * (top ? .04 : .15)), h = Math.ceil(frame.y) + F;
    const c = document.createElement("canvas"); c.width = W; c.height = h;
    const cx = c.getContext("2d");
    cx.filter = `blur(${top ? b : 3 * b}px)`;
    cx.drawImage(im, 0, top ? 0 : ih - 4, iw, 4, x - 8 * b, -8 * b, frame.w + 16 * b, h + 16 * b);
    cx.filter = "none"; cx.globalCompositeOperation = "destination-in";
    const g = cx.createLinearGradient(0, top ? h : 0, 0, top ? h - F : F);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "#000");
    cx.fillStyle = g; cx.fillRect(0, 0, W, h);
    tctx.drawImage(c, 0, top ? 0 : H - h);
  }
}

const HORSE_PHASE0 = 0;               // the first frame of the shot is f0 of the stride
const HORSE_SHIFT = [-120, -60, -60, -20, 60, 30, 0, -10, -110, -60, -60, -20, 60, 30, 0];   // each figure sits a little differently on the disc
function drawHorses(f) {
  const s = frame.w / 1920;
  tctx.setTransform(s, 0, 0, s, frame.x, frame.y);
  const [jx, jy] = WOBBLE[Math.min(f, WOBBLE.length - 1)];
  const phi = (HORSE_PHASE0 + f / 8) % 1;
  const cx = 960 + jx + HORSE_SHIFT[Math.min(f, HORSE_SHIFT.length - 1)];
  tctx.lineJoin = "round"; tctx.lineCap = "round";
  drawHound(tctx, f, jx, jy);
  drawHorse(tctx, cx - 1350, (phi + 7 / 8) % 1, jx, jy);   // neighbours on the disc: the figures before and after
  drawHorse(tctx, cx + 1350, (phi + 1 / 8) % 1, jx, jy);
  drawHorse(tctx, cx, phi, jx, jy);
  tctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ------------------------------------------------------------------------------------------
   The leather shot's threads: a red one through two stitch holes, frayed end up in the air,
   and a green one looped round a hole. Frame pixels, with soft shadows on the paper.
------------------------------------------------------------------------------------------- */
const THREADS = [
  { col: "#d4303c", hi: "#f08088", w: 6.5, pts: [[755,525],[782,590],[815,636],[870,646],[912,652],[936,688],[952,722],[972,700],[990,668],[972,628],[952,580],[958,540],[986,470],[1015,420],[1046,392]] },
  { col: "#3c4a2c", hi: "#6a7a50", w: 6, pts: [[572,610],[550,660],[556,720],[600,762],[680,768],[768,762]] },
  { col: "#3c4a2c", hi: "#6a7a50", w: 6, pts: [[1400,786],[1480,791],[1560,797],[1650,806]] },
];
function drawThreads() {
  const s = frame.w / 1920;
  tctx.setTransform(s, 0, 0, s, frame.x, frame.y);
  tctx.lineJoin = "round"; tctx.lineCap = "round";
  const stroke = (pts, w, style) => {
    tctx.beginPath(); tctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) tctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    tctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    tctx.lineWidth = w; tctx.strokeStyle = style; tctx.stroke();
  };
  for (const th of THREADS) stroke(th.pts.map(p => [p[0] + 14, p[1] + 10]), th.w * 1.6, "rgba(40,30,20,.18)");
  for (const th of THREADS) {
    stroke(th.pts, th.w, th.col);
    tctx.setLineDash([5, 7]); stroke(th.pts, th.w * .35, th.hi); tctx.setLineDash([]);   // the twist of the ply
  }
  // the green loop round a hole, right of centre
  tctx.beginPath(); tctx.ellipse(1155, 695, 27, 24, 0, 0, Math.PI * 2);
  tctx.lineWidth = 7; tctx.strokeStyle = "#3c4a2c"; tctx.stroke();
  tctx.setTransform(1, 0, 0, 1, 0, 0);
}

// The ink shot's pen drawing: tall scribbled grass standing up through the horizon line,
// thickest right of centre, a few loose strokes on the left, a knot of scribble on the right.
// Frame pixels, and the same strokes every time.
function drawInk() {
  const s = frame.w / 1920, rnd = mulberry(7);
  tctx.setTransform(s, 0, 0, s, frame.x, frame.y);
  for (let i = 0; i < 6; i++) {                               // old stains
    const x = rnd() * 1920, y = rnd() * 1080, r = 60 + rnd() * 160;
    const g = tctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(150,110,50,.16)"); g.addColorStop(1, "rgba(150,110,50,0)");
    tctx.fillStyle = g; tctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  tctx.fillStyle = "rgba(60,40,20,.55)";
  for (let i = 0; i < 260; i++) { tctx.beginPath(); tctx.arc(rnd() * 1920, rnd() * 1080, .8 + rnd() * rnd() * 3.5, 0, Math.PI * 2); tctx.fill(); }   // specks
  tctx.fillStyle = tctx.strokeStyle = "#1c140e";
  tctx.lineCap = "round"; tctx.lineJoin = "round";
  // a pen stroke that swells a little along its length and ends in a fine point
  const blade = (x0, y0, x1, y1, bend, w) => {
    const mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2;
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, ox = -(y1 - y0) / L * w / 2, oy = (x1 - x0) / L * w / 2;
    tctx.beginPath();
    tctx.moveTo(x0 - ox, y0 - oy);
    tctx.quadraticCurveTo(mx - ox, my - oy, x1, y1);
    tctx.quadraticCurveTo(mx + ox, my + oy, x0 + ox, y0 + oy);
    tctx.fill();
  };
  for (let i = 0; i < 110; i++) {
    const r = rnd();
    const [x, top] = r < .62 ? [760 + rnd() * 760, 470 + rnd() * 300]
      : r < .85 ? [260 + rnd() * 540, 640 + rnd() * 280]
      : [1440 + rnd() * 470, 700 + rnd() * 250];
    blade(x + (rnd() - .5) * 120, 1110, x + (rnd() - .5) * 140, top, (rnd() - .5) * 150, 2.5 + rnd() * rnd() * 9);
  }
  tctx.lineWidth = 3.5;
  for (let i = 0; i < 14; i++) {                              // wavy strokes wandering up through the grass
    const x0 = 560 + rnd() * 1000, top = 520 + rnd() * 360, amp = 15 + rnd() * 35, wl = 70 + rnd() * 110, ph = rnd() * 6;
    tctx.beginPath();
    for (let y = 1100; y >= top; y -= 8) tctx.lineTo(x0 + Math.sin(y / wl + ph) * amp + (1100 - y) * .12, y);
    tctx.lineWidth = 2 + rnd() * 2.5; tctx.stroke();
  }
  for (let i = 0; i < 4; i++) {                               // the scribble on the right
    let x = 1480 + rnd() * 80, y = 780 + rnd() * 60;
    tctx.beginPath(); tctx.moveTo(x, y);
    for (let k = 0; k < 9; k++) { x += (k % 2 ? -1 : 1) * (60 + rnd() * 90); y += 12 + rnd() * 30; tctx.lineTo(x, y); }
    tctx.lineWidth = 3 + rnd() * 4; tctx.stroke();
  }
  tctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ------------------------------------------------------------------------------------------
   Typography, drawn into a canvas that is part of the WebGL frame (so it records).
   Sizes and positions come from the original: every word is fitted to its measured width,
   so the layout holds whatever serif the browser ends up using.
------------------------------------------------------------------------------------------- */
const FONT = `"Newsreader", Georgia, "Times New Roman", serif`;
const WEIGHT = 600;                  // the original's serif is set fairly heavy
const inkWidth = m => (m.actualBoundingBoxLeft !== undefined ? m.actualBoundingBoxLeft + m.actualBoundingBoxRight : m.width * .96);

function toScreen(p, W, H) {
  tmpV.copy(p).project(camera);
  return [(tmpV.x * .5 + .5) * W, (1 - (tmpV.y * .5 + .5)) * H];
}

// font size (canvas px) at which `text` is `frac` of the frame's width, ink edge to ink edge
const fitCache = new Map();
// if the web font arrives after the film has started, measure again with it
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => { fitCache.clear(); overlayKey = ""; });
function fitSize(text, frac) {
  let per100 = fitCache.get(text);
  if (!per100) { tctx.font = `${WEIGHT} 100px ${FONT}`; per100 = inkWidth(tctx.measureText(text)) / 100; fitCache.set(text, per100); }
  return frac * frame.w / per100;
}

function drawStraightWord(word, size, baseY) {
  tctx.font = `${WEIGHT} ${size}px ${FONT}`;
  tctx.textAlign = "center"; tctx.textBaseline = "alphabetic";
  tctx.fillText(word, textCanvas.width / 2, baseY);
}

// Lay the word along the projected horizon, lifted so the curve passes through the baseline
// at the centre of the frame.
function drawArchedWord(word, size, baseY) {
  const W = textCanvas.width, H = textCanvas.height, cx = W / 2;
  const pts = [];
  for (let j = 0; j <= 96; j++) pts.push(toScreen(rimPoint(Math.PI / 2 + 1 - (j / 96) * 2 + rimState.spin), W, H));
  let yc = baseY;
  for (let j = 1; j < pts.length; j++) {
    const a = pts[j - 1], b = pts[j];
    if ((a[0] - cx) * (b[0] - cx) <= 0 && a[0] !== b[0]) { yc = lerp(a[1], b[1], (cx - a[0]) / (b[0] - a[0])); break; }
  }
  const path = pts.map(p => [p[0], p[1] + baseY - yc]);
  const cum = [0];
  for (let j = 1; j < path.length; j++) cum.push(cum[j - 1] + Math.hypot(path[j][0] - path[j - 1][0], path[j][1] - path[j - 1][1]));
  let mid = 0;
  for (let j = 1; j < path.length; j++) if (Math.abs(path[j][0] - cx) < Math.abs(path[mid][0] - cx)) mid = j;
  const at = s => {
    let j = 1;
    while (j < cum.length - 1 && cum[j] < s) j++;
    const f = (s - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    const a = path[j - 1], b = path[j];
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), Math.atan2(b[1] - a[1], b[0] - a[0])];
  };
  tctx.font = `${WEIGHT} ${size}px ${FONT}`;
  tctx.textAlign = "left"; tctx.textBaseline = "alphabetic";
  const chars = [...word];
  const widths = chars.map(c => tctx.measureText(c).width);
  const total = tctx.measureText(word).width;
  const squeeze = total / widths.reduce((x, y) => x + y, 0);   // keep the word's kerned width
  let s = cum[mid] - total / 2;
  chars.forEach((c, j) => {
    const w = widths[j] * squeeze;
    const [x, y, ang] = at(s + w / 2);
    tctx.save(); tctx.translate(x, y); tctx.rotate(ang);
    tctx.fillText(c, -widths[j] / 2, 0);
    tctx.restore();
    s += w;
  });
}

function drawWord(s) {
  const fy = v => frame.y + v * frame.h;
  const size = fitSize(s.word, s.tw);
  tctx.save();
  tctx.fillStyle = s.ink || "#fff";
  tctx.globalAlpha = s.ta ?? 1;
  tctx.shadowColor = new THREE.Color(s.ink || "#fff").getHSL({}).l > .5 ? "rgba(0,0,0,.28)" : "rgba(0,0,0,0)";
  tctx.shadowBlur = 12 * frame.h / 1080;
  if (s.blur) tctx.filter = `blur(${(s.blur * frame.h / 1080).toFixed(2)}px)`;   // the lens was focused on the surface, not the word
  if (s.word === W3) drawArchedWord(s.word, size, fy(s.tb ?? .49));
  else drawStraightWord(s.word, size, fy(s.tb ?? (s.word === W1 ? .473 : .477)));
  tctx.restore();
  if (s.shadeText) {
    // part of the word falls in the plaster's shadow
    const [x0, x1, a] = s.shadeText, X0 = frame.x + x0 * frame.w, X1 = frame.x + x1 * frame.w;
    tctx.save(); tctx.globalCompositeOperation = "destination-out";
    const g = tctx.createLinearGradient(X0, 0, X1, 0);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${1 - a})`);
    tctx.fillStyle = g; tctx.fillRect(X0, 0, textCanvas.width - X0, textCanvas.height);
    tctx.restore();
  }
}

// The spark: a dozen rounded rays of slightly different lengths
const SPARK = Array.from({ length: 12 }, (_, i) => ({
  a: i / 12 * Math.PI * 2 + [0, .06, -.04, .03, -.07, .05, 0, -.03, .06, -.05, .02, -.02][i],
  l: [1, .82, .94, .78, 1, .86, .92, .8, .98, .84, .9, .8][i],
}));
function drawSpark(x, y, r) {
  tctx.save();
  tctx.lineCap = "round"; tctx.lineWidth = r * .17;
  tctx.beginPath();
  for (const s of SPARK) { tctx.moveTo(x, y); tctx.lineTo(x + Math.cos(s.a) * r * s.l, y + Math.sin(s.a) * r * s.l); }
  tctx.stroke();
  tctx.beginPath(); tctx.arc(x, y, r * .18, 0, Math.PI * 2); tctx.fill();
  tctx.restore();
}

// Title cards, measured off the original: "Opus 5.5" 19.6% of the frame wide with its cap top
// at 43.3% of the height; the wordmark 21.4% wide, spark as tall as the word.
function drawTitle(t, info, offY) {
  const fy = v => frame.y + v * frame.h + offY;
  const W = textCanvas.width;
  tctx.textBaseline = "alphabetic";
  if (t < T_CLAUDE) {
    const size = fitSize("Opus 5.5", .1964);
    tctx.font = `${WEIGHT} ${size}px ${FONT}`;
    const m = tctx.measureText("Opus 5.5");
    tctx.textAlign = "left";
    tctx.fillText("Opus 5.5", W / 2 - inkWidth(m) / 2 + (m.actualBoundingBoxLeft || 0), fy(.4333) + (m.actualBoundingBoxAscent || size * .68));
  } else {
    const size = fitSize("Claude", .1594);
    tctx.font = `${WEIGHT} ${size}px ${FONT}`;
    const m = tctx.measureText("Claude");
    const tw = inkWidth(m), asc = m.actualBoundingBoxAscent || size * .7;
    const r = asc * .52, gap = frame.w * .0083;
    const x0 = W / 2 - (r * 2 + gap + tw) / 2;
    const top = fy(.4278), base = top + asc;
    drawSpark(x0 + r, (top + base) / 2, r);
    tctx.textAlign = "left";
    tctx.fillText("Claude", x0 + r * 2 + gap + (m.actualBoundingBoxLeft || 0), base);
  }
}

function drawTitles(t, info) {
  tctx.save();
  tctx.fillStyle = "#f4f2ee"; tctx.strokeStyle = "#f4f2ee";
  tctx.shadowColor = "rgba(0,0,0,.3)"; tctx.shadowBlur = 10 * frame.h / 1080;
  const off = -info.rise * frame.h;
  // while the frame is rising fast, smear the wordmark along its path like the camera does
  const v = (riseAt(t) - riseAt(t - .04)) * frame.h;
  const taps = v > 6 ? Math.min(10, Math.ceil(v / 6)) : 1;
  tctx.globalAlpha = taps > 1 ? Math.min(1, 1.8 / taps) : 1;
  for (let k = 0; k < taps; k++) drawTitle(t, info, off + (taps > 1 ? k / (taps - 1) * v : 0));
  tctx.restore();
}

// Only redraw and re-upload the overlay when what it shows has changed
let overlayKey = "";
function drawOverlay(t, info) {
  const s = SHOTS[current];
  const key = s.horses ? `h${info.frame}:${+photosReady()}`
    : s.finale ? `f${t < T_CLAUDE ? 0 : 1}:${Math.round(info.rise * frame.h * 2)}`
    : s.word === W3 ? `s${current}:${Math.round(rimState.alpha * 2e3)}` : `s${current}`;   // only the bent word follows the moving rim
  if (key === overlayKey) return;
  overlayKey = key;
  const W = textCanvas.width, H = textCanvas.height;
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  if (s.horses) {
    const photos = photosReady();
    textQuad.material.blending = photos ? THREE.NormalBlending : THREE.MultiplyBlending;
    if (photos) { tctx.clearRect(0, 0, W, H); drawHorsePhoto(HORSE_PHOTOS[info.frame]); }
    else { tctx.fillStyle = "#fff"; tctx.fillRect(0, 0, W, H); drawHorses(info.frame); }   // white multiplies to nothing
  } else {
    tctx.clearRect(0, 0, W, H);
    if (s.overlay === "threads") drawThreads();
    if (s.overlay === "ink") drawInk();
    if (s.word) drawWord(s);
    else if (s.finale) drawTitles(t, info);
  }
  textTex.needsUpdate = true;
}

/* ------------------------------------------------------------------------------------------
   Sound: a small WebAudio score scheduled against the film's clock
------------------------------------------------------------------------------------------- */
class Score {
  constructor(ctx = new AudioContext()) {
    this.ctx = ctx;
    this.out = ctx.createGain(); this.out.gain.value = .9;
    const comp = ctx.createDynamicsCompressor();
    this.out.connect(comp); comp.connect(ctx.destination);
    if (ctx.createMediaStreamDestination) { this.stream = ctx.createMediaStreamDestination(); comp.connect(this.stream); }
    this.verb = ctx.createConvolver();
    const len = ctx.sampleRate * 3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .35;
    this.verb.connect(wet); wet.connect(this.out);
    this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = this.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.nodes = [];
  }
  track(n) { this.nodes.push(n); return n; }
  stopAll() { for (const n of this.nodes) { try { n.stop(); } catch {} } this.nodes = []; }
  bus(gain, verb = true) {
    const g = this.ctx.createGain(); g.gain.value = 0; g.connect(this.out); if (verb) g.connect(this.verb);
    return g;
  }
  chord(freqs, t0, t1, cut0, cut1, level) {
    const ctx = this.ctx, g = this.bus();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(level, t0 + 1.2);
    g.gain.setValueAtTime(level, t1 - .6); g.gain.linearRampToValueAtTime(0, t1 + .4);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = .8;
    lp.frequency.setValueAtTime(cut0, t0); lp.frequency.exponentialRampToValueAtTime(cut1, t1);
    lp.connect(g);
    for (const f of freqs) for (const det of [-5, 5]) {
      const o = this.track(ctx.createOscillator()); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t0); o.stop(t1 + .5);
    }
    const sub = this.track(ctx.createOscillator()); sub.frequency.value = freqs[0] / 2;
    const sg = ctx.createGain(); sg.gain.value = .6; sub.connect(sg); sg.connect(lp); sub.start(t0); sub.stop(t1 + .5);
  }
  tick(t, level, freq) {
    const ctx = this.ctx, src = this.track(ctx.createBufferSource()); src.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.2;
    const g = this.bus(0, false);
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0001, t + .07);
    src.connect(bp); bp.connect(g); src.start(t); src.stop(t + .1);
  }
  pluck(t, f, level) {
    const ctx = this.ctx, o = this.track(ctx.createOscillator()); o.type = "triangle"; o.frequency.value = f;
    const g = this.bus();
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
    o.connect(g); o.start(t); o.stop(t + .4);
  }
  bell(t, f, level) {
    for (const [m, a, d] of [[1, 1, 3], [2.76, .4, 1.6], [5.4, .2, .8], [8.9, .08, .5]]) {
      const o = this.track(this.ctx.createOscillator()); o.frequency.value = f * m;
      const g = this.bus();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level * a, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); o.start(t); o.stop(t + d + .1);
    }
  }
  thump(t, level) {
    const o = this.track(this.ctx.createOscillator()); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .35);
    const g = this.bus(0, false);
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g); o.start(t); o.stop(t + .6);
  }
  whoosh(t0, t1, level) {
    const ctx = this.ctx, src = this.track(ctx.createBufferSource()); src.buffer = this.noise; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2;
    bp.frequency.setValueAtTime(250, t0); bp.frequency.exponentialRampToValueAtTime(3200, t1);
    const g = this.bus();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(level, t1 - .3); g.gain.linearRampToValueAtTime(0, t1 + .3);
    src.connect(bp); bp.connect(g); src.start(t0); src.stop(t1 + .4);
  }
  // hoofbeat: a dull knock on turf
  clop(t, level) {
    const ctx = this.ctx, src = this.track(ctx.createBufferSource()); src.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 2.5;
    const g = this.bus(0, false);
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
    src.connect(bp); bp.connect(g); src.start(t); src.stop(t + .12);
    this.thump(t, level * .6);
  }
  // one pass of the film, starting at audio time `at`
  loop(at) {
    const A = x => at + x;
    this.chord([146.83, 220, 329.63, 369.99, 554.37], A(0), A(8.72), 500, 1400, .022);
    this.chord([123.47, 185, 220, 293.66, 329.63, 440], A(8.6), A(15.96), 900, 3200, .02);
    this.chord([98, 146.83, 246.94, 369.99, 554.37], A(15.9), A(END), 1800, 600, .024);
    this.whoosh(A(12.48), A(15.96), .05);
    this.whoosh(A(T_RISE), A(END), .06);
    const penta = [587.33, 659.25, 739.99, 880, 987.77, 1174.66];
    SHOTS.forEach((s, i) => {
      if (i === 0 || s.finale) return;
      this.tick(A(s.t), s.word === W3 ? .14 : .08, 2500 + (i * 977) % 4000);
      if (s.word === W3) this.pluck(A(s.t), penta[i % penta.length], .05);
    });
    // the galloping horse: four beats a stride, a stride every ten frames
    const horses = SHOTS.find(s => s.horses);
    for (let n = 0; n < 2; n++) for (const leg of PHOTO_GAIT) {
      const tt = horses.t + ((leg.on - PHOTO_PHASE0 + 1) % 1 + n) * 10 / 25;
      if (tt < horses.end) this.clop(A(tt), leg.fore ? .16 : .2);
    }
    for (const w of [8.72, 10.68, 12.48]) this.thump(A(w), .35);
    this.bell(A(15.96), 587.33, .09);
    this.bell(A(T_CLAUDE), 440, .09);
  }
}

/* ------------------------------------------------------------------------------------------
   Clock, controls, recording
------------------------------------------------------------------------------------------- */
let score = null;
const clock = {
  acc: 0, last: performance.now(), paused: false, audio: false, base: 0, nextLoop: 0,
  now() { return this.audio ? score.ctx.currentTime - this.base : this.acc; },
  tick() {
    const n = performance.now();
    if (!this.paused && !this.audio) this.acc += Math.min(.1, (n - this.last) / 1000);
    this.last = n;
    if (this.audio) {
      while (this.now() > this.nextLoop * END - 1.5) { score.loop(this.base + this.nextLoop * END); this.nextLoop++; }
    }
  },
};

const $ = id => document.getElementById(id);
function restart() {
  clock.acc = 0;
  if (clock.audio) {
    score.stopAll();
    clock.base = score.ctx.currentTime + .08;
    clock.nextLoop = 0;
  }
}
async function setSound(on) {
  if (on && !score) score = new Score();
  if (on) {
    await score.ctx.resume();
    clock.audio = true; clock.paused = false;
    restart();
  } else if (score) {
    score.stopAll();
    clock.acc = Math.max(0, clock.now()); clock.audio = false;
  }
  $("bSound").textContent = on ? "Sound on" : "Sound off";
  $("bSound").classList.toggle("on", on);
  $("bPlay").textContent = "Pause";
}
function togglePause() {
  clock.paused = !clock.paused;
  if (clock.audio) clock.paused ? score.ctx.suspend() : score.ctx.resume();
  $("bPlay").textContent = clock.paused ? "Play" : "Pause";
}

let recorder = null;
async function record() {
  if (recorder) return;
  if (!clock.audio) await setSound(true);
  if (clock.paused) togglePause();
  restart();
  const stream = renderer.domElement.captureStream(60);
  score.stream.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const type = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 20e6 });
  const chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = "opus-5-5-launch.webm";
    a.click();
    recorder = null;
    $("bRec").textContent = "Record"; $("bRec").classList.remove("rec");
  };
  recorder.start();
  $("bRec").textContent = "Recording…"; $("bRec").classList.add("rec");
}

$("bPlay").onclick = togglePause;
$("bRestart").onclick = restart;
$("bSound").onclick = () => setSound(!clock.audio);
$("bRec").onclick = record;
// Inside an embedded viewer downloads are blocked, so recording can't save anything there
let embedded = true;
try { embedded = window.self !== window.top; } catch {}
if (embedded || !window.MediaRecorder) $("bRec").hidden = true;
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  else if (e.key === "r" || e.key === "R") restart();
  else if (e.key === "m" || e.key === "M") setSound(!clock.audio);
  else if (e.key === "h" || e.key === "H") $("ui").classList.toggle("hidden");
});
let idle;
const wake = () => { $("ui").classList.remove("hidden"); clearTimeout(idle); idle = setTimeout(() => !recorder && $("ui").classList.add("hidden"), 2500); };
addEventListener("pointermove", wake); addEventListener("pointerdown", wake); wake();

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h);
  camera.aspect = aspect;
  // 16:9 and wider: the frame's height fills the screen. Narrower: keep most of its width
  // (all of it at 16:9, 60% in portrait) and show more above and below.
  frame.k = aspect >= 16 / 9 ? 1 : Math.max(.6, Math.sqrt(aspect / (16 / 9)));
  camera.fov = aspect >= 16 / 9 ? 36 : 2 * Math.atan(frame.k * TAN_H / aspect) / DEG;
  camera.updateProjectionMatrix();
  bgMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  bgMat.uniforms.uAspect.value = aspect;
  grain.material.uniforms.uAspect.value = aspect;
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  textCanvas.width = buf.x; textCanvas.height = buf.y;
  overlayKey = "";
  frame.w = aspect >= 16 / 9 ? buf.y * 16 / 9 : buf.x / frame.k;
  frame.h = frame.w * 9 / 16;
  frame.x = (buf.x - frame.w) / 2; frame.y = (buf.y - frame.h) / 2;
  bgMat.uniforms.uFrame.value.set(buf.x / frame.w, buf.y / frame.h);
  sphereMat.uniforms.uRes.value.copy(buf);
  sphereMat.uniforms.uTan.value.set(Math.tan(camera.fov * DEG / 2) * aspect, Math.tan(camera.fov * DEG / 2));
}
addEventListener("resize", resize);
resize();

// ?t=12.6 freezes the film on one moment (handy for stills)
const still = parseFloat(new URLSearchParams(location.search).get("t"));

function tickFrame() {
  clock.tick();
  const T = isNaN(still) ? clock.now() : still;
  const t = ((Math.max(0, T) % END) + END) % END;
  U.uTime.value = t;
  const info = update(t);
  drawOverlay(t, info);
  $("fill").style.width = (t / END * 100).toFixed(2) + "%";
  renderer.render(scene, camera);
  window.__filmStarted = true;
  if (recorder && recorder.state === "recording" && clock.now() >= END) recorder.stop();
  if (isNaN(still) || ++stillFrames < 3) requestAnimationFrame(tickFrame);
}
let stillFrames = 0;
// Start once the serif is ready, but never wait on it for more than a second
Promise.race([document.fonts.load(`${WEIGHT} 60px "Newsreader"`), new Promise(r => setTimeout(r, 1000))])
  .catch(() => {}).then(() => requestAnimationFrame(tickFrame));
// Respect reduced motion: start paused on the opening frame
if (matchMedia("(prefers-reduced-motion: reduce)").matches) togglePause();
// For exporting the film to a video file: draw the frame at any time, and render one pass of
// the score offline
window.__film = {
  END,
  frameAt(t, { titles = true } = {}) {
    U.uTime.value = t;
    drawOverlay(t, update(t));
    textQuad.visible = titles;
    renderer.render(scene, camera);
  },
  async score(rate = 48000) {
    const ctx = new OfflineAudioContext(2, Math.ceil(rate * (END + 2)), rate);
    new Score(ctx).loop(0);
    const buf = await ctx.startRendering();
    return [buf.getChannelData(0), buf.getChannelData(1)];
  },
};
window.__stage = "waiting for the first frame";
})();
</script>
