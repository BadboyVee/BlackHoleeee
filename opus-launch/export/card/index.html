<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The preview card: three of the film's shots side by side, with the line split across them.
const FONT = '"Newsreader", Georgia, serif', WEIGHT = 500, INK = '#f4f2ee';
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const rad = d => d * Math.PI / 180;
(async () => {
  await document.fonts.load(`${WEIGHT} 80px "Newsreader"`);
  const [wall, rock, sky] = await Promise.all(['wall.png', 'rock.png', 'sky.png'].map(load));
  const c = document.getElementById('c'), x = c.getContext('2d');
  const W = 1920, H = 1080, X1 = 548, X2 = 1283;
  // a shot on its own card: source point (ax, ay) lands on (px, py), scaled and turned
  function card(x0, x1, img, ax, ay, px, py, s, deg) {
    x.save(); x.beginPath(); x.rect(x0, 0, x1 - x0, H); x.clip();
    x.translate(px, py); x.rotate(rad(deg)); x.scale(s, s); x.drawImage(img, -ax, -ay);
    x.restore();
  }
  card(0, X1, wall, 345, 590, 274, 585, 1.3, -4);            // the yellow wall over the grain
  x.drawImage(sky, X1, 0, X2 - X1, H);                       // dusk at the rim of the planet
  card(X2, W, rock, 1080, 536, 1450, 568, 1.1, 1.5);          // the white stone
  // card edges: a shadow down the left of the middle card, a pale paper edge down its right
  x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(X1 - 1, 0, 3, H);
  x.fillStyle = 'rgba(226,220,212,.8)'; x.fillRect(X2 - 1, 0, 2, H);
  x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(X2 + 1, 0, 2, H);

  // words, each fitted to its ink width and set on its baseline centre
  function word(text, inkW, cx, by, deg) {
    x.font = `${WEIGHT} 100px ${FONT}`;
    let m = x.measureText(text);
    const size = 100 * inkW / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    x.font = `${WEIGHT} ${size}px ${FONT}`;
    m = x.measureText(text);
    const ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    x.save(); x.translate(cx, by); x.rotate(rad(deg));
    x.fillText(text, -ink / 2 + m.actualBoundingBoxLeft, 0);
    x.restore();
    return { size, asc: m.actualBoundingBoxAscent, ink };
  }
  x.fillStyle = INK; x.strokeStyle = INK; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 10;
  word('There’s', 256, 347, 557, -5.3);
  word('more', 180, 772, 531, -1);
  word('to', 62, 1112, 528, -1);
  word('discover.', 306, 1574, 554, 4.6);
  const cl = word('Claude', 191, 945.5, 1010, 0);
  // the spark, drawn as in the film: a dozen rounded rays of slightly different lengths
  const SPARK = Array.from({ length: 12 }, (_, i) => ({
    a: i / 12 * Math.PI * 2 + [0, .06, -.04, .03, -.07, .05, 0, -.03, .06, -.05, .02, -.02][i],
    l: [1, .82, .94, .78, 1, .86, .92, .8, .98, .84, .9, .8][i],
  }));
  const r = 24.4, sx = 808.5, sy = 1010 - cl.asc / 2;
  x.lineCap = 'round'; x.lineWidth = r * .17; x.beginPath();
  for (const s of SPARK) { x.moveTo(sx, sy); x.lineTo(sx + Math.cos(s.a) * r * s.l, sy + Math.sin(s.a) * r * s.l); }
  x.stroke(); x.beginPath(); x.arc(sx, sy, r * .18, 0, Math.PI * 2); x.fill();
  x.shadowBlur = 0;

  // film grain over everything
  const img = x.getImageData(0, 0, W, H), d = img.data;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() + rnd() - 1) * 9;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(img, 0, 0);
  window.__done = true;
})();
</script></body></html>
