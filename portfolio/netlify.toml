# Netlify settings for the portfolio (this folder). In Netlify, make a new site
# from this repo and set its base directory to `portfolio`. The netlify.toml at
# the repo root belongs to a different site (bmw-m5-cs).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change, so let browsers keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
