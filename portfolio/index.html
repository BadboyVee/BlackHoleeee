<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_OG_IMAGE%" />

    <!-- Critical styles for the preloader, so it paints before the bundle arrives. -->
    <style>
      html { background: #050507; color: #f1ece3; }
      body { margin: 0; }
      #preloader {
        position: fixed; inset: 0; z-index: 200; display: grid;
        grid-template-rows: auto 1fr auto; padding: clamp(1.25rem, 3vw, 2.5rem);
        background: #050507; color: #f1ece3;
        font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      #preloader .pl-row { display: flex; justify-content: space-between; gap: 1rem; }
      #preloader .pl-mid { display: grid; place-items: center; }
      #preloader .pl-orbit {
        width: clamp(110px, 16vw, 180px); aspect-ratio: 1; border-radius: 50%;
        border: 1px solid rgba(241, 236, 227, 0.14); position: relative;
        animation: pl-spin 2.4s linear infinite;
      }
      #preloader .pl-orbit::before {
        content: ""; position: absolute; inset: 30%; border-radius: 50%;
        background: #050507; box-shadow: 0 0 0 1px rgba(255, 91, 31, 0.6), 0 0 40px 6px rgba(255, 91, 31, 0.35);
      }
      #preloader .pl-orbit::after {
        content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px;
        border-radius: 50%; background: #ff5b1f; box-shadow: 0 0 16px 2px #ff5b1f;
      }
      #preloader .pl-count {
        font-size: clamp(4.5rem, 16vw, 13rem); line-height: 0.8; letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums; font-weight: 700;
      }
      #preloader .pl-bar { height: 1px; background: rgba(241, 236, 227, 0.14); margin-top: 1.25rem; overflow: hidden; }
      #preloader .pl-bar i { display: block; height: 100%; background: #ff5b1f; transform-origin: left; transform: scaleX(0); }
      #preloader .pl-status { opacity: 0.6; }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #preloader .pl-orbit { animation: none; } }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading">
      <div class="pl-row">
        <span>%SITE_NAME%</span>
        <span class="pl-status" id="pl-status">Bending light</span>
      </div>
      <div class="pl-mid"><div class="pl-orbit"></div></div>
      <div>
        <div class="pl-row" style="align-items: flex-end">
          <span class="pl-count" id="pl-count">000</span>
          <span style="text-align: right">Portfolio<br />©%SITE_YEAR%</span>
        </div>
        <div class="pl-bar"><i id="pl-bar"></i></div>
      </div>
    </div>
    <script>
      // Counts up gently while the bundle downloads; the app takes over from here.
      ;(function () {
        var count = document.getElementById('pl-count')
        var bar = document.getElementById('pl-bar')
        var value = 0
        function tick() {
          if (window.__plTaken) return
          value += (28 - value) * 0.035
          count.textContent = String(Math.floor(value)).padStart(3, '0')
          bar.style.transform = 'scaleX(' + value / 100 + ')'
          requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
        window.__plValue = function () { return value }
      })()
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This portfolio is an interactive 3D experience and needs JavaScript. Say hello at
        <a style="color: #ff5b1f" href="mailto:%SITE_EMAIL%">%SITE_EMAIL%</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
