<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fa">
<title>Waymo &mdash; Jaguar I-PACE</title>
<style>
  :root {
    --ink: #eef1f5;
    --dock: rgba(15, 17, 21, 0.76);
    --line: rgba(255, 255, 255, 0.14);
    --hot: #3d82f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f7fa;
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  #dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: min(96vw, 1240px); padding: 7px;
    border-radius: 16px; background: var(--dock); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 12px 44px rgba(10, 16, 26, 0.24);
    color: var(--ink); z-index: 10;
    transition: opacity .28s ease, transform .28s ease;
  }
  #dock.off { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(16px); }

  .grp { display: flex; flex-direction: column; gap: 6px; padding: 6px 9px; border-radius: 11px;
         background: rgba(255, 255, 255, 0.045); }
  .lbl { font-size: 8px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; }
  .row { display: flex; align-items: center; gap: 5px; }

  .pill {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05);
    color: var(--ink); padding: 6px 9px; border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    transition: background .16s, color .16s, border-color .16s, opacity .16s;
  }
  .pill:hover { background: rgba(255, 255, 255, 0.14); }
  .pill.on { background: var(--hot); border-color: transparent; color: #fff; }
  .pill.dim { opacity: .38; }

  .sw { width: 21px; height: 21px; border-radius: 50%; padding: 0; cursor: pointer;
        border: 2px solid rgba(255, 255, 255, 0.22); transition: transform .16s, box-shadow .16s; }
  .sw:hover { transform: scale(1.14); }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(61, 130, 246, .85); }

  .sl { display: flex; flex-direction: column; gap: 2px; }
  .sl > span { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; opacity: .45; }
  input[type=range] { appearance: none; -webkit-appearance: none; width: 96px; height: 14px; background: none; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px;
      border-radius: 50%; background: #fff; }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }

  #hideUi { position: fixed; top: 16px; right: 16px; z-index: 11; background: var(--dock);
            border-color: var(--line); color: var(--ink);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  @media (max-width: 760px) {
    #dock { bottom: 10px; padding: 5px; gap: 4px; }
    .grp { padding: 5px 7px; }
    input[type=range] { width: 74px; }
  }
</style>
</head>
<body>

<div id="dock">
  <div class="grp"><span class="lbl">Paint</span><div class="row" id="uiPaint"></div></div>
  <div class="grp"><span class="lbl">Scene</span><div class="row" id="uiScene"></div></div>
  <div class="grp"><span class="lbl">Motion</span><div class="row" id="uiMotion"></div></div>
  <div class="grp"><span class="lbl">Dissect</span>
    <div class="row">
      <button class="pill" id="uiGhost">Ghost</button>
      <label class="sl"><span>Split</span><input type="range" id="uiSplit" min="0" max="100" value="0"></label>
      <label class="sl"><span>Cut</span><input type="range" id="uiCut" min="0" max="100" value="0"></label>
    </div>
  </div>
  <div class="grp"><span class="lbl">Layers</span><div class="row" id="uiLayers"></div></div>
</div>
<button class="pill" id="hideUi">UI</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   Waymo autonomous Jaguar I-PACE  --  fully procedural Three.js model
   ---------------------------------------------------------------------
   Coordinate system:  +X = forward (nose),  +Y = up,  +Z = right side.
   Ground plane is Y = 0.  All units are metres, matched to the real car:
   length 4.68, width 1.90, height 1.56, wheelbase 2.99, 20" wheels.
   ===================================================================== */

/* ---------------------------------------------------------------- stage */

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(5.6, 2.35, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.75;
controls.panSpeed = 0.5;
controls.minDistance = 3.4;
controls.maxDistance = 22;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.82, 0);
controls.update();

/* ------------------------------------------------- studio environment map
   A procedural light-box (ceiling softbox + four wall bounces) is rendered
   into a PMREM so every surface picks up soft, high-key studio reflections. */

const ENV_STUDIO = {
  shell: [0.93, 0.95, 0.97],
  ceiling: [6.0, 3.4, 3.0],
  wall: 1.8, bounce: 0.95,
  warm: 0xfff8ee, cool: 0xeef4ff
};

function studioEnvironment(cfg) {
  const env = new THREE.Scene();

  const shell = new THREE.Mesh(
    new THREE.BoxGeometry(40, 22, 40),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide })
  );
  shell.material.color.setRGB(cfg.shell[0], cfg.shell[1], cfg.shell[2]);
  shell.position.y = 6;
  env.add(shell);

  const panel = (w, h, intensity, tint, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.set(tint).multiplyScalar(intensity);
    m.position.set(pos[0], pos[1], pos[2]);
    m.rotation.set(rot[0], rot[1], rot[2]);
    env.add(m);
    return m;
  };

  // ceiling softboxes
  panel(16, 9, cfg.ceiling[0], 0xffffff, [0, 12, 0], [Math.PI / 2, 0, 0]);
  panel(7, 4, cfg.ceiling[1], cfg.warm, [6, 11.4, 5], [Math.PI / 2, 0, 0]);
  panel(7, 4, cfg.ceiling[2], cfg.cool, [-6, 11.4, -5], [Math.PI / 2, 0, 0]);
  // wall bounces, keep every flank of the car lit
  panel(20, 10, cfg.wall * 1.06, 0xffffff, [0, 5, -16], [0, 0, 0]);
  panel(20, 10, cfg.wall * 0.94, 0xffffff, [0, 5, 16], [0, Math.PI, 0]);
  panel(20, 10, cfg.wall * 0.94, cfg.cool, [-16, 5, 0], [0, Math.PI / 2, 0]);
  panel(20, 10, cfg.wall * 0.94, cfg.warm, [16, 5, 0], [0, -Math.PI / 2, 0]);
  // floor bounce
  panel(34, 34, cfg.bounce, 0xffffff, [0, -0.2, 0], [-Math.PI / 2, 0, 0]);

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const tex = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();
  env.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return tex;
}

scene.environment = studioEnvironment(ENV_STUDIO);

/* ------------------------------------------------------------- backdrop */

const backdrop = new THREE.Mesh(
  new THREE.SphereGeometry(200, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top:    { value: new THREE.Color(0xffffff) },
      mid:    { value: new THREE.Color(0xf7f9fb) },
      bottom: { value: new THREE.Color(0xe7ecf1) }
    },
    vertexShader: [
      'varying float vH;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vH = normalize(wp.xyz).y;',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;',
      'varying float vH;',
      'void main(){',
      '  float h = clamp(vH, -1.0, 1.0);',
      '  vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.65)) : mix(mid, bottom, pow(-h, 0.5));',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  })
);
backdrop.frustumCulled = false;
scene.add(backdrop);

/* ------------------------------------------------------------- lighting
   High-key setup: hemisphere base + one soft shadow-casting key + four
   fills so no panel of the car ever falls into darkness. */

const hemi = new THREE.HemisphereLight(0xffffff, 0xdfe5ec, 1.05);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(5.2, 8.4, 5.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 32;
key.shadow.camera.left = -5.2;
key.shadow.camera.right = 5.2;
key.shadow.camera.top = 5.2;
key.shadow.camera.bottom = -5.2;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.022;
key.shadow.radius = 4;
scene.add(key);

const fills = [
  [[-6.5, 5.2, -4.4], 0.62],
  [[-5.0, 3.1, 6.2], 0.5],
  [[6.4, 3.4, -5.6], 0.46],
  [[0.0, 2.0, 9.0], 0.26],
  [[0.0, 2.0, -9.0], 0.24],
  [[0.0, 7.5, 0.0], 0.3]
];
const fillLights = [];
for (const [p, i] of fills) {
  const l = new THREE.DirectionalLight(0xffffff, i);
  l.position.set(p[0], p[1], p[2]);
  l.userData.base = i;
  fillLights.push(l);
  scene.add(l);
}

/* ------------------------------------------------------------ infinite floor */

function radialFade(size, inner, outer, gamma) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, size * inner, size / 2, size / 2, size * outer);
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const v = Math.round(255 * Math.pow(1 - t, gamma));
    grd.addColorStop(t, 'rgb(' + v + ',' + v + ',' + v + ')');
  }
  g.fillStyle = '#000';
  g.fillRect(0, 0, size, size);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(160, 96),
  new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.55,
    metalness: 0.0,
    envMapIntensity: 0.55,
    transparent: true,
    alphaMap: radialFade(1024, 0.02, 0.5, 1.5)
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floor.renderOrder = -1;
scene.add(floor);

/* ---------------------------------------------------------------- materials */

const MAT = {
  paint: new THREE.MeshPhysicalMaterial({
    color: 0xf4f6f8, roughness: 0.3, metalness: 0.03,
    clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.0
  }),
  cabinDark: new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.55, metalness: 0.15, envMapIntensity: 0.35, side: THREE.DoubleSide }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0x0a0e14, roughness: 0.075, metalness: 0.0, transparent: true, opacity: 0.72,
    clearcoat: 0.55, clearcoatRoughness: 0.05, envMapIntensity: 0.55, side: THREE.DoubleSide
  }),
  mirrorGlass: new THREE.MeshStandardMaterial({ color: 0x9fb0c0, roughness: 0.06, metalness: 1.0, envMapIntensity: 1.6 }),
  trimBlack: new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 0.22, metalness: 0.35, envMapIntensity: 1.0 }),
  plasticBlack: new THREE.MeshStandardMaterial({ color: 0x14171b, roughness: 0.68, metalness: 0.05, envMapIntensity: 0.6 }),
  plasticGrain: new THREE.MeshStandardMaterial({ color: 0x191d22, roughness: 0.85, metalness: 0.02, envMapIntensity: 0.45 }),
  sensorShell: new THREE.MeshStandardMaterial({ color: 0x1d2126, roughness: 0.42, metalness: 0.22, envMapIntensity: 0.8 }),
  sensorShellLight: new THREE.MeshStandardMaterial({ color: 0xcdd2d7, roughness: 0.38, metalness: 0.12, envMapIntensity: 0.85 }),
  sensorGlass: new THREE.MeshPhysicalMaterial({
    color: 0x05070a, roughness: 0.045, metalness: 0.1, transparent: true, opacity: 0.88,
    clearcoat: 1.0, clearcoatRoughness: 0.02, envMapIntensity: 1.5
  }),
  lens: new THREE.MeshPhysicalMaterial({
    color: 0x07141c, roughness: 0.03, metalness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.02, envMapIntensity: 2.0
  }),
  lensBlue: new THREE.MeshPhysicalMaterial({
    color: 0x0c2b4a, roughness: 0.03, metalness: 0.35, clearcoat: 1.0, clearcoatRoughness: 0.02, envMapIntensity: 2.2
  }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xe3e7ea, roughness: 0.12, metalness: 1.0, envMapIntensity: 1.4 }),
  gunmetal: new THREE.MeshStandardMaterial({ color: 0x70777f, roughness: 0.28, metalness: 0.95, envMapIntensity: 1.2 }),
  rimFace: new THREE.MeshStandardMaterial({ color: 0x1b1f24, roughness: 0.26, metalness: 0.82, envMapIntensity: 1.15 }),
  rimBarrel: new THREE.MeshStandardMaterial({ color: 0x15181c, roughness: 0.42, metalness: 0.7, envMapIntensity: 0.8 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x131518, roughness: 0.93, metalness: 0.0, envMapIntensity: 0.4 }),
  tireWall: new THREE.MeshStandardMaterial({ color: 0x17191d, roughness: 0.86, metalness: 0.0, envMapIntensity: 0.45 }),
  brakeDisc: new THREE.MeshStandardMaterial({ color: 0x8b9298, roughness: 0.32, metalness: 1.0, envMapIntensity: 1.1 }),
  caliper: new THREE.MeshStandardMaterial({ color: 0x23272c, roughness: 0.45, metalness: 0.5, envMapIntensity: 0.7 }),
  wellLiner: new THREE.MeshStandardMaterial({ color: 0x0c0e11, roughness: 0.95, metalness: 0.0, envMapIntensity: 0.25 }),
  shut: new THREE.MeshStandardMaterial({ color: 0x585e66, roughness: 0.85, metalness: 0.1, envMapIntensity: 0.4 }),
  headlamp: new THREE.MeshPhysicalMaterial({
    color: 0xdfe6ee, roughness: 0.06, metalness: 0.0, transparent: true, opacity: 0.45,
    clearcoat: 1.0, clearcoatRoughness: 0.02, envMapIntensity: 1.8, side: THREE.DoubleSide
  }),
  lampBody: new THREE.MeshStandardMaterial({ color: 0x0d1013, roughness: 0.3, metalness: 0.55, envMapIntensity: 0.9 }),
  led: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xe8f1ff, emissiveIntensity: 1.5, roughness: 0.25, metalness: 0.0 }),
  ledAmber: new THREE.MeshStandardMaterial({ color: 0xffb445, emissive: 0xff8c10, emissiveIntensity: 0.9, roughness: 0.3 }),
  tailLens: new THREE.MeshPhysicalMaterial({
    color: 0x4a0a08, roughness: 0.07, metalness: 0.0, transparent: true, opacity: 0.72,
    clearcoat: 1.0, clearcoatRoughness: 0.03, envMapIntensity: 1.5, side: THREE.DoubleSide
  }),
  tailLed: new THREE.MeshStandardMaterial({ color: 0xff3524, emissive: 0xff1d08, emissiveIntensity: 1.35, roughness: 0.3 }),
  mesh: new THREE.MeshStandardMaterial({ color: 0x0a0c0f, roughness: 0.6, metalness: 0.4, envMapIntensity: 0.5 })
};

/* =====================================================================
   BODY SURFACE
   The whole shell is a lofted surface.  Every station along X is a closed
   section curve built from nine control points (underbody, sill, hip,
   beltline, tumblehome, roof edge, crown).  Each control value is driven
   by its own Catmull-Rom keyframe track so the silhouette, the shoulder
   line and the greenhouse all flow smoothly into one another.
   ===================================================================== */

function track(keys) {
  const n = keys.length;
  const xs = keys.map(k => k[0]);
  const vs = keys.map(k => k[1]);
  const m = new Array(n);
  for (let i = 0; i < n; i++) {
    if (i === 0) m[i] = (vs[1] - vs[0]) / (xs[1] - xs[0]);
    else if (i === n - 1) m[i] = (vs[n - 1] - vs[n - 2]) / (xs[n - 1] - xs[n - 2]);
    else m[i] = (vs[i + 1] - vs[i - 1]) / (xs[i + 1] - xs[i - 1]);
  }
  return function (x) {
    if (x <= xs[0]) return vs[0] + m[0] * (x - xs[0]);
    if (x >= xs[n - 1]) return vs[n - 1] + m[n - 1] * (x - xs[n - 1]);
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * vs[i] + (t3 - 2 * t2 + t) * h * m[i] +
           (-2 * t3 + 3 * t2) * vs[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}

const CAR = {
  xNose: 2.30, xTail: -2.28,     // last lofted stations (caps add ~55mm each)
  frontAxle: 1.495, rearAxle: -1.495,
  trackF: 1.600, trackR: 1.626,
  wheelR: 0.362, tireHalfW: 0.1225,
  archR: 0.418
};

const T = {
  /* roof / hood centre-line height */
  yCrown: track([
    [-2.30, 0.985], [-2.22, 1.105], [-2.12, 1.228], [-2.00, 1.332], [-1.86, 1.404],
    [-1.62, 1.468], [-1.30, 1.516], [-1.00, 1.544], [-0.70, 1.556], [-0.24, 1.562], [0.12, 1.556],
    [0.30, 1.540], [0.48, 1.482], [0.70, 1.356], [0.92, 1.198], [1.12, 1.136],
    [1.45, 1.104], [1.80, 1.078], [2.02, 1.048], [2.18, 1.008], [2.30, 0.958]
  ]),
  /* how far the roof / hood edge sits below the crown */
  dropTop: track([
    [-2.30, 0.030], [-1.90, 0.026], [-1.30, 0.022], [-0.40, 0.020], [0.26, 0.022],
    [0.62, 0.032], [0.95, 0.050], [1.30, 0.056], [1.80, 0.054], [2.10, 0.048], [2.30, 0.038]
  ]),
  zTop: track([
    [-2.30, 0.680], [-2.12, 0.738], [-1.88, 0.756], [-1.54, 0.730], [-1.24, 0.694],
    [-0.90, 0.660], [-0.30, 0.648], [0.16, 0.640], [0.42, 0.664], [0.72, 0.724],
    [0.95, 0.760], [1.30, 0.802], [1.72, 0.806], [2.00, 0.766], [2.18, 0.700], [2.30, 0.604]
  ]),
  yBelt: track([
    [-2.30, 0.900], [-2.08, 0.972], [-1.82, 1.030], [-1.52, 1.052], [-1.14, 1.038],
    [-0.62, 1.012], [-0.10, 0.996], [0.42, 0.992], [0.92, 1.008], [1.30, 1.020],
    [1.72, 1.012], [2.04, 0.960], [2.20, 0.906], [2.30, 0.862]
  ]),
  zBelt: track([
    [-2.30, 0.722], [-2.08, 0.836], [-1.82, 0.902], [-1.46, 0.926], [-1.00, 0.926],
    [-0.40, 0.920], [0.20, 0.916], [0.70, 0.906], [0.95, 0.900], [1.35, 0.896],
    [1.76, 0.878], [2.04, 0.838], [2.20, 0.800], [2.30, 0.762]
  ]),
  yHip: track([
    [-2.30, 0.618], [-2.00, 0.660], [-1.50, 0.700], [-0.90, 0.720], [0.00, 0.730],
    [0.90, 0.740], [1.50, 0.722], [2.05, 0.672], [2.30, 0.640]
  ]),
  zHip: track([
    [-2.30, 0.778], [-2.14, 0.856], [-1.90, 0.912], [-1.62, 0.950], [-1.20, 0.936],
    [-0.60, 0.926], [0.00, 0.925], [0.80, 0.932], [1.26, 0.948], [1.58, 0.950],
    [1.94, 0.926], [2.14, 0.888], [2.30, 0.836]
  ]),
  yRock: track([
    [-2.30, 0.432], [-2.04, 0.404], [-1.60, 0.340], [-0.80, 0.302], [0.00, 0.296],
    [0.90, 0.302], [1.56, 0.342], [2.00, 0.406], [2.30, 0.442]
  ]),
  zRock: track([
    [-2.30, 0.716], [-2.04, 0.792], [-1.70, 0.852], [-1.20, 0.844], [0.00, 0.842],
    [1.20, 0.848], [1.70, 0.858], [2.04, 0.794], [2.30, 0.716]
  ]),
  yFloor: track([
    [-2.30, 0.306], [-2.10, 0.262], [-1.80, 0.222], [-1.00, 0.186], [0.00, 0.182],
    [1.00, 0.186], [1.80, 0.230], [2.10, 0.272], [2.30, 0.320]
  ]),
  zFloor: track([
    [-2.30, 0.500], [-2.00, 0.616], [-1.50, 0.700], [0.00, 0.716], [1.50, 0.700],
    [2.00, 0.616], [2.30, 0.500]
  ]),
  /* tumblehome tuck of the greenhouse flank */
  tumble: track([
    [-2.30, 0.000], [-1.95, 0.004], [-1.60, 0.016], [-1.00, 0.024], [0.00, 0.026],
    [0.60, 0.022], [1.00, 0.010], [1.40, 0.002], [2.30, 0.000]
  ])
};

const _v2 = new THREE.Vector2();

function sectionPoints(x) {
  const yCrown = T.yCrown(x);
  const yTop = yCrown - T.dropTop(x);
  const zTop = T.zTop(x);
  const yBelt = T.yBelt(x), zBelt = T.zBelt(x);
  const yHip = T.yHip(x), zHip = T.zHip(x);
  const yRock = T.yRock(x), zRock = T.zRock(x);
  const yFloor = T.yFloor(x), zFloor = T.zFloor(x);
  const tw = T.tumble(x);
  return [
    new THREE.Vector2(0, yFloor + 0.016),                                   // u 0.000  underbody centre
    new THREE.Vector2(zFloor, yFloor),                                      // u 0.125  floor edge
    new THREE.Vector2(zRock, yRock),                                        // u 0.250  sill
    new THREE.Vector2(zHip, yHip),                                          // u 0.375  hip / max width
    new THREE.Vector2(zBelt, yBelt),                                        // u 0.500  beltline
    new THREE.Vector2(zBelt + (zTop - zBelt) * 0.52 - tw,
                      yBelt + (yTop - yBelt) * 0.58),                       // u 0.625  tumblehome
    new THREE.Vector2(zTop, yTop),                                          // u 0.750  roof / hood edge
    new THREE.Vector2(zTop * 0.58, yCrown - (yCrown - yTop) * 0.14),        // u 0.875  crown shoulder
    new THREE.Vector2(0, yCrown)                                            // u 1.000  crown centre
  ];
}

const _secCache = new Map();
function section(x) {
  const k = Math.round(x * 2000);
  let c = _secCache.get(k);
  if (!c) { c = new THREE.SplineCurve(sectionPoints(k / 2000)); _secCache.set(k, c); }
  return c;
}

/* S(x, w): the body surface.  w in [-1,1] runs right-bottom-centre (w=1)
   up over the crown (w=0) and down the left flank (w=-1). */
function S(x, w, out) {
  out = out || new THREE.Vector3();
  const u = 1 - Math.abs(w);
  const p = section(x).getPoint(u, _v2);
  out.set(x, p.y, w >= 0 ? p.x : -p.x);
  return out;
}

const _n1 = new THREE.Vector3(), _n2 = new THREE.Vector3(), _n3 = new THREE.Vector3(), _n4 = new THREE.Vector3();
function SN(x, w, out) {
  out = out || new THREE.Vector3();
  const e = 0.01, dw = 0.006;
  S(x + e, w, _n1); S(x - e, w, _n2); _n1.sub(_n2);
  S(x, Math.min(0.9999, w + dw), _n3); S(x, Math.max(-0.9999, w - dw), _n4); _n3.sub(_n4);
  out.crossVectors(_n3, _n1);
  if (out.lengthSq() < 1e-12) out.set(0, 1, 0); else out.normalize();
  return out;
}

/* z of the flank at a given (x, y) - used to seat the wheel arches */
function flankZ(x, y) {
  const c = section(x);
  let lo = 0.02, hi = 0.5;   // u range: sill .. beltline
  for (let i = 0; i < 26; i++) {
    const mid = (lo + hi) / 2;
    if (c.getPoint(mid, _v2).y < y) lo = mid; else hi = mid;
  }
  return c.getPoint((lo + hi) / 2, _v2).x;
}

/* ------------------------------------------------ surface patch builder
   Overlays (glass, pillars, lamps, shutlines, cladding) are generated as
   grids sampled off the same surface and pushed out along its normal, so
   every detail hugs the body exactly. */

function patch(o) {
  const nx = o.nx || 30, nw = o.nw || 16;
  const off = o.off !== undefined ? o.off : 0.006;
  const fade = o.fade || {};
  const num = v => (typeof v === 'function' ? v : () => v);
  const wLo = num(o.wLo), wHi = num(o.wHi);
  const pos = new Float32Array((nx + 1) * (nw + 1) * 3);
  const nor = new Float32Array((nx + 1) * (nw + 1) * 3);
  const uvs = new Float32Array((nx + 1) * (nw + 1) * 2);
  const idx = [];
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  const ramp = (t, f) => (f ? Math.min(1, t / f) : 1);
  let k = 0;
  for (let i = 0; i <= nx; i++) {
    const tx = i / nx;
    const x = o.x0 + (o.x1 - o.x0) * tx;
    const a = wLo(tx), b = wHi(tx);
    for (let j = 0; j <= nw; j++) {
      const tw = j / nw;
      const w = a + (b - a) * tw;
      S(x, w, p); SN(x, w, n);
      let f = 1;
      f *= ramp(tx, fade.x0); f *= ramp(1 - tx, fade.x1);
      f *= ramp(tw, fade.w0); f *= ramp(1 - tw, fade.w1);
      const e = off * f;
      pos[k * 3] = p.x + n.x * e; pos[k * 3 + 1] = p.y + n.y * e; pos[k * 3 + 2] = p.z + n.z * e;
      nor[k * 3] = n.x; nor[k * 3 + 1] = n.y; nor[k * 3 + 2] = n.z;
      uvs[k * 2] = tx; uvs[k * 2 + 1] = tw;
      k++;
    }
  }
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < nw; j++) {
      const a = i * (nw + 1) + j, b = a + nw + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

/* mirrored pair of a patch (w -> -w) */
function patchPair(o, material, parent) {
  const flip = v => (typeof v === 'function' ? (t => -v(t)) : -v);
  const a = new THREE.Mesh(patch(o), material);
  const bo = Object.assign({}, o, { wLo: flip(o.wHi), wHi: flip(o.wLo) });
  const b = new THREE.Mesh(patch(bo), material);
  parent.add(a, b);
  return [a, b];
}

/* ---------------------------------------------------------------- glasshouse
   Daylight-opening layout shared by the shell (which cuts the window
   apertures out of the skin) and the glazing that fills them. */

const GL = {
  wsBase: 0.443, wsTop: 0.243,     // windscreen edge, at cowl / at header
  glassTop: 0.268,                 // top edge of the side windows
  railIn: 0.172,                   // inboard edge of the roof rail
  pano: 0.166,                     // half width of the panoramic roof glass
  beltF: 0.470, beltR: 0.450,      // bottom edge of the side windows
  xCowl: 0.905, xHeader: 0.278, xHeadRear: -1.310,
  xDoorF: 0.238, xBpA: -0.372, xBpB: -0.252, xDoorR: -1.040,
  xCp: -1.305, xScreen: -1.585, xGlassRear: -2.262
};

const lerpF = (a, b) => (t => a + (b - a) * t);
const wsEdge = lerpF(GL.wsBase, GL.wsTop);
const rearEdge = lerpF(0.315, 0.250);

const OFF = { paint: 0.005, glass: 0.011, trim: 0.016, rail: 0.021, shut: 0.004 };

/* is this point of the skin inside a window aperture?  The apertures are
   inset from the glass edges so the glazing always laps over the lip. */
function inAperture(x, w) {
  const aw = Math.abs(w);
  if (x <= GL.xCowl - 0.030 && x >= GL.xHeader + 0.028) {
    if (aw <= wsEdge((GL.xCowl - x) / (GL.xCowl - GL.xHeader)) - 0.032) return true;
  }
  if (x <= GL.xDoorF - 0.020 && x >= GL.xBpA + 0.022 &&
      aw >= GL.glassTop + 0.028 && aw <= GL.beltF - 0.028) return true;
  if (x <= GL.xBpB - 0.020 && x >= GL.xDoorR + 0.024 &&
      aw >= GL.glassTop + 0.032 && aw <= GL.beltF - 0.040) return true;
  if (x <= GL.xScreen - 0.045 && x >= GL.xGlassRear + 0.050) {
    if (aw <= rearEdge((GL.xScreen - x) / (GL.xScreen - GL.xGlassRear)) - 0.040) return true;
  }
  return false;
}

/* animated sub-assemblies collected while the car is built */
const SPINNERS = [];      // LiDAR rotors
const WHEELS = [];        // road wheels, spun in drive mode
const STEER_WHEEL = [];   // cabin steering wheel

/* =====================================================================
   SHELL
   One lofted skin for the whole car.  The wheel openings are real holes:
   vertices that land inside an arch are snapped onto the opening boundary
   and the enclosed quads are discarded, so the arch edge is a clean arc.
   ===================================================================== */

const ARCH_LO = -0.155, ARCH_HI = Math.PI + 0.155;

function archSnap(p) {
  if (Math.abs(p.z) < 0.50) return false;
  for (const ax of [CAR.frontAxle, CAR.rearAxle]) {
    const dx = p.x - ax, dy = p.y - CAR.wheelR;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d >= CAR.archR) continue;
    let ang = Math.atan2(dy, dx);
    if (ang < ARCH_LO || ang > ARCH_HI) return false;
    let nd = d, na = ang;
    const dArc = CAR.archR - d;
    const dLo = d * Math.sin(ang - ARCH_LO);
    const dHi = d * Math.sin(ARCH_HI - ang);
    if (dArc <= dLo && dArc <= dHi) nd = CAR.archR;
    else if (dLo <= dHi) na = ARCH_LO;
    else na = ARCH_HI;
    const nx = ax + nd * Math.cos(na), ny = CAR.wheelR + nd * Math.sin(na);
    p.set(nx, ny, (p.z > 0 ? 1 : -1) * flankZ(nx, ny));
    return true;
  }
  return false;
}


/* ---------------------------------------------------------- end fascias
   The nose and tail are domed caps built from the end section: the ring is
   shrunk toward its centroid along a quarter sine.  capUV() inverts that
   mapping so bumpers, lamps and grilles can be laid out in plain (y, z)
   face coordinates and still land exactly on the curved fascia. */

const CAP_NW = 176;

function capFrame(xEnd, dir, depth) {
  const c = new THREE.Vector3();
  const ring = [];
  for (let j = 0; j < CAP_NW; j++) {
    const p = S(xEnd, -1 + 2 * j / CAP_NW);
    ring.push(p); c.add(p);
  }
  c.divideScalar(CAP_NW);
  // monotone unwrapped angle table for the inverse mapping
  const ws = [], ang = [];
  let prev = null, turns = 0;
  for (let j = 0; j <= 720; j++) {
    const w = -1 + 2 * j / 720;
    const p = S(xEnd, w);
    let a = Math.atan2(p.y - c.y, p.z - c.z);
    if (prev !== null) { while (a - prev > Math.PI) a -= 2 * Math.PI; while (prev - a > Math.PI) a += 2 * Math.PI; }
    prev = a; ws.push(w); ang.push(a);
  }
  return { xEnd, dir, depth, c, ring, ws, ang };
}

function capPoint(f, w, t, out) {
  out = out || new THREE.Vector3();
  const p = S(f.xEnd, w), s = Math.cos(t);
  out.set(f.xEnd + f.dir * f.depth * Math.sin(t), f.c.y + (p.y - f.c.y) * s, f.c.z + (p.z - f.c.z) * s);
  return out;
}

const _c1 = new THREE.Vector3(), _c2 = new THREE.Vector3(), _c3 = new THREE.Vector3(), _c4 = new THREE.Vector3();
function capNormal(f, w, t, out) {
  out = out || new THREE.Vector3();
  const dw = 0.006, dt = 0.02;
  capPoint(f, Math.min(0.999, w + dw), t, _c1); capPoint(f, Math.max(-0.999, w - dw), t, _c2);
  capPoint(f, w, Math.min(Math.PI / 2 - 0.001, t + dt), _c3); capPoint(f, w, Math.max(0, t - dt), _c4);
  _c1.sub(_c2); _c3.sub(_c4);
  out.crossVectors(_c1, _c3).normalize();
  if (out.x * f.dir < 0) out.negate();
  return out;
}

/* face coordinates (y, z) -> surface parameters (w, t) */
function capUV(f, y, z) {
  let a = Math.atan2(y - f.c.y, z - f.c.z);
  const a0 = f.ang[0], a1 = f.ang[f.ang.length - 1];
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  while (a > hi) a -= 2 * Math.PI;
  while (a < lo) a += 2 * Math.PI;
  let i = 0;
  const desc = a1 < a0;
  let loI = 0, hiI = f.ang.length - 1;
  while (hiI - loI > 1) {
    const mid = (loI + hiI) >> 1;
    if (desc ? f.ang[mid] > a : f.ang[mid] < a) loI = mid; else hiI = mid;
  }
  i = loI;
  const span = f.ang[hiI] - f.ang[i];
  const fr = Math.abs(span) < 1e-9 ? 0 : (a - f.ang[i]) / span;
  const w = f.ws[i] + (f.ws[hiI] - f.ws[i]) * fr;
  const p = S(f.xEnd, w);
  const R = Math.hypot(p.y - f.c.y, p.z - f.c.z);
  const r = Math.hypot(y - f.c.y, z - f.c.z);
  const t = Math.acos(Math.min(1, Math.max(0, R < 1e-6 ? 0 : r / R)));
  return { w: w, t: t };
}

/* orient an object so +Z follows the surface normal and +Y stays upright */
const _bm = new THREE.Matrix4(), _bx = new THREE.Vector3(), _by = new THREE.Vector3();
const _refUp = new THREE.Vector3(0, 1, 0), _refX = new THREE.Vector3(1, 0, 0);
function orientTo(obj, n) {
  const ref = Math.abs(n.y) > 0.94 ? _refX : _refUp;
  _bx.crossVectors(ref, n).normalize();
  _by.crossVectors(n, _bx).normalize();
  _bm.makeBasis(_bx, _by, n);
  obj.quaternion.setFromRotationMatrix(_bm);
  return obj;
}

function capPlace(obj, f, y, z, lift) {
  const uv = capUV(f, y, z);
  const p = capPoint(f, uv.w, uv.t), n = capNormal(f, uv.w, uv.t);
  obj.position.copy(p).addScaledVector(n, lift || 0);
  return orientTo(obj, n);
}

/* rectangular panel in face coordinates, rounded corners optional */
function capPanel(f, o) {
  const ny = o.ny || 14, nz = o.nz || 20, off = o.off || 0;
  const rad = o.round || 0;
  const pos = new Float32Array((ny + 1) * (nz + 1) * 3);
  const nor = new Float32Array((ny + 1) * (nz + 1) * 3);
  const idx = [];
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  let k = 0;
  for (let i = 0; i <= ny; i++) {
    const ty = i / ny;
    const y = o.y0 + (o.y1 - o.y0) * ty;
    let shrink = 0;
    if (rad > 0) {
      const dy = Math.min(ty, 1 - ty) * Math.abs(o.y1 - o.y0);
      if (dy < rad) shrink = rad - Math.sqrt(Math.max(0, rad * rad - (rad - dy) * (rad - dy)));
    }
    for (let j = 0; j <= nz; j++) {
      const tz = j / nz;
      const z = (o.z0 + shrink) + ((o.z1 - shrink) - (o.z0 + shrink)) * tz;
      const uv = capUV(f, y, z);
      capPoint(f, uv.w, uv.t, p); capNormal(f, uv.w, uv.t, n);
      pos[k * 3] = p.x + n.x * off; pos[k * 3 + 1] = p.y + n.y * off; pos[k * 3 + 2] = p.z + n.z * off;
      nor[k * 3] = n.x; nor[k * 3 + 1] = n.y; nor[k * 3 + 2] = n.z;
      k++;
    }
  }
  for (let i = 0; i < ny; i++) for (let j = 0; j < nz; j++) {
    const a = i * (nz + 1) + j, b = a + nz + 1;
    if (f.dir > 0) idx.push(a, b, a + 1, a + 1, b, b + 1);
    else idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

const NOSE = capFrame(CAR.xNose, 1, 0.062);
const TAIL = capFrame(CAR.xTail, -1, 0.055);

function buildShell() {
  const segs = [
    [-2.28, -2.02, 7], [-2.02, -1.02, 36], [-1.02, -0.34, 15], [-0.34, 0.34, 14],
    [0.34, 1.02, 15], [1.02, 2.02, 36], [2.02, 2.30, 11]
  ];
  const xs = [];
  for (const s of segs) for (let i = 0; i < s[2]; i++) xs.push(s[0] + (s[1] - s[0]) * i / s[2]);
  xs.push(CAR.xNose);

  const NW = 176;
  const ws = [];
  for (let j = 0; j < NW; j++) ws.push(-1 + 2 * j / NW);

  const rings = [], snapped = [], ringX = [], ringCap = [];
  for (const x of xs) {
    const ring = [], sn = [];
    for (let j = 0; j < NW; j++) {
      const p = S(x, ws[j]);
      sn.push(archSnap(p));
      ring.push(p);
    }
    rings.push(ring); snapped.push(sn); ringX.push(x); ringCap.push(false);
  }

  /* domed end caps: the end ring is shrunk toward its centroid along a
     quarter sine so the fascias stay broad and flat with rounded edges */
  function capRings(baseRing, dir, depth, steps, frame) {
    const c = frame.c;
    const out = [];
    for (let i = 1; i <= steps; i++) {
      const t = (i / steps) * Math.PI / 2;
      const s = Math.cos(t);
      const x = baseRing[0].x + dir * depth * Math.sin(t);
      const r = baseRing.map(p => new THREE.Vector3(
        x, c.y + (p.y - c.y) * s, c.z + (p.z - c.z) * s
      ));
      out.push(r);
    }
    return out;
  }

  const frontCaps = capRings(rings[rings.length - 1], 1, NOSE.depth, 6, NOSE);
  const rearCaps = capRings(rings[0], -1, TAIL.depth, 6, TAIL);

  const allRings = [], allSnap = [], allX = [];
  for (let i = rearCaps.length - 1; i >= 0; i--) { allRings.push(rearCaps[i]); allSnap.push(null); allX.push(rearCaps[i][0].x); }
  for (let i = 0; i < rings.length; i++) { allRings.push(rings[i]); allSnap.push(snapped[i]); allX.push(ringX[i]); }
  for (let i = 0; i < frontCaps.length; i++) { allRings.push(frontCaps[i]); allSnap.push(null); allX.push(frontCaps[i][0].x); }

  const R = allRings.length;
  const pos = new Float32Array(R * NW * 3);
  for (let i = 0; i < R; i++) {
    for (let j = 0; j < NW; j++) {
      const p = allRings[i][j], k = (i * NW + j) * 3;
      pos[k] = p.x; pos[k + 1] = p.y; pos[k + 2] = p.z;
    }
  }

  // window apertures, evaluated per vertex on the lofted stations only
  const ap = allRings.map((r, i) => {
    if (!allSnap[i]) return null;
    const row = new Array(NW);
    for (let j = 0; j < NW; j++) row[j] = inAperture(allX[i], ws[j]);
    return row;
  });

  const paintIdx = [], darkIdx = [], underIdx = [];
  const isDark = (i, j) => {
    const x = allX[i], aw = Math.abs(ws[j]);
    if (x > 1.00 || x < -2.26) return false;
    return x > -1.34 ? aw < 0.5 : aw < 0.352;
  };
  const isUnder = (i, j) => Math.abs(ws[j]) > 0.905 && Math.abs(allX[i]) < 1.96;

  for (let i = 0; i < R - 1; i++) {
    const sA = allSnap[i], sB = allSnap[i + 1];
    for (let j = 0; j < NW; j++) {
      const j2 = (j + 1) % NW;
      if (sA && sB && sA[j] && sA[j2] && sB[j] && sB[j2]) continue;   // inside a wheel opening
      if (ap[i] && ap[i + 1] && ap[i][j] && ap[i][j2] && ap[i + 1][j] && ap[i + 1][j2]) continue;
      const a = i * NW + j, b = (i + 1) * NW + j, c = i * NW + j2, d = (i + 1) * NW + j2;
      const list = (isUnder(i, j) && isUnder(i, j2) && isUnder(i + 1, j)) ? underIdx
                 : (isDark(i, j) && isDark(i, j2) && isDark(i + 1, j) && isDark(i + 1, j2)) ? darkIdx
                 : paintIdx;
      list.push(a, c, b, b, c, d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(paintIdx.concat(darkIdx, underIdx));
  g.addGroup(0, paintIdx.length, 0);
  g.addGroup(paintIdx.length, darkIdx.length, 1);
  g.addGroup(paintIdx.length + darkIdx.length, underIdx.length, 2);
  g.computeVertexNormals();

  // average the normals of the two collapsed cap tips so they shade smoothly
  const nrm = g.attributes.normal.array;
  for (const ri of [0, R - 1]) {
    const n = new THREE.Vector3();
    for (let j = 0; j < NW; j++) { const k = (ri * NW + j) * 3; n.x += nrm[k]; n.y += nrm[k + 1]; n.z += nrm[k + 2]; }
    n.normalize();
    for (let j = 0; j < NW; j++) { const k = (ri * NW + j) * 3; nrm[k] = n.x; nrm[k + 1] = n.y; nrm[k + 2] = n.z; }
  }
  g.attributes.normal.needsUpdate = true;

  return new THREE.Mesh(g, [MAT.paint, MAT.cabinDark, MAT.plasticGrain]);
}

/* ------------------------------------------------------- wheel housings
   A swept liner that starts as a proud black arch lip on the flank, rolls
   over the opening edge and tucks back into a closed inner well. */

function buildWheelWell(axleX, side) {
  const N = 72;
  const prof = [
    [0.092, 0.004, true], [0.042, 0.012, true], [0.014, 0.004, true], [0.002, -0.020, false],
    [-0.012, -0.075, false], [-0.026, -0.175, false], [-0.034, -0.290, false], [-0.120, -0.322, false]
  ];
  const cols = prof.length;
  const pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const ang = ARCH_LO + (ARCH_HI - ARCH_LO) * (i / N);
    const rx = axleX + CAR.archR * Math.cos(ang), ry = CAR.wheelR + CAR.archR * Math.sin(ang);
    const zRim = flankZ(rx, Math.min(ry, 1.02));
    const e = Math.min(i / N, 1 - i / N) / 0.10;
    const lipFade = Math.min(1, Math.max(0, e));
    for (let c = 0; c < cols; c++) {
      const [dr0, dz0, onBody] = prof[c];
      const dr = onBody ? dr0 * lipFade : dr0;
      const dz = onBody ? dz0 * lipFade : dz0;
      const px = axleX + (CAR.archR + dr) * Math.cos(ang);
      const py = CAR.wheelR + (CAR.archR + dr) * Math.sin(ang);
      const base = onBody ? flankZ(px, Math.min(Math.max(py, 0.2), 1.02)) : zRim;
      pos.push(px, py, side * (base + dz));
    }
  }
  for (let i = 0; i < N; i++) {
    for (let c = 0; c < cols - 1; c++) {
      const a = i * cols + c, b = (i + 1) * cols + c;
      if (side > 0) idx.push(a, b, a + 1, a + 1, b, b + 1);
      else idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const liner = new THREE.Mesh(g, MAT.wellLiner);

  const back = new THREE.Mesh(new THREE.CircleGeometry(0.435, 40), MAT.wellLiner);
  back.rotation.y = side > 0 ? 0 : Math.PI;
  back.position.set(axleX, CAR.wheelR, side * (flankZ(axleX, CAR.wheelR + CAR.archR * 0.6) - 0.322));

  const grp = new THREE.Group();
  grp.add(liner, back);
  return grp;
}

/* =====================================================================
   WHEELS
   20" ten-spoke gloss-black rim, 245/50 tire with a real lathed sidewall
   profile and moulded tread blocks, drilled disc and caliper behind it.
   Built around the local +Z axis; the outer face looks toward +Z.
   ===================================================================== */

function lathe(profile, seg, material) {
  const g = new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg);
  g.rotateX(Math.PI / 2);
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}

function arcBar(r0, r1, a0, a1, depth, bevel, material) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r1, a0, a1, false);
  s.absarc(0, 0, r0, a1, a0, true);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
    bevelSegments: 3, curveSegments: 24
  });
  g.translate(0, 0, -depth / 2);
  return new THREE.Mesh(g, material);
}

function buildWheel() {
  const w = new THREE.Group();

  /* ---- tire ---- */
  const tp = [
    [0.252, -0.112], [0.268, -0.126], [0.292, -0.133], [0.322, -0.1355], [0.345, -0.130],
    [0.3555, -0.114], [0.3585, -0.092], [0.3595, -0.048], [0.3595, 0.048], [0.3585, 0.092],
    [0.3555, 0.114], [0.345, 0.130], [0.322, 0.1355], [0.292, 0.133], [0.268, 0.126], [0.252, 0.112]
  ];
  const tire = lathe(tp, 72, MAT.tire);
  w.add(tire);

  // sidewall rings (bead ridge + lettering band)
  for (const [r, tube, z] of [[0.300, 0.0045, 0.129], [0.300, 0.0045, -0.129], [0.272, 0.004, 0.1235], [0.272, 0.004, -0.1235]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 64), MAT.tireWall);
    ring.position.z = z;
    w.add(ring);
  }

  // tread blocks: two inner rows plus shoulder lugs
  const rows = [
    { z: 0.052, sx: 0.0085, sy: 0.044, sz: 0.072, r: 0.3595, n: 46, off: 0 },
    { z: -0.052, sx: 0.0085, sy: 0.044, sz: 0.072, r: 0.3595, n: 46, off: 0.5 },
    { z: 0.101, sx: 0.008, sy: 0.030, sz: 0.038, r: 0.3565, n: 46, off: 0.25 },
    { z: -0.101, sx: 0.008, sy: 0.030, sz: 0.038, r: 0.3565, n: 46, off: 0.75 }
  ];
  for (const row of rows) {
    const geo = new THREE.BoxGeometry(row.sx, row.sy, row.sz);
    const inst = new THREE.InstancedMesh(geo, MAT.tire, row.n);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    for (let i = 0; i < row.n; i++) {
      const a = (i + row.off) / row.n * Math.PI * 2;
      e.set(0, 0, a);
      q.setFromEuler(e);
      m.compose(
        new THREE.Vector3(Math.cos(a) * row.r, Math.sin(a) * row.r, row.z),
        q, new THREE.Vector3(1, 1, 1)
      );
      inst.setMatrixAt(i, m);
    }
    inst.castShadow = true;
    w.add(inst);
  }

  /* ---- rim ---- */
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.2465, 0.2385, 0.222, 56, 1, true), MAT.rimBarrel);
  barrel.geometry.rotateX(Math.PI / 2);
  barrel.position.z = -0.002;
  w.add(barrel);

  const outerLip = lathe([
    [0.2385, 0.098], [0.2465, 0.104], [0.2525, 0.112], [0.2535, 0.120], [0.249, 0.1255],
    [0.2405, 0.1245], [0.2365, 0.117]
  ], 64, MAT.rimFace);
  w.add(outerLip);

  const innerLip = lathe([
    [0.2365, -0.117], [0.2445, -0.1235], [0.2495, -0.118], [0.2455, -0.109], [0.2385, -0.104]
  ], 56, MAT.rimBarrel);
  w.add(innerLip);

  // dished rim face: hub pad out to the lip
  const face = lathe([
    [0.0, 0.086], [0.052, 0.088], [0.078, 0.086], [0.086, 0.078], [0.090, 0.060],
    [0.094, 0.040], [0.098, 0.030]
  ], 48, MAT.rimFace);
  w.add(face);

  // ten spokes in five pairs
  const spokeShape = () => {
    const s = new THREE.Shape();
    s.moveTo(0.070, -0.0295);
    s.lineTo(0.150, -0.0335);
    s.lineTo(0.238, -0.0385);
    s.lineTo(0.238, 0.0385);
    s.lineTo(0.150, 0.0335);
    s.lineTo(0.070, 0.0295);
    s.closePath();
    return s;
  };
  const spokeGeo = new THREE.ExtrudeGeometry(spokeShape(), {
    depth: 0.030, bevelEnabled: true, bevelThickness: 0.009, bevelSize: 0.009, bevelSegments: 3, curveSegments: 6
  });
  for (let k = 0; k < 5; k++) {
    for (const s of [-1, 1]) {
      const a = k * Math.PI * 2 / 5 + s * 0.235;
      const sp = new THREE.Mesh(spokeGeo, MAT.rimFace);
      sp.rotation.z = a;
      sp.position.z = 0.058;
      w.add(sp);
    }
  }

  // spoke roots blend into a small centre boss
  const boss = lathe([[0.0, 0.098], [0.045, 0.098], [0.068, 0.094], [0.080, 0.086], [0.082, 0.070]], 40, MAT.rimFace);
  w.add(boss);

  const cap = lathe([[0.0, 0.110], [0.030, 0.1095], [0.044, 0.106], [0.050, 0.100], [0.0505, 0.094]], 36, MAT.trimBlack);
  w.add(cap);
  const capRing = new THREE.Mesh(new THREE.TorusGeometry(0.0495, 0.0035, 8, 40), MAT.chrome);
  capRing.position.z = 0.0985;
  w.add(capRing);

  // lug bolts
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5 + Math.PI / 5;
    const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0115, 0.016, 6), MAT.gunmetal);
    lug.geometry.rotateX(Math.PI / 2);
    lug.position.set(Math.cos(a) * 0.064, Math.sin(a) * 0.064, 0.088);
    w.add(lug);
  }

  // valve stem
  {
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.0085, 0.0095, 0.036, 10), MAT.trimBlack);
    stem.geometry.rotateX(Math.PI / 2);
    stem.position.set(Math.cos(1.1) * 0.168, Math.sin(1.1) * 0.168, 0.100);
    w.add(stem);
    const capNut = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.012, 8), MAT.satin);
    capNut.geometry.rotateX(Math.PI / 2);
    capNut.position.set(Math.cos(1.1) * 0.168, Math.sin(1.1) * 0.168, 0.122);
    w.add(capNut);
  }

  /* ---- brakes ---- */
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.176, 0.176, 0.024, 48), MAT.brakeDisc);
  disc.geometry.rotateX(Math.PI / 2);
  disc.position.z = 0.012;
  w.add(disc);

  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.096, 0.056, 32), MAT.gunmetal);
  hat.geometry.rotateX(Math.PI / 2);
  hat.position.z = 0.040;
  w.add(hat);

  const holeGeo = new THREE.CylinderGeometry(0.0062, 0.0062, 0.028, 8);
  holeGeo.rotateX(Math.PI / 2);
  const holes = new THREE.InstancedMesh(holeGeo, MAT.trimBlack, 60);
  {
    const m = new THREE.Matrix4();
    let n = 0;
    for (const r of [0.120, 0.148]) {
      for (let i = 0; i < 30; i++) {
        const a = i * Math.PI * 2 / 30 + (r > 0.13 ? 0.1 : 0);
        m.makeTranslation(Math.cos(a) * r, Math.sin(a) * r, 0.012);
        holes.setMatrixAt(n++, m);
      }
    }
    holes.count = n;
  }
  w.add(holes);

  const caliper = arcBar(0.150, 0.196, 1.05, 2.05, 0.072, 0.008, MAT.caliper);
  caliper.position.z = 0.012;
  w.add(caliper);
  const calBridge = arcBar(0.186, 0.198, 1.15, 1.95, 0.086, 0.006, MAT.caliper);
  calBridge.position.z = 0.012;
  w.add(calBridge);

  w.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return w;
}

/* simple suspension hardware, seen through the arch opening */
function buildSuspension(axleX, side) {
  const g = new THREE.Group();
  const zw = side * (axleX > 0 ? CAR.trackF : CAR.trackR) / 2;

  const upright = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.078, 0.14, 16), MAT.gunmetal);
  upright.geometry.rotateZ(Math.PI / 2);
  upright.position.set(axleX, CAR.wheelR, zw - side * 0.105);
  g.add(upright);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.105, 0.05, 0.30), MAT.plasticBlack);
  arm.position.set(axleX + 0.01, 0.255, zw - side * 0.19);
  arm.rotation.x = side * 0.06;
  g.add(arm);

  const armB = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.042, 0.26), MAT.plasticBlack);
  armB.position.set(axleX - 0.13, 0.30, zw - side * 0.21);
  armB.rotation.y = side * 0.22;
  g.add(armB);

  const damper = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.05, 0.30, 18), MAT.gunmetal);
  damper.position.set(axleX - 0.02, 0.50, zw - side * 0.135);

  const spring = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.20, 20, 1, true), MAT.plasticBlack);
  spring.position.set(axleX - 0.02, 0.56, zw - side * 0.145);
  g.add(spring);

  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

/* =====================================================================
   WAYMO DRIVER  --  5th generation sensor suite
   Roof fairing with the spinning LiDAR dome and its camera collar, the
   two front wing pods, mirror-mounted cameras and the four perimeter
   housings in the bumpers.
   ===================================================================== */

const sensors = new THREE.Group();

/* reusable sub-assemblies ------------------------------------------- */

function cylZ(rTop, rBot, h, seg, material) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), material);
  m.geometry.rotateX(Math.PI / 2);
  return m;
}
function cylY(rTop, rBot, h, seg, material, open) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, !!open), material);
}

/* small spinning perimeter LiDAR: base, laser window, capped head */
function perimeterLidar(r, h, capMaterial) {
  const g = new THREE.Group();
  const capMat = capMaterial || MAT.sensorShellLight;
  const base = cylY(r * 1.06, r * 1.12, h * 0.26, 28, MAT.sensorShell);
  base.position.y = h * 0.13;
  const band = cylY(r, r, h * 0.46, 28, MAT.sensorGlass);
  band.position.y = h * 0.49;
  const spin = new THREE.Group();
  const rotor = cylY(r * 0.78, r * 0.78, h * 0.34, 20, MAT.lampBody);
  rotor.position.y = h * 0.47;
  spin.add(rotor);
  for (let i = 0; i < 3; i++) {
    const face = new THREE.Mesh(new THREE.BoxGeometry(r * 0.5, h * 0.24, r * 0.3), MAT.lensBlue);
    const a = i * Math.PI * 2 / 3;
    face.position.set(Math.cos(a) * r * 0.72, h * 0.47, Math.sin(a) * r * 0.72);
    face.rotation.y = -a;
    spin.add(face);
  }
  g.add(spin);
  SPINNERS.push({ node: spin, rate: 2.6 });
  const collar = cylY(r * 1.04, r * 1.02, h * 0.10, 28, MAT.gunmetal);
  collar.position.y = h * 0.76;
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(r * 1.04, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
  capTop.scale.y = 0.46;
  capTop.position.y = h * 0.80;
  g.add(base, band, rotor, collar, capTop);
  return g;
}

/* camera in a hooded housing; +Z is the viewing direction */
function cameraModule(w, h, d, lensR) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), MAT.sensorShell);
  shell.position.z = -d / 2;
  const bezel = cylZ(lensR * 1.5, lensR * 1.5, 0.012, 20, MAT.trimBlack);
  const barrel = cylZ(lensR * 1.12, lensR * 1.22, 0.02, 20, MAT.lampBody);
  barrel.position.z = -0.008;
  const glassEye = new THREE.Mesh(new THREE.SphereGeometry(lensR, 20, 10, 0, Math.PI * 2, 0, 1.0), MAT.lensBlue);
  glassEye.geometry.rotateX(Math.PI / 2);
  glassEye.position.z = 0.004;
  const hood = new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, d * 0.55), MAT.sensorShell);
  hood.position.set(0, h / 2 - 0.004, -d * 0.16);
  g.add(shell, barrel, bezel, glassEye, hood);
  return g;
}

/* teardrop fairing revolved about the local X axis */
function teardrop(len, rad, taper, material, seg) {
  const pts = [];
  const n = 18;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const r = rad * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.62)), 0.7) * (1 - taper * t);
    pts.push(new THREE.Vector2(Math.max(0.0015, r), (t - 0.5) * len));
  }
  const g = new THREE.LatheGeometry(pts, seg || 28);
  g.rotateZ(-Math.PI / 2);
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}

/* =====================================================================
   CONTACT SHADOW
   A baked soft occlusion pool under the chassis with four darker patches
   where the tyres meet the floor, laid just above the ground plane.
   ===================================================================== */

function contactShadowTexture() {
  const W = 1024, H = 512;
  const EX = 3.0, EZ = 1.65;                  // world half extents of the plane
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);

  const blob = (x, z, rx, rz, a, falloff) => {
    const px = (x + EX) / (2 * EX) * W;
    const py = (z + EZ) / (2 * EZ) * H;
    const sx = rx / (2 * EX) * W, sy = rz / (2 * EZ) * H;
    g.save();
    g.translate(px, py);
    g.scale(sx, sy);
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      grd.addColorStop(t, 'rgba(0,0,0,' + (a * Math.pow(1 - t, falloff)).toFixed(4) + ')');
    }
    g.fillStyle = grd;
    g.beginPath();
    g.arc(0, 0, 1, 0, Math.PI * 2);
    g.fill();
    g.restore();
  };

  // chassis pool, slightly wider between the axles
  blob(0, 0, 2.62, 1.34, 0.34, 2.2);
  blob(0, 0, 2.08, 1.00, 0.30, 1.7);
  blob(-0.1, 0, 1.58, 0.82, 0.24, 1.5);

  // tyre contact patches
  for (const [ax, tr] of [[CAR.frontAxle, CAR.trackF], [CAR.rearAxle, CAR.trackR]]) {
    for (const side of [1, -1]) {
      blob(ax, side * tr / 2, 0.46, 0.30, 0.34, 2.0);
      blob(ax, side * tr / 2, 0.26, 0.17, 0.46, 1.6);
    }
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return { texture: t, ex: EX, ez: EZ };
}

const contact = (() => {
  const cs = contactShadowTexture();
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(cs.ex * 2, cs.ez * 2),
    new THREE.MeshBasicMaterial({
      map: cs.texture, transparent: true, opacity: 0.92,
      depthWrite: false, toneMapped: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.004;
  shadow.renderOrder = 1;
  scene.add(shadow);
  return shadow;
})();

/* rounded slab primitive used throughout the cabin and running gear */
function roundedBox(w, h, d, r, material) {
  r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
  const iw = w - 2 * r, ih = h - 2 * r, rc = Math.min(iw, ih) * 0.28;
  const s = new THREE.Shape();
  s.moveTo(-iw / 2 + rc, -ih / 2);
  s.lineTo(iw / 2 - rc, -ih / 2);
  s.quadraticCurveTo(iw / 2, -ih / 2, iw / 2, -ih / 2 + rc);
  s.lineTo(iw / 2, ih / 2 - rc);
  s.quadraticCurveTo(iw / 2, ih / 2, iw / 2 - rc, ih / 2);
  s.lineTo(-iw / 2 + rc, ih / 2);
  s.quadraticCurveTo(-iw / 2, ih / 2, -iw / 2, ih / 2 - rc);
  s.lineTo(-iw / 2, -ih / 2 + rc);
  s.quadraticCurveTo(-iw / 2, -ih / 2, -iw / 2 + rc, -ih / 2);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r,
    bevelSegments: 3, curveSegments: 6
  });
  g.translate(0, 0, -(d - 2 * r) / 2);
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}

  const stator = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.30, 30), MAT.motor);

    endBell.geometry.rotateX(Math.PI / 2);
    endBell.position.z = s * 0.172;

  for (let i = 0; i < 14; i++) {
    const a = i * Math.PI * 2 / 14;
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.030, 0.28), MAT.motor);
    rib.position.set(Math.cos(a) * 0.142, Math.sin(a) * 0.142, 0);

  }
  const windings = new THREE.Mesh(new THREE.TorusGeometry(0.104, 0.020, 10, 30), MAT.copper);
  windings.position.z = 0.156;
  g.add(windings);

  const gearbox = roundedBox(0.24, 0.30, 0.20, 0.035, MAT.motor);
  gearbox.position.set(flip * -0.17, -0.02, -0.235);
  g.add(gearbox);

  const inverter = roundedBox(0.30, 0.13, 0.26, 0.022, MAT.module);
  inverter.position.set(flip * 0.10, 0.145, 0.10);
  g.add(inverter);

  // half shafts out to the hubs

/* box spanning two points, used for belts, struts and hard lines */
function strut(a, b, w, h, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, w), material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize());
  return m;
}

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 2);
const CLIP_MATS = [MAT.paint, MAT.cabinDark, MAT.plasticGrain, MAT.plasticBlack, MAT.wellLiner, MAT.trimMid, MAT.carpet];
const GHOST_MATS = [MAT.paint, MAT.cabinDark, MAT.plasticGrain, MAT.plasticBlack, MAT.shut, MAT.wellLiner, MAT.glass];
for (const m of GHOST_MATS) {
  m.userData.baseOpacity = m.opacity;
  m.userData.baseTransparent = m.transparent;
}

let ghostOn = false;
function setGhost(on) {
  ghostOn = on;
  for (const m of GHOST_MATS) {
    if (on) {
      m.transparent = true;
      m.opacity = m === MAT.glass ? 0.12 : 0.15;
      m.depthWrite = false;
    } else {
      m.transparent = m.userData.baseTransparent;
      m.opacity = m.userData.baseOpacity;
      m.depthWrite = true;
    }
    m.needsUpdate = true;
  }
}

let cutAmount = 0;
const CAR_MATS = Object.keys(MAT).map(k => MAT[k]);
for (const m of CAR_MATS) m.userData.baseSide = m.side;

function setCut(v) {
  cutAmount = v;
  const on = v > 0.002;
  clipPlane.constant = 1.14 - v * 1.22;
  // local clipping: the ground plane and backdrop must stay whole
  for (const m of CAR_MATS) {
    m.clippingPlanes = on ? [clipPlane] : null;
    if (CLIP_MATS.indexOf(m) >= 0) m.side = on ? THREE.DoubleSide : m.userData.baseSide;
  }
}

let splitAmount = 0;
function updateShadow() {
  contact.material.opacity = SCENES[sceneIndex].shadow * (1 - 0.78 * splitAmount);
}
function setSplit(v) {
  splitAmount = v;
  const e = v * v * (3 - 2 * v);
  for (const L of LAYERS) L.node.position.y = L.lift * e;
  for (const w of WHEELS) w.pivot.position.z = w.baseZ * (1 + 0.62 * e);
  updateShadow();
}

}

/* --------------------------------------------------------------- loop */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  driveMix += ((motionMode === 'drive' ? 1 : 0) - driveMix) * Math.min(1, dt * 1.6);
  speed += ((motionMode === 'drive' ? 13.4 : 0) - speed) * Math.min(1, dt * 0.9);

  for (const s of SPINNERS) s.node.rotation.y += dt * s.rate * (0.45 + 1.9 * driveMix);

  if (speed > 0.001) {
    const w = speed / CAR.wheelR * dt;
    for (const k of WHEELS) k.wheel.rotation.z += k.spinSign * w;
    roadTex.offset.x += speed * dt / 5.0;
  }

  const steer = Math.sin(t * 0.62) * 0.055 * driveMix;
  for (const k of WHEELS) if (k.steer) k.pivot.rotation.y = steer;
  if (STEER_WHEEL[0]) STEER_WHEEL[0].rotation.z = -steer * 5.5;

  car.position.y = Math.sin(t * 7.4) * 0.0045 * driveMix;
  car.rotation.z = Math.sin(t * 5.1) * 0.0035 * driveMix;
  car.rotation.y = Math.sin(t * 0.62 + 0.4) * 0.006 * driveMix;
  roadMat.opacity = 0.62 * driveMix;

  controls.update();
  renderer.render(scene, camera);
}
animate();

</script>
