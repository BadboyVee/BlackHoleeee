<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071722">
  <title>Seven Wonders — An Interactive 3D Atlas</title>
  <style>
    :root {
      --ink: #f7f2e7;
      --muted: #aebfc7;
      --gold: #e8c27b;
      --gold-bright: #ffe4a6;
      --glass: rgba(8, 24, 34, 0.68);
      --glass-strong: rgba(7, 20, 29, 0.9);
      --line: rgba(232, 194, 123, 0.25);
      --accent: #e8c27b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 200, 125, 0.18), transparent 29%),
        linear-gradient(180deg, #315366 0%, #153746 42%, #081924 78%, #06131e 100%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body { overscroll-behavior: none; }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      isolation: isolate;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    #scene:active { cursor: grabbing; }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2, 10, 18, 0.16), transparent 22%, transparent 73%, rgba(2, 9, 15, 0.42)),
        radial-gradient(ellipse at center, transparent 46%, rgba(1, 8, 14, 0.35) 100%);
      box-shadow: inset 0 0 130px rgba(1, 8, 14, 0.34);
    }

    header {
      position: fixed;
      z-index: 10;
      top: 25px;
      left: 28px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      pointer-events: none;
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.5);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      margin-top: 2px;
      border: 1px solid rgba(232, 194, 123, 0.5);
      border-radius: 50%;
      color: var(--gold-bright);
      font-size: 19px;
      background: rgba(7, 24, 34, 0.42);
      box-shadow: 0 0 26px rgba(232, 194, 123, 0.12), inset 0 0 16px rgba(232, 194, 123, 0.08);
    }

    .kicker {
      margin: 0 0 4px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 3.5vw, 50px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: rgba(232, 240, 242, 0.72);
      font-size: 12px;
      letter-spacing: 0.035em;
    }

    #actions {
      position: fixed;
      z-index: 15;
      top: 25px;
      right: 27px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(7, 22, 31, 0.62);
      color: rgba(245, 244, 235, 0.88);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.06em;
      backdrop-filter: blur(14px) saturate(120%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.17);
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .action:hover {
      transform: translateY(-1px);
      color: #fff;
      border-color: rgba(232, 194, 123, 0.55);
      background: rgba(18, 38, 46, 0.8);
    }

    .action.active {
      color: #1b1710;
      border-color: var(--gold);
      background: linear-gradient(135deg, #f2d394, #d8ad64);
    }

    .action svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #labels {
      position: fixed;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    #labels.labels-off { opacity: 0; pointer-events: none; }

    .hotspot {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 10px 5px 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(5, 19, 28, 0.76);
      color: var(--ink);
      pointer-events: auto;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      backdrop-filter: blur(10px) saturate(125%);
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.28);
      transition: opacity 140ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      left: 16px;
      top: 100%;
      width: 1px;
      height: 15px;
      background: linear-gradient(rgba(232, 194, 123, 0.8), transparent);
    }

    .hotspot:hover,
    .hotspot.selected {
      border-color: var(--accent);
      background: rgba(15, 31, 36, 0.92);
      box-shadow: 0 9px 26px rgba(0, 0, 0, 0.34), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .hotspot.hidden { opacity: 0; pointer-events: none; }

    .pin-number {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #182022;
      background: var(--accent);
      font-family: Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 0 0 3px rgba(232, 194, 123, 0.11);
    }

    .pin-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.05;
    }

    .pin-copy strong {
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .pin-copy small {
      margin-top: 4px;
      color: rgba(215, 226, 229, 0.58);
      font-size: 8px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    #infoPanel {
      position: fixed;
      z-index: 14;
      top: 92px;
      right: 27px;
      width: min(325px, calc(100vw - 32px));
      padding: 20px 21px 19px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid color-mix(in srgb, var(--accent) 70%, white 10%);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(11, 30, 39, 0.91), rgba(6, 18, 27, 0.77));
      backdrop-filter: blur(20px) saturate(130%);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.32);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.985);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
    }

    #infoPanel.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    #infoPanel .info-index {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #infoPanel h2 {
      margin: 0 25px 5px 0;
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    #infoLocation {
      margin: 0;
      color: rgba(221, 231, 233, 0.62);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    #infoDivider {
      width: 42px;
      height: 1px;
      margin: 16px 0 13px;
      background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    #infoFact {
      margin: 0;
      color: rgba(230, 237, 237, 0.78);
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.55;
    }

    #closeInfo {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.64);
      background: rgba(255, 255, 255, 0.05);
      font-size: 18px;
      line-height: 1;
    }

    #closeInfo:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

    #dock {
      position: fixed;
      z-index: 13;
      left: 50%;
      bottom: 22px;
      width: min(1110px, calc(100vw - 34px));
      display: flex;
      gap: 7px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 18px;
      background: rgba(6, 18, 27, 0.68);
      backdrop-filter: blur(20px) saturate(125%);
      box-shadow: 0 22px 65px rgba(0, 0, 0, 0.3);
      transform: translateX(-50%);
    }

    .wonder-card {
      min-width: 0;
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 9px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .wonder-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.055);
      border-color: rgba(255, 255, 255, 0.09);
    }

    .wonder-card.active {
      background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent) 18%, transparent), rgba(255, 255, 255, 0.035));
      border-color: color-mix(in srgb, var(--card-accent) 58%, transparent);
    }

    .card-number {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid color-mix(in srgb, var(--card-accent) 45%, transparent);
      border-radius: 50%;
      color: var(--card-accent);
      font-family: Georgia, serif;
      font-size: 11px;
      background: color-mix(in srgb, var(--card-accent) 8%, transparent);
    }

    .card-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .card-copy strong {
      overflow: hidden;
      color: rgba(250, 249, 242, 0.91);
      font-family: Georgia, serif;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-copy small {
      overflow: hidden;
      margin-top: 4px;
      color: rgba(205, 218, 221, 0.47);
      font-size: 7.5px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      z-index: 9;
      left: 28px;
      bottom: 116px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(227, 235, 236, 0.55);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      pointer-events: none;
    }

    #hint svg {
      width: 21px;
      height: 21px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.4;
    }

    #compass {
      position: fixed;
      z-index: 8;
      right: 31px;
      bottom: 117px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(232, 194, 123, 0.28);
      border-radius: 50%;
      color: rgba(232, 194, 123, 0.75);
      font-family: Georgia, serif;
      font-size: 10px;
      background: rgba(5, 18, 26, 0.35);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #compass::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(232, 194, 123, 0.16);
      border-radius: 50%;
    }

    #compassNeedle {
      position: absolute;
      width: 2px;
      height: 33px;
      transform-origin: center;
    }

    #compassNeedle::before {
      content: "";
      position: absolute;
      left: -3px;
      top: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 8px solid var(--gold);
    }

    #compassN {
      position: absolute;
      top: -13px;
      color: var(--gold);
      font-size: 9px;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(42, 76, 86, 0.75), transparent 36%),
        #071722;
      transition: opacity 700ms ease, visibility 700ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 19px;
      text-align: center;
    }

    .loader-orbit {
      position: relative;
      width: 66px;
      height: 66px;
      border: 1px solid rgba(232, 194, 123, 0.26);
      border-radius: 50%;
      animation: spin 2.4s linear infinite;
    }

    .loader-orbit::before,
    .loader-orbit::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(232, 194, 123, 0.55);
      border-radius: 50%;
      transform: rotateX(64deg);
    }

    .loader-orbit::after {
      inset: 18px;
      background: var(--gold);
      border: 0;
      box-shadow: 0 0 22px rgba(232, 194, 123, 0.7);
      transform: none;
    }

    .loader-title {
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .loader-note {
      max-width: 330px;
      color: rgba(220, 229, 231, 0.55);
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      header { top: 18px; left: 18px; }
      .brand-mark { width: 36px; height: 36px; }
      .subtitle { display: none; }
      #actions { top: 17px; right: 17px; }
      .action { padding: 0 11px; }
      .action .action-label { display: none; }
      .action { width: 40px; padding: 0; }
      #infoPanel { top: 78px; right: 17px; }
      #dock { bottom: 12px; width: calc(100vw - 22px); overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
      #dock::-webkit-scrollbar { display: none; }
      .wonder-card { min-width: 137px; flex: 0 0 137px; }
      #hint { display: none; }
      #compass { right: 18px; bottom: 103px; }
    }

    @media (max-width: 600px) {
      header { gap: 9px; }
      .brand-mark { display: none; }
      .kicker { font-size: 8px; margin-bottom: 5px; }
      h1 { font-size: 30px; }
      #infoPanel {
        top: auto;
        right: 11px;
        left: 11px;
        bottom: 91px;
        width: auto;
        padding: 15px 17px;
      }
      #infoPanel h2 { font-size: 21px; }
      #infoFact { font-size: 12px; line-height: 1.45; }
      #infoDivider { margin: 11px 0 9px; }
      .hotspot { padding-right: 7px; gap: 6px; }
      .pin-copy small { display: none; }
      .pin-copy strong { max-width: 105px; overflow: hidden; text-overflow: ellipsis; font-size: 10px; }
      .pin-number { width: 23px; height: 23px; font-size: 9px; }
      #compass { display: none; }
    }

    @media (max-height: 660px) {
      #infoPanel { top: 78px; max-height: calc(100vh - 188px); overflow: auto; }
      #dock { bottom: 9px; }
      #hint, #compass { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Interactive 3D atlas of the Seven Wonders of the Ancient World"></canvas>
    <div id="veil"></div>

    <header>
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div>
        <p class="kicker">An interactive atlas</p>
        <h1>Seven Wonders</h1>
        <p class="subtitle">The classical wonders, gathered around the ancient world.</p>
      </div>
    </header>

    <nav id="actions" aria-label="World controls">
      <button class="action" id="overviewButton" title="Return to overview (0)" aria-label="Return to overview">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        <span class="action-label">Overview</span>
      </button>
      <button class="action" id="tourButton" title="Start guided tour (T)" aria-label="Start guided tour" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
        <span class="action-label" id="tourLabel">Tour</span>
      </button>
      <button class="action" id="labelsButton" title="Toggle labels (L)" aria-label="Toggle labels" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M20 13c0 5-8 8-8 8S4 18 4 13a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4Z"/><circle cx="12" cy="11" r="1.2"/></svg>
        <span class="action-label">Labels</span>
      </button>
    </nav>

    <div id="labels" aria-label="Wonder markers"></div>

    <aside id="infoPanel" aria-live="polite">
      <button id="closeInfo" aria-label="Close wonder details">×</button>
      <div class="info-index" id="infoIndex">Wonder I</div>
      <h2 id="infoTitle"></h2>
      <p id="infoLocation"></p>
      <div id="infoDivider"></div>
      <p id="infoFact"></p>
    </aside>

    <div id="hint">
      <svg viewBox="0 0 24 24"><path d="M8 10V7a2 2 0 0 1 4 0v3-5a2 2 0 0 1 4 0v5-3a2 2 0 0 1 4 0v7c0 5-3 8-8 8h-1c-3 0-5-2-6-4l-2-4a2 2 0 0 1 3-2l2 2"/></><path d="M3 12h4"/></svg>
      Drag to orbit · scroll to zoom · select a wonder
    </div>

    <div id="compass" aria-hidden="true"><span id="compassNeedle"></span><span id="compassN">N</span></div>
    <nav id="dock" aria-label="Choose a wonder"></nav>

    <div id="loading">
      <div class="loader-wrap">
        <div class="loader-orbit"></div>
        <div class="loader-title">Gathering the Seven Wonders</div>
        <div class="loader-note" id="loadingNote">Building an ancient world in three dimensions</div>
      </div>
    </div>
  </div>

  <script type="module">
    const loadingElement = document.getElementById("loading");

    try {
      const THREE = await import("three");
      const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
      initializeWorld(THREE, OrbitControls);
    } catch (error) {
      console.error(error);
      loadingElement.querySelector(".loader-title").textContent = "The world could not be opened";
      loadingElement.querySelector(".loader-note").textContent = "This experience needs WebGL and an internet connection to load the 3D engine. Please try a current browser.";
    }

    function initializeWorld(THREE, OrbitControls) {
      const WONDERS = [
        {
          roman: "I",
          short: "Great Pyramid",
          name: "Great Pyramid of Giza",
          location: "Giza, Egypt",
          date: "c. 2560 BCE",
          fact: "The oldest and tallest of the ancient wonders, built as a royal tomb for Khufu. At 146 metres, it held the record for the world's tallest structure for more than 3,800 years.",
          accent: "#e8c27b",
          ground: 0xc7a66e,
          height: 4.15
        },
        {
          roman: "II",
          short: "Hanging Gardens",
          name: "Hanging Gardens of Babylon",
          location: "Babylon, Mesopotamia",
          date: "c. 600 BCE",
          fact: "An extraordinary complex of irrigated terraces, flowering plants, and water channels. Their vivid appearance inspired Greek legends of gardens suspended above the city.",
          accent: "#85c987",
          ground: 0x65734d,
          height: 4.55
        },
        {
          roman: "III",
          short: "Temple of Artemis",
          name: "Temple of Artemis",
          location: "Ephesus, Ionia",
          date: "c. 425 BCE",
          fact: "A vast Ionic sanctuary dedicated to Artemis, goddess of the hunt. Its soaring marble columns and richly carved shrines made it one of the Seven Wonders.",
          accent: "#e5a77d",
          ground: 0xb3a27b,
          height: 4.35
        },
        {
          roman: "IV",
          short: "Statue of Zeus",
          name: "Statue of Zeus at Olympia",
          location: "Olympia, Greece",
          date: "c. 435 BCE",
          fact: "Created by the master sculptor Phidias, the seated god was formed from ivory and gold. It stood in the Temple of Zeus as the paramount image of the Hellenic world.",
          accent: "#f0cf70",
          ground: 0x86694c,
          height: 4.75
        },
        {
          roman: "V",
          short: "Mausoleum",
          name: "Mausoleum at Halicarnassus",
          location: "Halicarnassus, Caria",
          date: "c. 350 BCE",
          fact: "The monumental tomb built for Mausolus was surrounded by sculpted columns and crowned by a pyramidal roof. Its name became the origin of the word mausoleum.",
          accent: "#d9c9ae",
          ground: 0xb8aa8e,
          height: 4.75
        },
        {
          roman: "VI",
          short: "Colossus",
          name: "Colossus of Rhodes",
          location: "Rhodes, Greece",
          date: "c. 280 BCE",
          fact: "A gigantic bronze image of the sun god Helios stood beside the harbour of Rhodes. Legend says that ships could pass between the statue's legs.",
          accent: "#c98d54",
          ground: 0x477c83,
          height: 5.45
        },
        {
          roman: "VII",
          short: "Lighthouse",
          name: "Lighthouse of Alexandria",
          location: "Alexandria, Egypt",
          date: "c. 280 BCE",

      function makeMasonryTexture() {
        const size = 256;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#d9bd82";
        ctx.fillRect(0, 0, size, size);

        for (let y = 0; y < size; y += 4) {
          ctx.fillStyle = `rgba(95,70,40,${Math.random() * 0.055})`;
          ctx.fillRect(0, y, size, 2);
        }

        ctx.strokeStyle = "rgba(91,67,37,0.32)";
        ctx.lineWidth = 2;
        for (let y = 0, row = 0; y < size; y += 32, row++) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(size, y + 0.5);
          ctx.stroke();
          for (let x = (row % 2) * 32; x < size; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x + 0.5, y);
            ctx.lineTo(x + 0.5, y + 32);
            ctx.stroke();
          }
        }

        const texture = new THREE.CanvasTexture(c);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(3.5, 2.2);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        return texture;
      }

      function makeTerrainTexture(base, fleck) {
        const size = 128;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 1900; i++) {
          ctx.fillStyle = `rgba(${fleck},${Math.random() * 0.16})`;
          const s = Math.random() * 2 + 0.5;
          ctx.fillRect(Math.random() * size, Math.random() * size, s, s);
        }
        const texture = new THREE.CanvasTexture(c);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(13, 13);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        return texture;
      }

      function makeWaterTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, "rgba(137,229,239,0.85)");
        g.addColorStop(0.45, "rgba(44,160,191,0.65)");
        g.addColorStop(1, "rgba(171,245,245,0.9)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 256);
        for (let i = 0; i < 90; i++) {
          const x = Math.random() * 128;
          const y = Math.random() * 256;
          ctx.fillStyle = `rgba(225,255,255,${0.08 + Math.random() * 0.26})`;
          ctx.fillRect(x, y, 1 + Math.random() * 3, 12 + Math.random() * 42);
        }
        const texture = new THREE.CanvasTexture(c);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1.3, 2.2);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function makeCloudTexture() {
        const size = 256;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const puffs = [
          [78, 143, 53], [119, 105, 67], [164, 128, 58], [111, 153, 55], [191, 151, 40]
        ];
        for (const [x, y, r] of puffs) {
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
          gradient.addColorStop(0, "rgba(225,240,245,0.38)");
          gradient.addColorStop(0.45, "rgba(208,229,238,0.2)");
          gradient.addColorStop(1, "rgba(190,220,232,0)");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, size, size);
        }
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function makeGlowTexture() {
        const size = 128;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, "rgba(255,245,199,1)");
        gradient.addColorStop(0.12, "rgba(255,215,120,0.86)");
        gradient.addColorStop(0.42, "rgba(255,175,70,0.25)");
        gradient.addColorStop(1, "rgba(255,160,50,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      const masonryTexture = makeMasonryTexture();

      const M = {

      function addMesh(parent, geometry, material, x = 0, y = 0, z = 0, cast = true, receive = true) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.castShadow = cast;
        mesh.receiveShadow = receive;
        parent.add(mesh);
        return mesh;
      }

      function addBox(parent, width, height, depth, material, x = 0, y = 0, z = 0) {
        return addMesh(parent, new THREE.BoxGeometry(width, height, depth), material, x, y, z);
      }

      function addCylinder(parent, rTop, rBottom, height, material, x = 0, y = 0, z = 0, segments = 24) {
        return addMesh(parent, new THREE.CylinderGeometry(rTop, rBottom, height, segments), material, x, y, z);
      }

      function addSphere(parent, radius, material, x = 0, y = 0, z = 0, widthSegments = 20) {
        return addMesh(parent, new THREE.SphereGeometry(radius, widthSegments, Math.max(12, widthSegments / 2)), material, x, y, z);
      }

      function addTorus(parent, radius, tube, material, x = 0, y = 0, z = 0, arc = Math.PI * 2) {
        return addMesh(parent, new THREE.TorusGeometry(radius, tube, 10, 72, arc), material, x, y, z);
      }

      function cylinderBetween(parent, a, b, radius, material, endRadius = radius) {
        const start = new THREE.Vector3(...a);
        const end = new THREE.Vector3(...b);
        const direction = new THREE.Vector3().subVectors(end, start);
        const length = direction.length();
        const mesh = addMesh(parent, new THREE.CylinderGeometry(endRadius, radius, length, 14), material);
        mesh.position.copy(start).add(end).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        return mesh;
      }

      function addColumn(parent, x, z, y, height, material = M.marble, radius = 0.12) {
        addCylinder(parent, radius * 1.35, radius * 1.55, 0.12, material, x, y + 0.06, z, 14);
        addCylinder(parent, radius * 0.87, radius, height, material, x, y + height / 2 + 0.1, z, 14);
        addBox(parent, radius * 2.7, 0.12, radius * 2.7, material, x, y + height + 0.16, z);
        addBox(parent, radius * 2.2, 0.08, radius * 2.2, M.paleGold, x, y + height + 0.25, z);
      }

      function createGableRoof(parent, width, depth, height, material, x, y, z) {
        const shape = new THREE.Shape();
        shape.moveTo(-width / 2, 0);
        shape.lineTo(width / 2, 0);
        shape.lineTo(0, height);
        shape.closePath();
        const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, steps: 1 });
        geometry.translate(0, 0, -depth / 2);
        return addMesh(parent, geometry, material, x, y, z);
      }

      const foliage = [];

      function createTree(parent, x, y, z, scale = 1) {
        const tree = new THREE.Group();

        tree.scale.setScalar(scale);

        const crown = new THREE.Group();
        crown.position.y = 0.82;
        addMesh(crown, new THREE.IcosahedronGeometry(0.42, 1), M.leaf, 0, 0.12, 0);
        addMesh(crown, new THREE.IcosahedronGeometry(0.31, 1), M.leafLight, -0.28, -0.02, 0.12);
        addMesh(crown, new THREE.IcosahedronGeometry(0.29, 1), M.leafLight, 0.26, 0.03, -0.08);
        tree.add(crown);
        parent.add(tree);
        foliage.push({ node: crown, phase: Math.random() * Math.PI * 2 });
      }

      function createPlaque(parent, wonder) {

        ctx.strokeStyle = wonder.accent;
        ctx.stroke();
        ctx.fillStyle = wonder.accent;
        ctx.font = "bold 49px Georgia";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(wonder.roman, 64, 67);
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        const plaque = addMesh(
          parent,
          new THREE.PlaneGeometry(0.82, 0.82),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.DoubleSide }),
          0, 0.18, 2.55,
          false,
          false
        );
        plaque.rotation.x = -Math.PI / 2;
      }

      const waveMaterial = new THREE.MeshBasicMaterial({ color: 0x6eb5c1, transparent: true, opacity: 0.13, depthWrite: false });
      const waveRings = [];
      for (const radius of [28, 34, 42, 53]) {

        ring.rotation.x = Math.PI / 2;

      }

      const outerRocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.42, 0), M.deepRock, 88);
      outerRocks.castShadow = true;
      outerRocks.receiveShadow = true;
      const dummy = new THREE.Object3D();
      for (let i = 0; i < 88; i++) {

      const centralOrb = addSphere(scene, 0.84, M.emissiveGold, 0, 4.15, 0, 28);
      const centralHalo = new THREE.Sprite(new THREE.SpriteMaterial({

      const starGeometry = new THREE.BufferGeometry();

      const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({

      }));
      scene.add(stars);

      for (let i = 0; i < 13; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 29 + Math.random() * 17;
        const material = new THREE.SpriteMaterial({
          map: cloudTexture,

        const cloud = new THREE.Sprite(material);

      const wonderAngles = [];

      for (let i = 0; i < 7; i++) {

      function buildPyramid(group) {
        const f = 0.18;
        const pyramid = addMesh(group, new THREE.ConeGeometry(3.3, 3.75, 4, 1, false), M.pyramid, 0, f + 1.875, 0);
        pyramid.rotation.y = Math.PI / 4;

        addBox(group, 4.72, 0.16, 4.72, M.cream, 0, f + 0.04, 0);
        addBox(group, 0.43, 0.66, 0.09, M.door, 0, f + 0.36, 2.35);
        addBox(group, 0.6, 0.12, 0.1, M.sandDark, 0, f + 0.73, 2.35);
        addSphere(group, 0.11, M.gold, 0, f + 3.82, 0, 12);

        const sphinx = new THREE.Group();
        sphinx.position.set(2.65, f, 0.92);
        sphinx.rotation.y = -0.2;
        sphinx.scale.setScalar(0.58);
        addBox(sphinx, 0.72, 0.42, 1.15, M.sand, 0, 0.3, 0);
        addSphere(sphinx, 0.31, M.sand, 0, 0.72, 0.5, 16);
        addBox(sphinx, 0.49, 0.48, 0.18, M.cream, 0, 0.76, 0.73);
        addBox(sphinx, 0.6, 0.16, 0.4, M.sandDark, 0, 0.18, 0.64);
        group.add(sphinx);

        for (let i = 0; i < 7; i++) {
          const a = -0.7 + i * 0.23;
          addBox(group, 0.22, 0.55 + Math.random() * 0.25, 0.25, M.sandDark, Math.cos(a) * 2.8, f + 0.28, Math.sin(a) * 2.8);
        }
      }

      function buildGardens(group) {
        const f = 0.18;
        const tierData = [
          [4.35, 3.65], [3.92, 3.28], [3.48, 2.92], [3.04, 2.55], [2.6, 2.18]
        ];

        tierData.forEach(([w, d], i) => {
          const y = f + 0.25 + i * 0.51;
          addBox(group, w, 0.48, d, i % 2 ? M.brick : M.brickDark, 0, y, 0);
          addBox(group, w + 0.08, 0.09, d + 0.08, M.soil, 0, y + 0.27, 0);
          addBox(group, w - 0.08, 0.08, d - 0.08, i % 2 ? M.leaf : M.leafLight, 0, y + 0.34, 0);
        });

        const topY = f + 0.25 + 4 * 0.51 + 0.38;
        for (const x of [-0.9, 0.9]) {
          for (const z of [-0.62, 0.62]) {
            addColumn(group, x, z, topY, 0.85, M.cream, 0.075);
          }

      const modelBuilders = [buildPyramid, buildGardens, buildArtemis, buildZeus, buildMausoleum, buildColossus, buildLighthouse];
      const entries = [];

      WONDERS.forEach((wonder, index) => {

        });

        scene.add(group);
        entries.push({
          group,

          label: null

      const cards = [];
      WONDERS.forEach((wonder, index) => {
        const card = document.createElement("button");
        card.className = "wonder-card";
        card.style.setProperty("--card-accent", wonder.accent);
        card.setAttribute("aria-label", `Explore ${wonder.name}`);
        card.innerHTML = `
          <span class="card-number">${wonder.roman}</span>
          <span class="card-copy">
            <strong>${wonder.short}</strong>
            <small>${wonder.location}</small>
          </span>`;
        card.addEventListener("click", () => selectWonder(index, true, false));
        dock.appendChild(card);
        cards.push(card);

        const label = document.createElement("button");
        label.className = "hotspot";
        label.style.setProperty("--accent", wonder.accent);
        label.setAttribute("aria-label", `Focus on ${wonder.name}`);
        label.innerHTML = `
          <span class="pin-number">${wonder.roman}</span>
          <span class="pin-copy">
            <strong>${wonder.short}</strong>
            <small>${wonder.location}</small>
          </span>`;
        label.addEventListener("click", () => selectWonder(index, true, false));
        labelRoot.appendChild(label);
        entries[index].label = label;
      });

      let selectedIndex = -1;
      let labelsVisible = true;
      let tourActive = false;
      let tourIndex = -1;
      let nextTourAt = 0;
      let flight = null;

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function flyTo(position, target, duration = 1500, after = null) {
        flight = {
          start: performance.now(),
          duration,
          fromPosition: camera.position.clone(),
          toPosition: position.clone(),
          fromTarget: controls.target.clone(),
          toTarget: target.clone(),
          after
        };
        controls.enabled = false;
      }

      function updateTourButton() {
        tourButton.classList.toggle("active", tourActive);
        tourButton.setAttribute("aria-pressed", String(tourActive));
        tourLabel.textContent = tourActive ? "Stop" : "Tour";
        tourButton.setAttribute("aria-label", tourActive ? "Stop guided tour" : "Start guided tour");
      }

      function stopTour() {
        tourActive = false;
        updateTourButton();
      }

      function selectWonder(index, focus = true, fromTour = false) {
        if (!fromTour) stopTour();
        selectedIndex = index;
        cards.forEach((card, i) => {
          card.classList.toggle("active", i === index);
          card.setAttribute("aria-pressed", String(i === index));
        });
        entries.forEach((entry, i) => entry.label.classList.toggle("selected", i === index));

        if (index < 0) {
          infoPanel.classList.remove("visible");
          document.documentElement.style.setProperty("--accent", "#e8c27b");
          return;
        }

        const wonder = WONDERS[index];
        document.documentElement.style.setProperty("--accent", wonder.accent);
        document.getElementById("infoIndex").textContent = `Wonder ${wonder.roman} · ${wonder.date}`;
        document.getElementById("infoTitle").textContent = wonder.name;
        document.getElementById("infoLocation").textContent = wonder.location;
        document.getElementById("infoFact").textContent = wonder.fact;
        infoPanel.classList.add("visible");

        if (focus) {
          const position = entries[index].group.position;
          const outward = new THREE.Vector3(position.x, 0, position.z).normalize();
          const cameraPosition = new THREE.Vector3(
            position.x + outward.x * 9.5,
            7.4 + (index === 6 ? 0.7 : 0),
            position.z + outward.z * 9.5
          );
          const target = new THREE.Vector3(position.x, wonder.height * 0.48, position.z);
          flyTo(cameraPosition, target, 1600);
        }
      }

      function returnToOverview() {
        stopTour();
        selectWonder(-1, false);
        controls.autoRotate = true;
        flyTo(overviewPosition(), new THREE.Vector3(0, 1.5, 0), 1800);
      }

      tourButton.addEventListener("click", () => {
        if (tourActive) {
          stopTour();
        } else {
          tourActive = true;
          tourIndex = -1;
          nextTourAt = performance.now() + 350;
          updateTourButton();
        }
      });

      document.getElementById("overviewButton").addEventListener("click", returnToOverview);
      document.getElementById("closeInfo").addEventListener("click", returnToOverview);

      labelsButton.addEventListener("click", () => {
        labelsVisible = !labelsVisible;
        labelRoot.classList.toggle("labels-off", !labelsVisible);
        labelsButton.classList.toggle("active", !labelsVisible);
        labelsButton.setAttribute("aria-pressed", String(!labelsVisible));
      });

      window.addEventListener("keydown", event => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
        if (/^[1-7]$/.test(event.key)) selectWonder(Number(event.key) - 1, true, false);
        if (event.key === "0") returnToOverview();
        if (event.key.toLowerCase() === "t") tourButton.click();
        if (event.key.toLowerCase() === "l") labelsButton.click();
        if (event.key === "Escape") returnToOverview();
      });

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let pointerDown = null;

      canvas.addEventListener("pointerdown", event => {
        pointerDown = { x: event.clientX, y: event.clientY };
      });

      canvas.addEventListener("pointerup", event => {
        if (!pointerDown) return;
        const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
        pointerDown = null;
        if (moved > 5) return;

        const rect = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(entries.map(entry => entry.group), true)[0];
        if (hit && Number.isInteger(hit.object.userData.wonderIndex)) {
          selectWonder(hit.object.userData.wonderIndex, true, false);
        }
      });

      controls.addEventListener("start", () => {
        if (!flight) controls.autoRotate = false;
      });

      function updateLabels() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        entries.forEach(entry => {
          const world = entry.group.localToWorld(entry.localAnchor.clone());
          const projected = world.project(camera);
          const visible = labelsVisible && projected.z > -1 && projected.z < 1 &&
            projected.x > -1.25 && projected.x < 1.25 &&
            projected.y > -1.15 && projected.y < 1.15;
          entry.label.classList.toggle("hidden", !visible);
          if (visible) {
            entry.label.style.left = `${(projected.x * 0.5 + 0.5) * width}px`;
            entry.label.style.top = `${(-projected.y * 0.5 + 0.5) * height - 8}px`;
          }
        });
      }

      function handleResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
        renderer.setSize(window.innerWidth, window.innerHeight, false);
      }
      window.addEventListener("resize", handleResize);

      const clock = new THREE.Clock();
      let firstFrame = true;

      function animate() {
        const time = clock.getElapsedTime();
        const now = performance.now();

        if (flight) {
          const raw = Math.min(1, (now - flight.start) / flight.duration);
          const eased = easeInOutCubic(raw);
          camera.position.lerpVectors(flight.fromPosition, flight.toPosition, eased);
          controls.target.lerpVectors(flight.fromTarget, flight.toTarget, eased);
          camera.lookAt(controls.target);
          if (raw >= 1) {
            const callback = flight.after;
            flight = null;
            controls.enabled = true;
            if (callback) callback();
          }
        } else {
          controls.update();
        }

        if (tourActive && now >= nextTourAt) {
          tourIndex = (tourIndex + 1) % WONDERS.length;
          selectWonder(tourIndex, true, true);
          nextTourAt = now + 6500;
        }

        centralOrb.rotation.y = time * 0.22;
        centralHalo.material.opacity = 0.58 + Math.sin(time * 1.6) * 0.08;
        centralRings[0].rotation.z = time * 0.13;
        centralRings[1].rotation.z = -time * 0.11;
        centralRings[2].rotation.y = time * 0.17;
        stars.rotation.y = time * 0.0025;

        waterTexture.offset.y = (time * 0.34) % 1;
        waterTexture.offset.x = Math.sin(time * 0.11) * 0.035;

        beaconBeams.forEach((beam, index) => {
          beam.rotation.y = time * (0.22 + index * 0.018);
        });

        foliage.forEach(item => {
          item.node.rotation.z = Math.sin(time * 0.72 + item.phase) * 0.026;
          item.node.rotation.x = Math.cos(time * 0.48 + item.phase) * 0.014;
        });

        clouds.forEach(cloud => {
          cloud.node.position.x = cloud.x + Math.sin(time * 0.035 + cloud.phase) * 4.5;
          cloud.node.position.z = cloud.z + Math.cos(time * 0.027 + cloud.phase) * 2.2;
        });

        waveRings.forEach((ring, index) => {
          ring.material.opacity = 0.08 + Math.sin(time * 0.45 + index) * 0.035;
        });

        camera.updateMatrixWorld();
        scene.updateMatrixWorld(true);
        updateLabels();

        const azimuth = controls.getAzimuthalAngle();
        document.getElementById("compassNeedle").style.transform = `rotate(${azimuth}rad)`;

        renderer.render(scene, camera);

        if (firstFrame) {
          firstFrame = false;
          setTimeout(() => loadingElement.classList.add("hidden"), 250);
        }
      }

      renderer.setAnimationLoop(animate);
    }
  </script>
</body>
</html>
