<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saltwind Cove</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 40c8-8 16-8 24 0s16 8 32-4v20H4z' fill='%233a8fb7'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="src/ui/ui.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="fps" title="Frames per second · click for frame rate and quality settings"><span id="fps-value">--</span><small> fps</small><span id="fps-ms"></span></div>

<div id="loader">
  <div class="loader-card">
    <div class="loader-title">Saltwind Cove</div>
    <div class="loader-sub">A WebGPU ocean</div>
    <div class="loader-bar"><div id="loader-fill"></div></div>
    <div id="loader-status">Starting…</div>
    <div id="loader-error" hidden></div>
  </div>
</div>

<div id="hint" hidden></div>
<div id="prompt" hidden></div>
<div id="crosshair" hidden></div>
<div id="mode-badge" hidden></div>

<div id="panel" class="collapsed">
  <button id="panel-toggle" title="Settings (Tab)"><span>☰</span></button>
  <div id="panel-body"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
