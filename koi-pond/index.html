<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1d1a">
<meta name="description" content="A living koi pond in Three.js: a waterfall, rocks, lilies, a maple tree and fifteen koi you can feed.">
<title>Koi Pond</title>
<style>
  :root {
    --ink: #f4efe4;
    --muted: #b9c9c2;
    --glass: rgba(9, 26, 23, 0.56);
    --line: rgba(255, 255, 255, 0.13);
    --koi: #f07a3c;
    --koi-deep: #d4482a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0c1d1a; color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4, 12, 10, 0.42) 100%);
  }
  .brand {
    position: fixed; top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left));
    padding: 14px 18px 13px; border-radius: 14px; max-width: min(340px, calc(100vw - 36px));
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  .brand h1 {
    margin: 0 0 4px; font-weight: 500; font-size: 25px; letter-spacing: 0.02em;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  .brand h1 span { color: var(--koi); }
  .brand p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .stat {
    position: fixed; top: max(18px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right));
    padding: 9px 14px; border-radius: 999px; font-size: 13px; color: var(--muted);
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .stat b { color: var(--ink); font-weight: 600; }
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));
    display: flex; gap: 10px; align-items: center;
  }
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid #ffd9a8; outline-offset: 3px; }
  .feed {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
    height: 54px; padding: 0 26px 0 20px; border-radius: 999px;
    font-size: 16.5px; font-weight: 600; letter-spacing: 0.01em; color: #fff9f2;
    background: linear-gradient(180deg, #f59152 0%, var(--koi) 45%, var(--koi-deep) 100%);
    box-shadow: 0 10px 28px rgba(212, 72, 42, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .feed:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .feed:active { transform: translateY(1px) scale(0.98); }
  .feed:disabled { filter: saturate(0.5) brightness(0.85); cursor: default; }
  .feed svg { width: 24px; height: 24px; }
  .feed .ring {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.45); transform: translate(-50%, -50%) scale(0); pointer-events: none;
    animation: ring 0.6s ease-out forwards;
  }
  @keyframes ring { to { transform: translate(-50%, -50%) scale(26); opacity: 0; } }
  .icon {
    width: 46px; height: 46px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--line); color: var(--muted);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .icon:hover { color: var(--ink); }
  .icon[aria-pressed="true"] { color: #ffd9a8; background: rgba(240, 122, 60, 0.28); }
  #soundBtn[aria-pressed="false"] .wave, #soundBtn[aria-pressed="true"] .mute { display: none; }
  .icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toast {
    position: fixed; left: 50%; bottom: max(92px, calc(env(safe-area-inset-bottom) + 84px));
    transform: translate(-50%, 8px); opacity: 0;
    padding: 8px 15px; border-radius: 999px; font-size: 13.5px; white-space: nowrap;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: opacity 0.35s ease, transform 0.35s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #loader {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
    background: radial-gradient(ellipse at 50% 40%, #1d3b34 0%, #0c1d1a 70%);
    transition: opacity 0.9s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader div { text-align: center; }
  #loader h2 {
    margin: 0 0 8px; font-weight: 500; font-size: 34px; letter-spacing: 0.04em;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  #loader p { margin: 0; color: var(--muted); font-size: 14px; }
  #loader .dot { display: inline-block; width: 8px; height: 8px; margin: 18px 4px 0; border-radius: 50%; background: var(--koi); animation: bob 1.1s ease-in-out infinite; }
  #loader .dot:nth-child(2) { animation-delay: 0.15s; background: #f4efe4; }
  #loader .dot:nth-child(3) { animation-delay: 0.3s; background: #222; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  #err { position: fixed; inset: auto 16px 90px; display: none; padding: 12px 14px; border-radius: 10px; background: rgba(120, 20, 10, 0.85); font-size: 13px; z-index: 11; }
  @media (max-width: 560px) {
    .brand { padding: 11px 14px; }
    .brand h1 { font-size: 21px; }
    .brand p { font-size: 11.5px; }
    .feed { height: 50px; padding: 0 20px 0 16px; font-size: 15.5px; }
    .dock { gap: 8px; }
    .stat { top: auto; right: auto; left: 50%; transform: translateX(-50%); bottom: max(88px, calc(env(safe-area-inset-bottom) + 80px)); }
    .toast { bottom: max(132px, calc(env(safe-area-inset-bottom) + 124px)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<header class="brand">
  <h1>Koi <span>Pond</span></h1>
  <p>Drag to orbit · scroll or pinch to zoom · right-drag to pan<br>Tap the water to drop food where you like</p>
</header>
<div class="stat"><b id="eaten">0</b> pellets eaten</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="dock">
  <button class="icon" id="orbitBtn" aria-pressed="false" title="Slow auto-orbit" aria-label="Toggle slow auto-orbit">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v5h-5"/></svg>
  </button>
  <button class="feed" id="feedBtn" aria-label="Feed the koi">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="7" cy="14" r="2.6" fill="#7a3f17"/><circle cx="12.5" cy="9" r="2.4" fill="#b8642a"/>
      <circle cx="16.5" cy="15" r="2.7" fill="#8f4a1d"/><circle cx="10.5" cy="17.5" r="1.9" fill="#c9792f"/>
      <circle cx="18" cy="8.5" r="1.6" fill="#6b3613"/>
    </svg>
    Feed the koi
  </button>
  <button class="icon" id="soundBtn" aria-pressed="false" title="Pond sounds" aria-label="Toggle pond sounds">
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>
</nav>

<div id="loader"><div><h2>Koi Pond</h2><p>Filling the pond…</p><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Utilities: seeded random, Perlin noise, small math helpers
   ===================================================================== */
const TAU = Math.PI * 2;
let seedState = 20261108;
function rand() {
  seedState |= 0; seedState = (seedState + 0x6D2B79F5) | 0;
  let t = Math.imul(seedState ^ (seedState >>> 15), 1 | seedState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

const perm = new Uint8Array(512);
{
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) {
  const k = h & 15, u = k < 8 ? x : y, v = k < 4 ? y : (k === 12 || k === 14 ? x : z);
  return ((k & 1) ? -u : u) + ((k & 2) ? -v : v);
}
function noise3(x, y, z) {
  const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
  const X = fx & 255, Y = fy & 255, Z = fz & 255;
  x -= fx; y -= fy; z -= fz;
  const u = fade(x), v = fade(y), w = fade(z);
  const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
  const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
         lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}
const noise2 = (x, y) => noise3(x, y, 0.37);
function fbm2(x, y, oct = 4) { let a = 0.5, f = 1, s = 0; for (let i = 0; i < oct; i++) { s += a * noise2(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

/* =====================================================================
   The pond's shape and the ground around it
   ===================================================================== */
const WATER_Y = 0;
const POND_SX = 1.3;                   // the outline is stretched along x
function pondR(a) {
  return 8.4 * (1 + 0.10 * Math.sin(2 * a + 0.6) + 0.07 * Math.sin(3 * a + 2.1) + 0.035 * Math.sin(5 * a + 1.0));
}
// approximate signed distance to the pond outline (negative = inside)
function pondSD(x, z) {
  const px = x / POND_SX;
  return Math.hypot(px, z) - pondR(Math.atan2(z, px));
}
function edgePoint(a, offset = 0) {
  const r = pondR(a) + offset;
  return new THREE.Vector3(POND_SX * r * Math.cos(a), 0, r * Math.sin(a));
}
function pondGrad(x, z) {
  const e = 0.05;
  const gx = pondSD(x + e, z) - pondSD(x - e, z), gz = pondSD(x, z + e) - pondSD(x, z - e);
  const l = Math.hypot(gx, gz) || 1;
  return [gx / l, gz / l];

// The waterfall sits at the back of the pond, a little to the left.
const FALL_A = -Math.PI / 2 - 0.28;
const FALL_B = edgePoint(FALL_A);
const FALL_OUT = (() => { const g = pondGrad(FALL_B.x, FALL_B.z); return new THREE.Vector3(g[0], 0, g[1]); })();
const FALL_RIGHT = new THREE.Vector3(-FALL_OUT.z, 0, FALL_OUT.x);
const fallPt = (out, side = 0, y = 0) => FALL_B.clone().addScaledVector(FALL_OUT, out).addScaledVector(FALL_RIGHT, side).setY(y);
const HILL_C = fallPt(4.6);

function terrainHeight(x, z) {
  const d = pondSD(x, z);
  let h;
  if (d < 0) {
    const t = -d;
    h = -0.22 - 0.28 * smooth(0, 0.9, t) - 1.75 * smooth(0.9, 5.2, t);
    h += 0.22 * fbm2(x * 0.32 + 11, z * 0.32) * smooth(0.3, 2.0, t);
    // a deeper plunge pool under the waterfall
    const fx = x - (FALL_B.x - FALL_OUT.x * 0.9), fz = z - (FALL_B.z - FALL_OUT.z * 0.9);
    h -= 0.55 * Math.exp(-(fx * fx + fz * fz) / 2.2) * smooth(0, 0.8, t);
  } else {
    h = -0.22 + 0.64 * smooth(0, 0.9, d) + 0.45 * smooth(0.9, 7, d);
    h += 0.28 * fbm2(x * 0.16, z * 0.16 + 5) * smooth(0.6, 3, d);
    h += 1.6 * (fbm2(x * 0.035 + 3, z * 0.035) + 0.35) * smooth(7, 24, d);
    const hx = x - HILL_C.x, hz = z - HILL_C.z;
    h += 3.0 * Math.exp(-(hx * hx + hz * hz) / (2 * 3.4 * 3.4)) * smooth(0.0, 2.4, d);
    // carve a bed for the two cascade pools so the hill never pokes through them
    const bx = x - FALL_B.x, bz = z - FALL_B.z;
    const o = bx * FALL_OUT.x + bz * FALL_OUT.z, sd = Math.abs(bx * FALL_RIGHT.x + bz * FALL_RIGHT.z);
    if (o > -0.3 && o < 3.8 && sd < 1.8) {
      const w = smooth(1.8, 1.0, sd) * smooth(3.8, 3.2, o);
      h = lerp(h, Math.min(h, o < 1.6 ? 1.2 : 2.5), w);

/* =====================================================================

   ===================================================================== */
const canvas = document.getElementById('c');
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(innerWidth, innerHeight) < 820);

renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

// Layers: 0 = everything solid, 1 = under the water only, 2 = see-through things above it,
// 5 = drawn only in the final pass (water surface, sky, spray).
const L_UNDER = 1, L_FX = 2, L_FINAL = 5;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color('#c7d3c6');
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0115);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 420);
camera.position.set(3.5, 9.5, 17.5);
camera.layers.enableAll();

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, -1.0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.2;
controls.maxDistance = 42;
controls.maxPolarAngle = 1.47;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.autoRotateSpeed = 0.4;
controls.update();

const U = {                              // uniforms shared by many materials
  time: { value: 0 },
  sunDir: { value: new THREE.Vector3(-0.74, 0.6, -0.3).normalize() },
  sunColor: { value: new THREE.Color(1.0, 0.88, 0.72) },

const sun = new THREE.DirectionalLight(U.sunColor.value, 3.3);
sun.position.copy(U.sunDir.value).multiplyScalar(45);

sun.shadow.mapSize.set(IS_MOBILE ? 1024 : 2048, IS_MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -21, right: 21, top: 21, bottom: -21, near: 5, far: 95 });
sun.shadow.bias = -0.0004;

scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight('#cfe2f5', '#4d4630', 0.95));
const fill = new THREE.DirectionalLight('#d9e6ff', 0.55);
fill.position.set(6, 8, 12);
scene.add(fill);

/* =====================================================================

const GLSL_NOISE = /* glsl */`
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

float fbmN(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
vec3 voronoi(vec2 x) {
  vec2 n = floor(x), f = fract(x); float md = 8.0, md2 = 8.0; vec2 id = n;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 r = g + hash22(n + g) - f; float d = dot(r, r);
    if (d < md) { md2 = md; md = d; id = n + g; } else if (d < md2) { md2 = d; }
  }

float cauVor(vec2 x, float t) {
  vec2 n = floor(x), f = fract(x); float md = 8.0, md2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 o = hash22(n + g); o = 0.5 + 0.42 * sin(t + 6.2831 * o);
    vec2 r = g + o - f; float d = dot(r, r);

  float a = cauVor(p * 1.45, t * 0.85);
  float b = cauVor(p * 2.2 + 7.3, t * 1.1 + 2.0);
  float c = (1.0 - smoothstep(0.0, 0.17, a)) * 0.65 + (1.0 - smoothstep(0.0, 0.12, b)) * 0.45;
  return c * c;

`;

const GLSL_SKY = /* glsl */`
uniform vec3 uSunDir;
uniform vec3 uFogCol;
vec3 skyColor(vec3 d, float t) {
  float y = d.y;
  vec3 zen = vec3(0.09, 0.24, 0.56), mid = vec3(0.33, 0.52, 0.78), hor = vec3(0.86, 0.80, 0.68);
  vec3 col = mix(hor, mid, smoothstep(0.0, 0.28, y));

  float s = max(dot(d, uSunDir), 0.0);

  col += vec3(1.0, 0.95, 0.85) * smoothstep(0.99955, 0.99975, s) * 24.0;

    float c = fbmN(uv) * 0.75 + fbmN(uv * 2.7 + 3.1) * 0.25;
    c = smoothstep(0.42, 0.78, c) * smoothstep(0.02, 0.2, y);
    vec3 cc = mix(vec3(1.0, 0.97, 0.92), vec3(0.70, 0.74, 0.80), smoothstep(0.5, 1.0, c)) * 1.1;
    cc += vec3(1.0, 0.8, 0.55) * pow(s, 5.0) * 0.8;
    col = mix(col, cc, c * 0.9);
  }
  col = mix(col, uFogCol, smoothstep(0.10, -0.02, y));
  return col;

`;

const skyUniforms = { uSunDir: U.sunDir, uTime: U.time, uFogCol: { value: FOG_COLOR } };
function makeSkyMaterial() {
  return new THREE.ShaderMaterial({

/* A tileable normal map for the water, built from integer-frequency waves */
function makeWaterNormalTex(size = 256) {
  const waves = [];
  for (let i = 0; i < 46; i++) {
    const k = rr(2, 20), a = rand() * TAU;
    let kx = Math.round(Math.cos(a) * k), ky = Math.round(Math.sin(a) * k);
    if (!kx && !ky) kx = 2;
    waves.push([kx, ky, 1 / Math.pow(Math.hypot(kx, ky), 1.3), rand() * TAU]);
  }
  const sx = new Float32Array(size * size), sy = new Float32Array(size * size);
  let rms = 0;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size; let gx = 0, gy = 0;
    for (const [kx, ky, amp, ph] of waves) { const c = Math.cos(TAU * (kx * u + ky * v) + ph) * amp; gx += c * kx; gy += c * ky; }
    const i = y * size + x; sx[i] = gx; sy[i] = gy; rms += gx * gx + gy * gy;
  }
  const norm = 0.42 / Math.sqrt(rms / (size * size));
  const data = new Uint8Array(size * size * 4);
  for (let i = 0; i < size * size; i++) {
    const nx = -sx[i] * norm, ny = -sy[i] * norm, l = Math.hypot(nx, ny, 1);
    data[i * 4] = (nx / l * 0.5 + 0.5) * 255; data[i * 4 + 1] = (ny / l * 0.5 + 0.5) * 255;
    data[i * 4 + 2] = (1 / l * 0.5 + 0.5) * 255; data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true; tex.anisotropy = 4; tex.needsUpdate = true;
  return tex;
}
const waterNormalTex = makeWaterNormalTex();

/* Under-water caustics, wet stone near the waterline and pebbles on the pond floor,
   injected into the standard material so shadows and lighting still work. */
const WET_A = { value: new THREE.Vector2() }, WET_B = { value: new THREE.Vector2() };
function addWaterEffects(mat, { pebbles = 0, grassy = 0, caustics = 1, fallWet = 0 } = {}) {
  mat.defines = Object.assign(mat.defines || {}, { PEBBLES: pebbles, GRASSY: grassy, CAUSTICS: caustics, FALLWET: fallWet });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time; sh.uniforms.uSunColor = U.sunColor; sh.uniforms.uWetA = WET_A; sh.uniforms.uWetB = WET_B;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', /* glsl */`#include <worldpos_vertex>
        vec4 wpp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wpp = instanceMatrix * wpp;
        #endif
        vWPos = (modelMatrix * wpp).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;\nuniform float uTime;\nuniform vec3 uSunColor;\nuniform vec2 uWetA, uWetB;\n${GLSL_NOISE}`)
      .replace('#include <color_fragment>', /* glsl */`#include <color_fragment>
        float uw = smoothstep(0.02, -0.14, vWPos.y);
        float wetBand = smoothstep(0.45, 0.02, vWPos.y) * (1.0 - uw);
        #if FALLWET
          vec2 wpa = vWPos.xz - uWetA, wba = uWetB - uWetA;
          float wsd = length(wpa - wba * clamp(dot(wpa, wba) / dot(wba, wba), 0.0, 1.0));
          wetBand = max(wetBand, smoothstep(1.35, 0.5, wsd) * (1.0 - uw));
        #endif
        #if PEBBLES
          vec3 vo = voronoi(vWPos.xz * 7.5);
          float gap = smoothstep(0.0, 0.05, vo.y - vo.x);
          vec3 peb = mix(vec3(0.20, 0.19, 0.16), vec3(0.46, 0.42, 0.35), vo.z);
          peb = mix(peb, vec3(0.36, 0.23, 0.13), step(0.8, vo.z) * step(vo.z, 0.9));
          peb = mix(peb, vec3(0.6, 0.58, 0.54), step(0.95, vo.z));
          peb *= 1.15 - 0.95 * vo.x * vo.x;
          vec3 gravel = mix(vec3(0.07, 0.06, 0.045), peb, gap);
          float deep = smoothstep(-0.45, -1.5, vWPos.y);
          float mud = clamp(smoothstep(0.42, 0.62, fbmN(vWPos.xz * 0.45 + 4.0)) + deep, 0.0, 1.0);
          vec3 algae = mix(vec3(0.09, 0.11, 0.05), vec3(0.17, 0.18, 0.09), vnoise(vWPos.xz * 2.5));
          vec3 silt = mix(diffuseColor.rgb, algae, 0.55) * (0.78 + 0.44 * vnoise(vWPos.xz * 8.0));
          vec3 floorCol = mix(gravel, silt, mud * 0.9);
          diffuseColor.rgb = mix(diffuseColor.rgb, floorCol, smoothstep(0.22, -0.05, vWPos.y));
        #endif
        #if GRASSY
          float gn = fbmN(vWPos.xz * 2.3);
          diffuseColor.rgb *= mix(1.0, 0.7 + 0.6 * gn, smoothstep(0.12, 0.5, vWPos.y));
        #endif
        diffuseColor.rgb *= 1.0 - 0.42 * wetBand;
        diffuseColor.rgb *= mix(vec3(1.0), vec3(0.80, 0.90, 0.82), uw);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.3, wetBand);`)
      .replace('#include <opaque_fragment>', /* glsl */`
        #if CAUSTICS
          float cz = caustic(vWPos.xz, uTime * 1.25);
          float depthF = smoothstep(-0.02, -0.3, vWPos.y) * exp(vWPos.y * 0.3);
          outgoingLight += diffuseColor.rgb * uSunColor * cz * depthF * 1.9;
        #endif
        #include <opaque_fragment>`);
  };
  return mat;
}

/* =====================================================================
   Terrain: one heightfield for the pond floor, the shore and the banks
   ===================================================================== */
{
  const SIZE = 130, SEG = IS_MOBILE ? 170 : 250;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const C = (h) => new THREE.Color(h);
  const cDeep = C('#3b3a2a'), cMud = C('#5c4e36'), cSand = C('#8a7a58'), cSoil = C('#6a5638');
  const cGrassA = C('#45612a'), cGrassB = C('#6a8238'), cMoss = C('#3b5526'), cDry = C('#8a8448');
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.hypot(x, z);
    let h = terrainHeight(x, z);
    h += 7.5 * smooth(36, 64, r) * (0.6 + 0.6 * (fbm2(x * 0.05, z * 0.05) + 0.5));   // distant hills close the view
    pos.setY(i, h);
    const n1 = fbm2(x * 0.22 + 40, z * 0.22), n2 = fbm2(x * 0.9, z * 0.9 + 9);
    if (h < -0.06) {
      c.copy(cMud).lerp(cDeep, smooth(-0.3, -2.0, h));
    } else if (h < 0.38) {
      c.copy(cSand).lerp(cSoil, clamp(0.5 + n1 * 1.6, 0, 1)).lerp(cMoss, smooth(0.15, 0.38, h) * 0.6);
    } else {
      c.copy(cGrassA).lerp(cGrassB, clamp(0.5 + n1 * 1.8, 0, 1)).lerp(cMoss, clamp(n2 * 2.2, 0, 1) * 0.7);
      c.lerp(cDry, smooth(0.15, 0.4, n1) * 0.35);
    }
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mat = addWaterEffects(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.93, envMapIntensity: 0.45 }), { pebbles: 1, grassy: 1 });
  const ter = new THREE.Mesh(geo, mat);
  ter.receiveShadow = true;
  scene.add(ter);
}

/* =====================================================================
   Rocks: noise-sculpted, facet-cut boulders merged into one mesh
   ===================================================================== */
const C = (h) => new THREE.Color(h);
function makeRockVariant(seed, detail) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  const cuts = [];
  for (let i = 0; i < 5; i++) cuts.push([new THREE.Vector3(rr(-1, 1), rr(-0.5, 1), rr(-1, 1)).normalize(), rr(0.6, 0.86)]);
  const ao = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const r = 1 + 0.36 * fbm3(v.x * 1.25 + seed, v.y * 1.25, v.z * 1.25 - seed, 4) + 0.05 * noise3(v.x * 5 + seed, v.y * 5, v.z * 5);
    v.multiplyScalar(r);
    for (const [cn, cd] of cuts) { const d = v.dot(cn); if (d > cd) v.addScaledVector(cn, -(d - cd) * 0.85); }
    if (v.y < -0.4) v.y = -0.4 + (v.y + 0.4) * 0.35;
    ao[i] = r;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  g.setAttribute('ao', new THREE.BufferAttribute(ao, 1));
  return g;
}
const rockVariants = Array.from({ length: 7 }, (_, i) => makeRockVariant(i * 13.7 + 3, 3));
const rockParts = [];
const waterRocks = [];          // the koi steer around these
const rockTints = ['#8b867a', '#7a7369', '#968c7c', '#706e6a', '#86796a', '#8f8a82'].map(C);
const cMossA = C('#4f6c29'), cMossB = C('#71873a'), cAlgae = C('#4c5334');
function placeRock(x, z, top, sx, sy, sz, { rotY = rand() * TAU, variant = Math.floor(rand() * rockVariants.length), tilt = 0.12, moss = 1 } = {}) {
  const g = rockVariants[variant].clone();
  g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rr(-tilt, tilt), rotY, rr(-tilt, tilt))), new THREE.Vector3(sx, sy, sz)));
  g.computeBoundingBox();
  g.translate(x, top - g.boundingBox.max.y, z);
  const p = g.attributes.position, n = g.attributes.normal, ao = g.attributes.ao;
  const col = new Float32Array(p.count * 3), tint = pick(rockTints), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
    const nn = noise3(px * 1.6, py * 1.6, pz * 1.6), fine = noise3(px * 6, py * 6, pz * 6);
    c.copy(tint).multiplyScalar(0.8 + 0.3 * nn + 0.12 * fine);
    c.multiplyScalar(0.5 + 0.5 * smooth(0.72, 1.12, ao.getX(i)));
    const m = smooth(0.42, 0.85, n.getY(i) + nn * 0.5) * smooth(0.0, 0.3, py) * moss;
    c.lerp(fine > 0 ? cMossA : cMossB, m * 0.9);
    c.lerp(cAlgae, smooth(0.05, -0.35, py) * 0.45);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.deleteAttribute('ao');
  g.computeBoundingBox();
  const bb = g.boundingBox;
  if (bb.min.y < -0.05 && pondSD(x, z) < 0.4) {
    waterRocks.push({ x, z, r: Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z) * 0.5, top: bb.max.y });
  }
  rockParts.push(g);
  return g;
}

    placeRock(p.x, p.z, rr(0.12, 0.42) + s * 0.18, s * rr(1.0, 1.5), s * rr(0.5, 0.75), s * rr(0.9, 1.3));

/* =====================================================================
   Water: planar reflection + screen-space refraction with depth tint
   ===================================================================== */
const fogUniforms = () => ({ fogDensity: { value: 0 }, fogNear: { value: 1 }, fogFar: { value: 2000 }, fogColor: { value: new THREE.Color() } });
const MAX_RIPPLES = 24;
const ripples = Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0));
let rippleIdx = 0;
function addRipple(x, z, amp = 1) {
  ripples[rippleIdx].set(x, z, U.time.value, amp);
  rippleIdx = (rippleIdx + 1) % MAX_RIPPLES;
}

const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false };
const reflRT = new THREE.WebGLRenderTarget(4, 4, rtOpts);
const refrRT = new THREE.WebGLRenderTarget(4, 4, rtOpts);
refrRT.depthTexture = new THREE.DepthTexture(4, 4);

const waterUniforms = Object.assign(fogUniforms(), {
  uTime: U.time, uSunDir: U.sunDir, uSunColor: U.sunColor, uFogCol: { value: FOG_COLOR },
  tRefl: { value: reflRT.texture }, tRefr: { value: refrRT.texture }, tDepth: { value: refrRT.depthTexture },
  tNormal: { value: waterNormalTex },
  uReflMatrix: { value: new THREE.Matrix4() },
  uRes: { value: new THREE.Vector2(1, 1) },
  uNear: { value: camera.near }, uFar: { value: camera.far },
  uRipples: { value: ripples },
  uFall: { value: new THREE.Vector3(0, 0, 1) },
  uAbsorb: { value: new THREE.Vector3(0.46, 0.17, 0.25) },
  uScatter: { value: new THREE.Vector3(0.022, 0.062, 0.050) },
});
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms, fog: true,
  defines: { MAX_RIPPLES },
  vertexShader: /* glsl */`
    uniform mat4 uReflMatrix;
    varying vec4 vRefl; varying vec3 vWPos; varying float vViewZ;
    #include <fog_pars_vertex>
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWPos = wp.xyz;
      vRefl = uReflMatrix * wp;
      vec4 mvPosition = viewMatrix * wp;
      vViewZ = -mvPosition.z;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tRefl, tRefr, tDepth, tNormal;
    uniform vec2 uRes; uniform float uTime, uNear, uFar;
    uniform vec3 uSunColor, uAbsorb, uScatter, uFall;
    uniform vec4 uRipples[MAX_RIPPLES];
    varying vec4 vRefl; varying vec3 vWPos; varying float vViewZ;
    #include <packing>
    #include <fog_pars_fragment>
    ${GLSL_NOISE}
    ${GLSL_SKY}
    float linDepth(float d) { return -perspectiveDepthToViewZ(d, uNear, uFar); }
    void main() {
      vec2 p = vWPos.xz; float t = uTime;
      vec3 n1 = texture2D(tNormal, p * 0.075 + vec2(t * 0.011, t * 0.007)).xyz * 2.0 - 1.0;
      vec3 n2 = texture2D(tNormal, p * 0.13 + vec2(-t * 0.009, t * 0.013)).xyz * 2.0 - 1.0;
      vec3 n3 = texture2D(tNormal, p * 0.43 + vec2(t * 0.024, -t * 0.019)).xyz * 2.0 - 1.0;
      vec2 g = (n1.xy * 0.5 + n2.xy * 0.4 + n3.xy * 0.2) * 0.17;
      float crest = 0.0;
      for (int i = 0; i < MAX_RIPPLES; i++) {
        vec4 r = uRipples[i];
        float age = t - r.z;
        if (age < 0.0 || age > 4.5) continue;
        vec2 dv = p - r.xy; float d = length(dv) + 1e-4;
        float x = d - age * 0.9;
        float env = smoothstep(0.1, -0.08, x) * smoothstep(-1.7, -0.35, x);
        float decay = r.w * exp(-age * 0.85) / (1.0 + d * 1.4);
        g += (dv / d) * cos(x * 17.0) * env * decay * 0.6;

      m.rotation.set(-Math.PI / 2 + Math.sin(L.t * 2.1 + L.ph) * 0.9, L.t * L.spin, Math.cos(L.t * 1.6 + L.ph) * 0.6);
      const overWater = pondSD(L.pos.x, L.pos.z) < -0.15;
      const ground = overWater ? WATER_Y + 0.01 : terrainHeight(L.pos.x, L.pos.z) + 0.03;
      if (L.pos.y <= ground) {
        L.pos.y = ground; L.t = 0; L.rot = rand() * TAU;

        if (overWater) addRipple(L.pos.x, L.pos.z, 0.18);
      }
    } else if (L.state === 'float') {
      const fx = L.pos.x - FALL_IMPACT.x, fz = L.pos.z - FALL_IMPACT.z, fd = Math.hypot(fx, fz) + 1e-3;
      L.vel.x += (noise2(L.ph * 5 + t * 0.05, 7) * 0.05 + (fd < 5 ? fx / fd * 0.2 * (1 - fd / 5) : 0)) * dt;
      L.vel.z += (noise2(L.ph * 5, t * 0.05 + 2) * 0.05 + (fd < 5 ? fz / fd * 0.2 * (1 - fd / 5) : 0)) * dt;

        if (dx * dx + dz * dz < 0.35) { L.vel.x += k.vel.x * 0.3 * dt; L.vel.z += k.vel.z * 0.3 * dt; }
      }
      const sd = pondSD(L.pos.x, L.pos.z);
      if (sd > -0.4) { const [gx, gz] = pondGrad(L.pos.x, L.pos.z); L.vel.x -= gx * 0.4 * dt; L.vel.z -= gz * 0.4 * dt; }
      L.vel.multiplyScalar(Math.max(0, 1 - dt * 0.5));
      L.pos.x += L.vel.x * dt; L.pos.z += L.vel.z * dt;
      L.pos.y = WATER_Y + 0.01 + 0.004 * Math.sin(t * 1.4 + L.ph);
      L.rot += (L.vel.x - L.vel.z) * dt * 0.8 + dt * 0.03;
      m.rotation.set(-Math.PI / 2, 0, L.rot);
      if (L.t > 40) { L.s -= dt * 0.3; m.scale.setScalar(Math.max(L.s, 0.001)); if (L.s <= 0) { L.state = 'wait'; L.wait = rr(2, 14); m.visible = false; } }
    } else if (L.state === 'ground') {
      m.rotation.set(-Math.PI / 2, 0, L.rot);
      if (L.t > 15) { L.s -= dt * 0.4; m.scale.setScalar(Math.max(L.s, 0.001)); if (L.s <= 0) { L.state = 'wait'; L.wait = rr(2, 14); m.visible = false; } }
    }
    m.position.copy(L.pos);
  }
}

function updatePads(dt) {
  const t = U.time.value;
  pads.forEach((p, i) => {
    let ax = (p.hx - p.x) * 0.05 + noise2(p.ph * 7 + t * 0.05, 3) * 0.03;
    let az = (p.hz - p.z) * 0.05 + noise2(p.ph * 7, t * 0.05 + 9) * 0.03;
    for (const k of koi) {
      if (k.pos.y < -0.5) continue;
      const dx = p.x - k.pos.x, dz = p.z - k.pos.z, d = Math.hypot(dx, dz) + 1e-3, R = p.r + 0.3 * k.size;
      if (d < R) { const w = (R - d) / R; ax += dx / d * w * 0.9 + k.vel.x * w * 0.4; az += dz / d * w * 0.9 + k.vel.z * w * 0.4; }
    }
    for (const q of pads) {
      if (q === p) continue;
      const dx = p.x - q.x, dz = p.z - q.z, d = Math.hypot(dx, dz) + 1e-3, R = p.r + q.r - 0.04;
      if (d < R) { ax += dx / d * (R - d) * 2.5; az += dz / d * (R - d) * 2.5; }
    }
    p.vx = (p.vx + ax * dt) * Math.max(0, 1 - dt * 0.9);
    p.vz = (p.vz + az * dt) * Math.max(0, 1 - dt * 0.9);
    p.x += p.vx * dt; p.z += p.vz * dt;
    p.rot += (p.spin + (p.vx - p.vz) * 0.4) * dt;
    p.y = WATER_Y + 0.006 + 0.004 * Math.sin(t * 1.3 + p.ph);
    setInst(padMesh, i, p.x, p.y, p.z, 0, p.rot, 0, p.r, p.r, p.r);
  });
  padMesh.instanceMatrix.needsUpdate = true;
  for (const f of flowers) {
    const p = f.pad;
    f.mesh.position.set(p.x + Math.cos(p.rot) * f.off * p.r, p.y + 0.012, p.z + Math.sin(p.rot) * f.off * p.r);
    f.mesh.rotation.y = p.rot * 0.6;
  }
}

function makeWingTexture() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(235, 245, 255, 0.55)';
  g.beginPath(); g.ellipse(128, 32, 124, 26, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(60, 70, 80, 0.55)'; g.lineWidth = 1;
  for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(6, 32); g.lineTo(250, 10 + i * 5.5); g.stroke(); }
  for (let x = 20; x < 250; x += 11) { g.beginPath(); g.moveTo(x, 8); g.lineTo(x + 3, 56); g.stroke(); }
  g.fillStyle = 'rgba(40, 30, 20, 0.9)'; g.fillRect(222, 14, 12, 6);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const dragonflies = [];
{
  const wingTex = makeWingTexture();
  const wingGeo = new THREE.PlaneGeometry(0.27, 0.06).translate(0.135, 0, 0).rotateX(-Math.PI / 2);
  const wingMat = new THREE.MeshStandardMaterial({ map: wingTex, transparent: true, depthWrite: false, side: THREE.DoubleSide, roughness: 0.15, metalness: 0.4, color: '#e8f4ff' });
  for (const col of ['#2f7fd8', '#d8442f', '#3aa86a']) {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.55, roughness: 0.3 });
    const abd = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.006, 0.36, 6), bodyMat);
    abd.rotation.x = Math.PI / 2; abd.position.z = -0.19;
    const thx = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), bodyMat); thx.scale.set(1, 0.9, 1.4);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.023, 10, 8), new THREE.MeshStandardMaterial({ color: '#1f2a24', roughness: 0.15, metalness: 0.3 }));
    head.position.z = 0.042; head.scale.x = 1.45;
    g.add(abd, thx, head);
    const wings = [];
    for (const [z, sw] of [[0.012, 1], [-0.03, 0.9]]) for (const side of [-1, 1]) {
      const pv = new THREE.Group(); pv.position.set(side * 0.012, 0.016, z);
      const w = new THREE.Mesh(wingGeo, wingMat); w.scale.set(side * sw, 1, 1);
      pv.add(w); g.add(pv); wings.push({ pv, side, back: z < 0 });
    }
    g.traverse((o) => o.layers.set(L_FX));
    scene.add(g);
    const d = { g, wings, pos: new THREE.Vector3(rr(-6, 6), rr(0.5, 1.4), rr(-4, 4)), from: new THREE.Vector3(), to: new THREE.Vector3(), anchor: new THREE.Vector3(),
      state: 'hover', hover: rr(0.5, 2), t: 0, yaw: rand() * TAU, ph: rand() * 10, dip: false };
    d.anchor.copy(d.pos);
    dragonflies.push(d);
  }
}
function updateDragonflies(dt) {
  const t = U.time.value;
  for (const d of dragonflies) {
    let heading = null;
    if (d.state === 'hover') {
      d.hover -= dt;
      d.pos.set(d.anchor.x + Math.sin(t * 3.1 + d.ph) * 0.03, d.anchor.y + Math.sin(t * 2.3 + d.ph) * 0.025, d.anchor.z + Math.cos(t * 2.7 + d.ph) * 0.03);
      if (d.hover <= 0) {
        let x, z, k = 0;
        do { x = d.pos.x + rr(-4, 4); z = d.pos.z + rr(-3.5, 3.5); k++; } while (pondSD(x, z) > -0.6 && k < 20);
        if (k >= 20) { x = rr(-4, 4); z = rr(-3, 3); }
        d.dip = rand() < 0.18;
        d.from.copy(d.pos); d.to.set(x, d.dip ? 0.07 : rr(0.35, 1.6), z);
        d.dur = clamp(d.from.distanceTo(d.to) / rr(2.5, 4.5), 0.3, 1.3); d.t = 0; d.state = 'dart';
      }
    } else {
      d.t += dt / d.dur;
      const e = d.t < 0.5 ? 4 * d.t ** 3 : 1 - Math.pow(-2 * d.t + 2, 3) / 2;
      d.pos.lerpVectors(d.from, d.to, Math.min(e, 1));
      d.pos.y += Math.sin(Math.PI * Math.min(d.t, 1)) * 0.15;
      heading = Math.atan2(d.to.x - d.from.x, d.to.z - d.from.z);
      if (d.t >= 1) {
        d.state = 'hover'; d.anchor.copy(d.to); d.hover = rr(0.6, 2.8);
        if (d.dip) { addRipple(d.to.x, d.to.z, 0.22); d.anchor.y = rr(0.5, 1.2); d.hover = 0.25; }
      }
    }
    if (heading !== null) d.yaw += angDiff(heading, d.yaw) * Math.min(1, dt * 10);
    else d.yaw += Math.sin(t * 0.7 + d.ph) * dt * 0.4;
    d.g.position.copy(d.pos);
    d.g.rotation.set(0, d.yaw, 0);
    for (const w of d.wings) w.pv.rotation.z = w.side * (0.15 + 0.5 * Math.sin(t * 75 + (w.back ? 1.6 : 0)));
  }
}

/* =====================================================================
   Sound: synthesised waterfall, birds and plops (off until asked for)
   ===================================================================== */
const sfx = (() => {
  let ctx = null, master = null, on = false, noiseBuf = null;
  const R = (a, b) => a + (b - a) * Math.random();
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c); let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2 + w * 0.06; }
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.connect(lp).connect(g).connect(master); src.start();
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.21; lg.gain.value = 320;
    lfo.connect(lg).connect(lp.frequency); lfo.start();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const hiss = ctx.createBufferSource(); hiss.buffer = buf; hiss.loop = true; hiss.playbackRate.value = 1.7;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2800; bp.Q.value = 0.6;
    const hg = ctx.createGain(); hg.gain.value = 0.05;
    hiss.connect(bp).connect(hg).connect(master); hiss.start();
    const birds = () => { if (on) bird(); setTimeout(birds, R(2500, 9000)); };
    setTimeout(birds, 1500);
  }
  function bird() {
    const pan = ctx.createStereoPanner(); pan.pan.value = R(-0.9, 0.9); pan.connect(master);
    let t = ctx.currentTime + 0.05;
    const base = R(2200, 3800), notes = 2 + Math.floor(R(0, 5));
    for (let i = 0; i < notes; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain(), d = R(0.06, 0.14);
      o.frequency.setValueAtTime(base * R(0.9, 1.15), t);
      o.frequency.exponentialRampToValueAtTime(base * R(1.2, 1.6), t + d * 0.5);
      o.frequency.exponentialRampToValueAtTime(base * R(0.8, 1.0), t + d);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(pan); o.start(t); o.stop(t + d + 0.02);
      t += d + R(0.03, 0.12);
    }
  }
  const _r = new THREE.Vector3();
  function plop(vol, pitch, pos) {
    if (!on || !ctx) return;
    let pan = 0;
    if (pos) {
      _r.set(1, 0, 0).applyQuaternion(camera.quaternion);
      const dx = pos.x - camera.position.x, dy = pos.y - camera.position.y, dz = pos.z - camera.position.z;
      pan = clamp((dx * _r.x + dz * _r.z) / 8, -0.9, 0.9);
      vol /= 1 + Math.hypot(dx, dy, dz) * 0.05;
    }
    const t = ctx.currentTime, p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(master);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(650 * pitch, t); o.frequency.exponentialRampToValueAtTime(170 * pitch, t + 0.11);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4 * vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(p); o.start(t); o.stop(t + 0.18);
    const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    n.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1600 * pitch; bp.Q.value = 1.2;
    ng.gain.setValueAtTime(0.25 * vol, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(bp).connect(ng).connect(p); n.start(t); n.stop(t + 0.12);
  }
  function toggle() {
    if (!ctx) init();
    on = !on;
    ctx.resume();
    master.gain.setTargetAtTime(on ? 0.7 : 0, ctx.currentTime, 0.4);
    return on;
  }
  return { plop, toggle };
})();

   Interface: feeding, tapping the water, auto-orbit, sound

const feedBtn = document.getElementById('feedBtn'), toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, ms = 2400) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
const raycaster = new THREE.Raycaster(), waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y);
function goodFeedSpot(p) {
  for (let i = 0; i < 40; i++) {
    const nearRock = waterRocks.some((r) => r.top > -0.4 && Math.hypot(p.x - r.x, p.z - r.z) < r.r + 0.8);
    const nearFall = Math.hypot(p.x - FALL_IMPACT.x, p.z - FALL_IMPACT.z) < 2.6;
    if (pondSD(p.x, p.z) < -1.6 && !nearRock && !nearFall) return p;
    p.x *= 0.9; p.z *= 0.9; p.x += rr(-0.4, 0.4); p.z += rr(-0.4, 0.4);
  }
  return p.set(rr(-2, 2), 0, rr(0, 2));
}
function feedFromView() {
  raycaster.setFromCamera(new THREE.Vector2(rr(-0.25, 0.25), rr(-0.3, 0.05)), camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(waterPlane, hit)) hit.set(0, 0, 0);
  return goodFeedSpot(hit);
}
feedBtn.addEventListener('click', () => {
  const ring = document.createElement('span'); ring.className = 'ring'; feedBtn.appendChild(ring);
  setTimeout(() => ring.remove(), 650);
  const n = throwFood(feedFromView());
  if (!n) toast('There is plenty of food on the water already');
  else toast(pick(['Here they come…', 'The koi have spotted it', 'Feeding time!', 'Watch them race for it']));
});
let downAt = null;

/* =====================================================================
   Resize, render passes and the main loop
   ===================================================================== */
const _dbs = new THREE.Vector2();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(_dbs);
  refrRT.setSize(_dbs.x, _dbs.y);
  reflRT.setSize(Math.max(2, Math.floor(_dbs.x * 0.5)), Math.max(2, Math.floor(_dbs.y * 0.5)));
  waterUniforms.uRes.value.copy(_dbs);
  POINT_SCALE.value = _dbs.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', resize);
resize();

function render() {
  updateMirror();
  renderer.setRenderTarget(reflRT);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, mirrorCam);

  renderer.shadowMap.needsUpdate = true;             // the koi cast shadows, so update with them in view
  camera.layers.set(0); camera.layers.enable(L_UNDER);
  renderer.setRenderTarget(refrRT);
  renderer.setClearColor(FOG_COLOR, 1);
  renderer.render(scene, camera);

  camera.layers.enable(L_FX); camera.layers.enable(L_FINAL);
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}

let mistAcc = 0, ledgeAcc = 0, dropAcc = 0;
function updateSpray(dt) {
  const out = FALL_OUT, right = FALL_RIGHT;
  for (mistAcc += dt * 42; mistAcc >= 1; mistAcc--) {
    const s = rr(-0.7, 0.7), o = rr(-0.3, 0.3);
    mist.emit(FALL_IMPACT.x + right.x * s + out.x * o, WATER_Y + 0.05, FALL_IMPACT.z + right.z * s + out.z * o,
      -out.x * rr(0.2, 0.9) + right.x * rr(-0.4, 0.4), rr(0.25, 0.9), -out.z * rr(0.2, 0.9) + right.z * rr(-0.4, 0.4), rr(1.2, 2.4), rr(0.3, 0.55));
  }
  for (ledgeAcc += dt * 16; ledgeAcc >= 1; ledgeAcc--) {
    const s = rr(-0.4, 0.4);
    mist.emit(LEDGE_IMPACT.x + right.x * s, LEDGE_Y + 0.05, LEDGE_IMPACT.z + right.z * s, -out.x * rr(0.1, 0.5), rr(0.2, 0.6), -out.z * rr(0.1, 0.5), rr(0.8, 1.6), rr(0.18, 0.32));
  }
  for (dropAcc += dt * 34; dropAcc >= 1; dropAcc--) {
    const s = rr(-0.65, 0.65), sp = rr(0.4, 1.5);
    drops.emit(FALL_IMPACT.x + right.x * s, WATER_Y + 0.03, FALL_IMPACT.z + right.z * s,
      -out.x * sp + right.x * rr(-0.5, 0.5), rr(0.9, 2.5), -out.z * sp + right.z * rr(-0.5, 0.5), rr(0.4, 0.8), rr(0.03, 0.06));
  }
  mist.update(dt); drops.update(dt);
}

function clampView() {
  const t = controls.target, r = Math.hypot(t.x / POND_SX, t.z);
  if (r > 9) { t.x *= 9 / r; t.z *= 9 / r; }
  t.y = clamp(t.y, -0.3, 2.5);
  const minY = Math.max(terrainHeight(camera.position.x, camera.position.z), WATER_Y) + 0.6;
  if (camera.position.y < minY) camera.position.y = minY;
}

const clock = new THREE.Clock();
let frames = 0, perfT = 0, perfN = 0;
function adaptQuality(raw) {
  // if frames run slow, step the resolution down (never below 0.75x) and keep going
  if (frames < 90 || document.hidden) return;
  perfT += raw; perfN++;
  if (perfT < 2.5) return;
  const avg = perfT / perfN, pr = renderer.getPixelRatio();
  perfT = 0; perfN = 0;
  if (avg > 1 / 38 && pr > 0.75) { renderer.setPixelRatio(Math.max(0.75, pr - 0.25)); resize(); }
}
function tick() {
  const raw = clock.getDelta(), dt = Math.min(raw, 1 / 24);
  adaptQuality(raw);
  U.time.value += dt;
  controls.update();
  clampView();
  for (const k of koi) k.update(dt);
  updateFood(dt);
  updatePads(dt);
  updateLeaves(dt);
  updateDragonflies(dt);
  updateSpray(dt);
  if (!window.__skipRender) render();
  if (++frames === 3) document.getElementById('loader').classList.add('gone');
  requestAnimationFrame(tick);
}
// let the koi settle into their swimming before the first frame is shown
for (let i = 0; i < 90; i++) { U.time.value += 1 / 30; for (const k of koi) k.update(1 / 30); updatePads(1 / 30); }
tick();
window.__koi = { koi, pellets, throwFood, feedFromView, camera, controls, U, scene, water, rocks };
