<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1a14">
<meta name="description" content="A living koi pond in Three.js: a waterfall, rocks, lily pads and koi you can feed.">
<title>Koi Pond</title>
<style>
  :root {
    --ink: #f6f1e6;
    --muted: rgba(246, 241, 230, 0.72);
    --glass: rgba(12, 24, 20, 0.52);
    --line: rgba(255, 255, 255, 0.16);
    --koi: #f07a3a;
    --koi-deep: #c9442a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0d1a14; color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4, 10, 8, 0.42) 100%);
  }
  .title {
    position: fixed; top: max(18px, env(safe-area-inset-top)); left: 22px;
    pointer-events: none; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.45);
  }
  .title h1 {
    margin: 0; font-weight: 500; font-size: 30px; letter-spacing: 0.04em;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  .title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
  .hud {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #feed {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 26px 14px 20px; border-radius: 999px; border: 1px solid rgba(255, 220, 190, 0.45);
    background: linear-gradient(180deg, #f59a52, #d9572f);
    color: #fff8f0; font: 600 16px/1 inherit; font-family: inherit; letter-spacing: 0.02em;
    box-shadow: 0 10px 30px rgba(120, 40, 10, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    cursor: pointer; transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #feed:hover { filter: brightness(1.07); transform: translateY(-1px); }
  #feed:active { transform: translateY(1px) scale(0.98); }
  #feed:focus-visible { outline: 2px solid #ffe2c4; outline-offset: 3px; }
  #feed[disabled] { opacity: 0.7; cursor: default; }
  #feed svg { width: 22px; height: 22px; }
  #status {
    font-size: 12.5px; color: var(--muted); padding: 6px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); white-space: nowrap;
  }
  #toast {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, 8px);
    padding: 10px 18px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 14px; opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #loader {
    position: fixed; inset: 0; display: grid; place-items: center; background: #0d1a14;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 20px;
    letter-spacing: 0.05em; color: var(--muted); transition: opacity 0.9s ease; z-index: 5;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 560px) {
    .title h1 { font-size: 24px; }
    .title p { font-size: 12px; max-width: 250px; }
  }
</style>
</head>
<body>
<div id="loader">Filling the pond…</div>
<div class="vignette"></div>
<header class="title">
  <h1>Koi Pond</h1>
  <p>Drag to orbit · scroll or pinch to zoom · tap the water</p>
</header>
<div class="hud">
  <button id="feed" type="button" aria-label="Feed the koi">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="7" cy="14" r="2.3" fill="#7a3b12"/><circle cx="12.5" cy="10" r="2.3" fill="#8f4a1a"/>
      <circle cx="16.5" cy="15.5" r="2.3" fill="#6d3410"/><circle cx="11" cy="17.5" r="1.9" fill="#9a5520"/>
      <circle cx="17.5" cy="8" r="1.6" fill="#7a3b12"/>
    </svg>
    Feed the koi
  </button>
  <div id="status">14 koi in the pond</div>
</div>
<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Quality, RNG, noise
   ===================================================================== */
const qParam = new URLSearchParams(location.search).get('q');
const isMobile = qParam === 'low' || (qParam !== 'high' && (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 560));
const Q = {
  dpr: qParam === 'low' ? 1 : Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 1.75),
  shadow: isMobile ? 1024 : 2048,
  grass: isMobile ? 2600 : 6500,
  msaa: isMobile ? 0 : 4,
  terrainSeg: isMobile ? 200 : 300,
};

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(20261108);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

function hash3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1440662683); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w) * 2 - 1;
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; }

const GLSL_NOISE = /* glsl */`
float kh12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float kh13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float kNoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(kh12(i), kh12(i+vec2(1.,0.)), u.x), mix(kh12(i+vec2(0.,1.)), kh12(i+vec2(1.,1.)), u.x), u.y); }
float kNoise3(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(kh13(i), kh13(i+vec3(1,0,0)), u.x), mix(kh13(i+vec3(0,1,0)), kh13(i+vec3(1,1,0)), u.x), u.y),
             mix(mix(kh13(i+vec3(0,0,1)), kh13(i+vec3(1,0,1)), u.x), mix(kh13(i+vec3(0,1,1)), kh13(i+vec3(1,1,1)), u.x), u.y), u.z); }
float kFbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * kNoise3(p); p = p * 2.03 + 17.1; a *= 0.5; } return s / 0.9375; }
float kVoronoi(vec2 p){ vec2 i = floor(p), f = fract(p); float d = 1.0;
  for (int y=-1; y<=1; y++) for (int x=-1; x<=1; x++){ vec2 g = vec2(float(x), float(y));
    vec2 o = vec2(kh12(i+g), kh12(i+g+19.7)); d = min(d, length(g + o - f)); } return d; }
float kCaustic(vec2 uv, float time){
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0; vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++){ float t = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten))); }
  c /= 4.0; c = 1.17 - pow(c, 1.4); return clamp(pow(abs(c), 8.0), 0.0, 1.6);
}
`;

/* =====================================================================
   Pond shape, signed distance, terrain height
   ===================================================================== */
const PN = 160;
const POND = [];
for (let i = 0; i < PN; i++) {
  const t = i / PN * Math.PI * 2;
  const r = 1 + 0.10 * Math.sin(2 * t + 0.6) + 0.07 * Math.sin(3 * t + 2.1) + 0.045 * Math.sin(5 * t + 0.3);
  POND.push([14.5 * r * Math.cos(t), 9.6 * r * Math.sin(t)]);
}
let PB = { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 };
for (const [x, z] of POND) { PB.minX = Math.min(PB.minX, x); PB.maxX = Math.max(PB.maxX, x); PB.minZ = Math.min(PB.minZ, z); PB.maxZ = Math.max(PB.maxZ, z); }

function pondSDF(x, z) {
  let d = 1e9, inside = false;
  for (let i = 0, j = PN - 1; i < PN; j = i++) {
    const xi = POND[i][0], zi = POND[i][1], xj = POND[j][0], zj = POND[j][1];
    if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) inside = !inside;
    const ex = xj - xi, ez = zj - zi, wx = x - xi, wz = z - zi;
    const t = clamp((wx * ex + wz * ez) / (ex * ex + ez * ez), 0, 1);
    const dx = wx - ex * t, dz = wz - ez * t, dd = dx * dx + dz * dz;
    if (dd < d) d = dd;
  }
  return inside ? -Math.sqrt(d) : Math.sqrt(d);
}

// Waterfall frame on the back-left bank
let wfIdx = 0;
{ let best = 1e9; for (let i = 0; i < PN; i++) { const a = Math.atan2(POND[i][1], POND[i][0]); const d = Math.abs(wrapA(a + 1.95)); if (d < best) { best = d; wfIdx = i; } } }
const WE = new THREE.Vector2(POND[wfIdx][0], POND[wfIdx][1]);
const WT = new THREE.Vector2(POND[(wfIdx + 2) % PN][0] - POND[(wfIdx + PN - 2) % PN][0], POND[(wfIdx + 2) % PN][1] - POND[(wfIdx + PN - 2) % PN][1]).normalize();
const WN = new THREE.Vector2(WT.y, -WT.x);
if (pondSDF(WE.x + WN.x * 0.6, WE.y + WN.y * 0.6) < 0) WN.multiplyScalar(-1);
const wfW = (a, y, b) => new THREE.Vector3(WE.x + WT.x * a + WN.x * b, y, WE.y + WT.y * a + WN.y * b);
const LIP_Y = 2.95, FALL_V = 1.15;
const FALL_T = Math.sqrt(LIP_Y / 4.9);
const IMPACT = wfW(0, 0, 0.05 - FALL_V * FALL_T);

function terrainH(x, z, s = pondSDF(x, z)) {
  let h;
  if (s < 0) {
    const d = -s;
    h = 0.12 - 0.12 * smooth(0, 0.3, d) - 0.40 * smooth(0, 1.0, d) - 1.75 * smooth(1.0, 5.6, d)
      + fbm3(x * 0.25, 0.5, z * 0.25, 3) * 0.28 * smooth(0.6, 3, d);
    const ix = x - IMPACT.x, iz = z - IMPACT.z;
    h -= 0.75 * Math.exp(-(ix * ix + iz * iz) / 3.5);
  } else {
    h = 0.12 + 0.45 * smooth(0, 3, s) + fbm3(x * 0.08, 1.3, z * 0.08, 4) * 1.3 * smooth(1, 10, s)
      + 0.1 * fbm3(x * 0.6, 2, z * 0.6, 2) * smooth(0, 1.5, s) + Math.max(0, s - 16) * 0.12;
  }
  const lx = x - WE.x, lz = z - WE.y;
  const la = lx * WT.x + lz * WT.y, lb = lx * WN.x + lz * WN.y;
  h += 3.7 * Math.exp(-(la * la / 24 + (lb - 4.6) * (lb - 4.6) / 10)) * smooth(-0.3, 1.2, s);
  return h;
}

/* =====================================================================
   Renderer, scene, camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
if (!renderer.capabilities.isWebGL2) { document.getElementById('loader').textContent = 'This pond needs WebGL 2.'; throw new Error('WebGL2 required'); }
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color('#b7c9c9');
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0105);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.2, 700);
camera.position.set(3.5, 10.5, 17.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.5, -0.4, -1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.5;
controls.maxDistance = 52;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.43;
controls.zoomSpeed = 0.9;
controls.rotateSpeed = 0.6;
controls.panSpeed = 0.7;
controls.autoRotateSpeed = 0.35;
controls.update();

// Layers: 1 = seen through the water (refraction), 2 = main view, 3 = mirrored in the water
const L_REFR = 1, L_MAIN = 2, L_REFL = 3;
function lay(obj, refr, main, refl) {
  const m = (refr ? 1 << L_REFR : 0) | (main ? 1 << L_MAIN : 0) | (refl ? 1 << L_REFL : 0);
  obj.traverse(o => { o.layers.mask = m; });
  return obj;
}

const SUN_DIR = new THREE.Vector3(-0.55, 0.72, 0.42).normalize();
const SUN_COLOR = new THREE.Color('#fff0d8');

// Shared uniforms
const U = {
  uTime: { value: 0 },
  tRipple: { value: null },
  uSimMin: { value: new THREE.Vector2() },
  uSimSize: { value: new THREE.Vector2() },
  uSunDir: { value: SUN_DIR },
};

/* =====================================================================
   Sky and lights
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSunDir: U.uSunDir, uTime: U.uTime, uSunDisk: { value: 30 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: GLSL_NOISE + `
    uniform vec3 uSunDir; uniform float uTime, uSunDisk; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 zen = vec3(0.13, 0.30, 0.66), hor = vec3(0.70, 0.80, 0.84), gnd = vec3(0.22, 0.27, 0.22);
      vec3 col = mix(hor, zen, pow(max(h, 0.0), 0.5));
      col = mix(col, gnd, smoothstep(0.0, -0.2, h));
      float sd = max(dot(d, uSunDir), 0.0);
      col += vec3(1.0, 0.82, 0.58) * (pow(sd, 6.0) * 0.32 + pow(sd, 64.0) * 0.9);
      col += vec3(1.0, 0.96, 0.88) * smoothstep(0.99935, 0.99965, sd) * uSunDisk;
      if (h > 0.0) {
        vec2 cp = d.xz / (h + 0.18) * 1.1 + vec2(uTime * 0.004, uTime * 0.0015);
        float c = kNoise(cp * 1.6) * 0.5 + kNoise(cp * 3.4 + 4.0) * 0.3 + kNoise(cp * 7.9) * 0.2;
        c = smoothstep(0.52, 0.82, c) * smoothstep(0.0, 0.3, h);
        col = mix(col, vec3(1.0, 0.98, 0.95) * (0.85 + 0.4 * pow(sd, 3.0)), c * 0.72);
      }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), skyMat);
sky.frustumCulled = false;
sky.renderOrder = -10;
scene.add(lay(sky, false, true, true));

{ // image-based light from the sky
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(sky.geometry, skyMat.clone());
  envSky.material.uniforms.uSunDisk = { value: 4 };
  envSky.material.uniforms.uSunDir = U.uSunDir; envSky.material.uniforms.uTime = U.uTime;
  envScene.add(envSky);
  const gndMesh = new THREE.Mesh(new THREE.CircleGeometry(300, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#33402a' }));
  gndMesh.position.y = -2; envScene.add(gndMesh);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.55;
  pm.dispose();
}

const sun = new THREE.DirectionalLight(SUN_COLOR, 3.1);
sun.position.copy(SUN_DIR).multiplyScalar(50);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.shadow, Q.shadow);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 5, far: 110 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight('#cfe2ff', '#3a4526', 0.55);
scene.add(hemi);
sun.layers.enableAll(); hemi.layers.enableAll();

/* =====================================================================
   Render targets: refraction (colour + depth), reflection, ripples
   ===================================================================== */
const dbs = new THREE.Vector2();
renderer.getDrawingBufferSize(dbs);
const rtRefr = new THREE.WebGLRenderTarget(dbs.x, dbs.y, {
  type: THREE.HalfFloatType, samples: Q.msaa,
  depthTexture: new THREE.DepthTexture(dbs.x, dbs.y),
});
rtRefr.depthTexture.minFilter = rtRefr.depthTexture.magFilter = THREE.NearestFilter;
const rtRefl = new THREE.WebGLRenderTarget(Math.ceil(dbs.x / 2), Math.ceil(dbs.y / 2), { type: THREE.HalfFloatType });

// --- ripple simulation: a damped wave equation on a height field covering the pond
const SIM = {
  minX: PB.minX - 0.6, minZ: PB.minZ - 0.6,
  sx: (PB.maxX - PB.minX) + 1.2, sz: (PB.maxZ - PB.minZ) + 1.2,
};
SIM.w = isMobile ? 256 : 320;
SIM.h = Math.round(SIM.w * SIM.sz / SIM.sx);
U.uSimMin.value.set(SIM.minX, SIM.minZ);
U.uSimSize.value.set(SIM.sx, SIM.sz);
const simOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping };
let simA = new THREE.WebGLRenderTarget(SIM.w, SIM.h, simOpts);
let simB = new THREE.WebGLRenderTarget(SIM.w, SIM.h, simOpts);
const pondRocks = []; // rocks standing in the water: {x, z, r}
const MAX_DROPS = 24;
const drops = [];
function addDrop(x, z, radius, strength) { if (drops.length < 96) drops.push([x, z, radius, strength]); }
const simMat = new THREE.ShaderMaterial({
  uniforms: {
    tPrev: { value: null }, tMask: { value: null },
    uTexel: { value: new THREE.Vector2(1 / SIM.w, 1 / SIM.h) },
    uSize: { value: new THREE.Vector2(SIM.sx, SIM.sz) },
    uDrops: { value: Array.from({ length: MAX_DROPS }, () => new THREE.Vector4()) },
    uDropCount: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tPrev, tMask; uniform vec2 uTexel, uSize; uniform vec4 uDrops[${MAX_DROPS}]; uniform int uDropCount;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tPrev, vUv);
      float h = c.r, hp = c.g;
      float l = texture2D(tPrev, vUv - vec2(uTexel.x, 0.0)).r, r = texture2D(tPrev, vUv + vec2(uTexel.x, 0.0)).r;
      float d = texture2D(tPrev, vUv - vec2(0.0, uTexel.y)).r, u = texture2D(tPrev, vUv + vec2(0.0, uTexel.y)).r;
      float lap = l + r + d + u - 4.0 * h;

    if (dist > 0.05) d.vel.lerp(to.multiplyScalar(Math.min(5, dist * 4) / dist), Math.min(1, dt * 6)); else d.vel.multiplyScalar(0.85);

}
// butterflies
const butterflies = [];
{
  const wg = new THREE.PlaneGeometry(0.16, 0.16); wg.translate(0.08, 0, 0); wg.rotateX(-Math.PI / 2);
  const cols = ['#ffffff', '#ffe08a', '#bfe3ff'];
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.MeshStandardMaterial({ map: texWing, color: cols[i], alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.7 });
    const g = new THREE.Group(); const l = new THREE.Mesh(wg, mat), r = new THREE.Mesh(wg, mat); r.scale.x = -1; g.add(l, r);
    scene.add(lay(g, false, true, true));

  }
}
function updateButterflies(dt, t) {
  for (const b of butterflies) {
    const tx = Math.sin(t * 0.07 + b.ph) * 16 + Math.sin(t * 0.21 + b.ph * 2) * 4, tz = Math.cos(t * 0.06 + b.ph) * 12 + Math.cos(t * 0.17 + b.ph) * 3;
    const ty = 0.9 + Math.sin(t * 0.5 + b.ph) * 0.5 + Math.max(0, terrainH(tx, tz)) ;
    const old = b.pos.clone();
    b.pos.lerp(v4.set(tx, ty + Math.sin(t * 9 + b.ph) * 0.08, tz), Math.min(1, dt * 0.6));
    b.g.position.copy(b.pos); b.g.rotation.y = Math.atan2(b.pos.x - old.x, b.pos.z - old.z) + Math.PI / 2;
    const f = Math.sin(t * 15 + b.ph) * 1.1; b.l.rotation.z = f; b.r.rotation.z = -f;

}
// water striders
const striders = [];
{
  const legs = [];
  for (const s of [-1, 1]) for (const [a, l] of [[0.5, 0.09], [1.4, 0.14], [2.4, 0.13]]) { const g = cyl(new THREE.Vector3(0, 0.012, 0), new THREE.Vector3(Math.sin(a) * l * s, 0, Math.cos(a) * l), 0.003, 0.002, 4); legs.push(g); }
  const b = new THREE.SphereGeometry(0.02, 8, 6).scale(0.6, 0.5, 1.6).translate(0, 0.016, 0); b.deleteAttribute('uv');
  const geo = mergeGeometries([...legs, b].map(g => g.index ? g.toNonIndexed() : g));
  const mat = new THREE.MeshStandardMaterial({ color: '#1d1a14', roughness: 0.6 });
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(geo, mat); scene.add(lay(m, false, true, false));
    let x, z, s; do { x = R(PB.minX, PB.maxX); z = R(PB.minZ, PB.maxZ); s = pondSDF(x, z); } while (s > -0.6 || s < -3);
    striders.push({ m, x, z, vx: 0, vz: 0, t: R(0, 2), yaw: R(0, 6.28) });
  }
}
function updateStriders(dt) {
  for (const s of striders) {
    s.t -= dt;
    if (s.t < 0) {
      s.t = R(0.5, 2.2); const a = R(0, 6.28), sp = R(0.4, 1.0); s.vx = Math.cos(a) * sp; s.vz = Math.sin(a) * sp; s.yaw = Math.atan2(s.vx, s.vz);
      for (const k of [-1, 1]) addDrop(s.x + Math.cos(s.yaw) * 0.1 * k, s.z - Math.sin(s.yaw) * 0.1 * k, 0.1, 0.02);
    }
    s.vx *= Math.pow(0.12, dt); s.vz *= Math.pow(0.12, dt);
    let nx = s.x + s.vx * dt, nz = s.z + s.vz * dt; const sd = pondSDF(nx, nz);
    if (sd > -0.5 || sd < -4 || pondRocks.some(r => Math.hypot(nx - r.x, nz - r.z) < r.r)) { s.vx *= -1; s.vz *= -1; nx = s.x; nz = s.z; }
    for (const f of koi) if (f.pos.y > -0.4 && Math.hypot(f.pos.x - nx, f.pos.z - nz) < 0.8) { s.vx += (nx - f.pos.x) * 2; s.vz += (nz - f.pos.z) * 2; }
    s.x = nx; s.z = nz;
    s.m.position.set(s.x, 0.005, s.z); s.m.rotation.y = s.yaw;
  }
}
// bubbles from the koi and the floor (seen through the water)
const bubbles = spriteSystem(160, '#e9fbff', true, false);
scene.add(lay(bubbles.pts, true, false, false));
function updateBubbles(dt) {
  if (rand() < dt * 2.5) { const f = koi[RI(0, koi.length - 1)]; const h = f.head(_head); for (let i = 0; i < RI(1, 3); i++) emit(bubbles, h.x + R(-0.03, 0.03), h.y, h.z + R(-0.03, 0.03), 0, R(0.25, 0.45), 0, 6, R(0.02, 0.04), 0.7, 0); }
  if (rand() < dt * 1.5) { const p = randomSwimPoint(1.5); emit(bubbles, p.x, terrainH(p.x, p.z) + 0.05, p.z, 0, R(0.2, 0.35), 0, 12, R(0.015, 0.03), 0.6, 0); }
  for (const p of bubbles.parts) if (p.life > 0 && p.y > -0.03) { p.life = 0; addDrop(p.x, p.z, 0.1, 0.03); }

/* =====================================================================
   UI, interaction
   ===================================================================== */
const feedBtn = document.getElementById('feed'), statusEl = document.getElementById('status'), toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600); }
function updateStatus() {
  const eating = koi.filter(k => k.mode === 'food').length;
  statusEl.textContent = eating ? `${eating} of ${koi.length} koi feeding · ${pelletsEaten} pellets eaten` : `${koi.length} koi in the pond${pelletsEaten ? ` · ${pelletsEaten} pellets eaten` : ''}`;
}
function onPelletEaten() { }
let feedCooldown = 0;
feedBtn.addEventListener('click', () => { if (feedCooldown > 0) return; feedCooldown = 0.9; feedBtn.disabled = true; throwFood(); idle = 0; controls.autoRotate = false; });
addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') feedBtn.click(); });
let downAt = null, idle = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; idle = 0; controls.autoRotate = false; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), dtm = performance.now() - downAt.t; downAt = null;
  if (moved > 6 || dtm > 400) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(waterPlane, hit) || pondSDF(hit.x, hit.z) > -0.3) return;
  addDrop(hit.x, hit.z, 0.45, 0.55); splash(hit.x, hit.z, 14, 0.8);
  koi.forEach(k => k.startle(hit.x, hit.z));
});
controls.addEventListener('start', () => { idle = 0; controls.autoRotate = false; });

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(dbs);
  rtRefr.setSize(dbs.x, dbs.y); rtRefl.setSize(Math.ceil(dbs.x / 2), Math.ceil(dbs.y / 2));

/* =====================================================================
   Reflection camera (oblique-clipped mirror of the main camera)
   ===================================================================== */
const reflCam = new THREE.PerspectiveCamera();
const _rp = new THREE.Plane(), _cp = new THREE.Vector4(), _q = new THREE.Vector4(), _view = new THREE.Vector3(), _tgt = new THREE.Vector3(), _look = new THREE.Vector3(), _rot = new THREE.Matrix4();
const NRM = new THREE.Vector3(0, 1, 0), ORG = new THREE.Vector3(0, 0, 0);
function updateReflectionCamera() {
  _view.subVectors(ORG, camera.position);
  if (_view.dot(NRM) > 0) return false;
  _view.reflect(NRM).negate().add(ORG);
  _rot.extractRotation(camera.matrixWorld);
  _look.set(0, 0, -1).applyMatrix4(_rot).add(camera.position);
  _tgt.subVectors(ORG, _look).reflect(NRM).negate().add(ORG);
  reflCam.position.copy(_view);
  reflCam.up.set(0, 1, 0).applyMatrix4(_rot).reflect(NRM);
  reflCam.lookAt(_tgt);
  reflCam.near = camera.near; reflCam.far = camera.far;
  reflCam.updateMatrixWorld();
  reflCam.projectionMatrix.copy(camera.projectionMatrix);
  reflMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
  _rp.setFromNormalAndCoplanarPoint(NRM, ORG).applyMatrix4(reflCam.matrixWorldInverse);
  _cp.set(_rp.normal.x, _rp.normal.y, _rp.normal.z, _rp.constant);
  const pe = reflCam.projectionMatrix.elements;
  _q.set((Math.sign(_cp.x) + pe[8]) / pe[0], (Math.sign(_cp.y) + pe[9]) / pe[5], -1, (1 + pe[10]) / pe[14]);
  _cp.multiplyScalar(2 / _cp.dot(_q));
  pe[2] = _cp.x; pe[6] = _cp.y; pe[10] = _cp.z + 1 - 0.003; pe[14] = _cp.w;
  reflCam.projectionMatrixInverse.copy(reflCam.projectionMatrix).invert();
  return true;
}

/* =====================================================================
   Main loop
   ===================================================================== */
const clock = new THREE.Clock();
const refrClear = new THREE.Color('#0b2622'), skyClear = new THREE.Color('#b7c9c9');
let frames = 0, perfT = 0, perfChecked = false;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  U.uTime.value = t;

  if (feedCooldown > 0) { feedCooldown -= dt; if (feedCooldown <= 0) feedBtn.disabled = false; }

  const gh = Math.max(terrainH(camera.position.x, camera.position.z), 0) + 0.6;

  updateDragonflies(dt, t);
  updateButterflies(dt, t);

    p.vx += (p.ax - p.x) * 0.3 * dt; p.vz += (p.az - p.z) * 0.3 * dt;

    p.vx *= Math.pow(0.4, dt); p.vz *= Math.pow(0.4, dt);
    p.x += p.vx * dt; p.z += p.vz * dt; p.rot += (p.spin + (p.vx + p.vz) * 0.2) * dt;

  // waterfall churn: ripples, spray and mist at the plunge
  for (let i = 0; i < 3; i++) { const a = R(-0.75, 0.75); const p = wfW(a, 0, 0.05 - FALL_V * FALL_T + R(-0.3, 0.3)); addDrop(p.x, p.z, R(0.2, 0.45), R(0.03, 0.12)); }
  const nEmit = Math.round(dt * (isMobile ? 120 : 220));

    const a = R(-0.75, 0.75), p = wfW(a, 0, 0.05 - FALL_V * FALL_T + R(-0.2, 0.2)), ang = R(0, 6.28), sp = R(0.3, 1.6);
    emit(spray, p.x, 0.02, p.z, Math.cos(ang) * sp - WN.x * 0.6, R(1.0, 3.2), Math.sin(ang) * sp - WN.y * 0.6, R(0.4, 0.9), R(0.02, 0.05), 0.85);
  }
  if (rand() < dt * 4) { const p = wfW(R(-1, 1), 0.2, 0.05 - FALL_V * FALL_T + R(-0.3, 0.3)); emit(mist, p.x, p.y, p.z, R(-0.15, 0.15) - WN.x * 0.25, R(0.15, 0.4), R(-0.15, 0.15) - WN.y * 0.25, R(3, 5), R(1.4, 2.6), R(0.1, 0.18), 0); }
  updateSprites(spray, dt, t, 'spray'); updateSprites(mist, dt, t, 'mist'); updateSprites(motes, dt, t, 'motes'); updateBubbles(dt);

}

frame();
