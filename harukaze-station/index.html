    // ------------------------------------------------------------------ level crossing

    const CROSS_GLOWS = { lampA: [], lampB: [] };
    const ARMS = [];
    const STRIPE = 0.42;

    function crossingPole(x, z, ry) {
      at(x, 0, z, ry, () => {
        add('concreteDark', box(0.55, 0.15, 0.55));
        add('stripe', scaleUV(cyl(0.085, 0.085, 3.75, 0, 0.15, 0, 10), 0.53 / STRIPE, 3.75 / STRIPE));
        add('black', cyl(0.11, 0.09, 0.12, 0, 3.9, 0));
        for (const s of [-1, 1]) {
          const arm = new THREE.BoxGeometry(1.55, 0.24, 0.05);
          scaleUV(arm, 1.55 / STRIPE, 0.24 / STRIPE);
          add('stripe', arm.rotateZ(s * 0.58).translate(0, 3.5, 0.12));
        }
        add('black', box(1.2, 0.12, 0.12, 0, 2.82, 0));
        for (const face of [-1, 1]) {
          for (const side of [-1, 1]) {
            const lx = side * 0.47;
            add('black', new THREE.CylinderGeometry(0.22, 0.22, 0.08, 16).rotateX(Math.PI / 2).translate(lx, 2.88, face * 0.1));
            add('black', new THREE.BoxGeometry(0.44, 0.035, 0.26).rotateX(face * 0.25).translate(lx, 3.1, face * 0.23));
            const key = (side < 0) === (face > 0) ? 'lampA' : 'lampB';
            add(key, new THREE.CylinderGeometry(0.16, 0.16, 0.06, 16).rotateX(Math.PI / 2).translate(lx, 2.88, face * 0.16));
            CROSS_GLOWS[key].push(toWorld(lx, 2.88, face * 0.32));
          }
        }
        // barrier machine and its arm
        add('concrete', box(0.42, 1.1, 0.42, 0.5, 0, 0.05));
        add('black', box(0.46, 0.08, 0.46, 0.5, 1.1, 0.05));
        const pivot = toWorld(0.5, 0.92, 0.3);
        const arm = build(() => {
          add('stripe', scaleUV(box(3.25, 0.09, 0.09, 1.75, -0.045, 0), 3.25 / STRIPE, 0.09 / STRIPE));
          add('black', box(0.5, 0.2, 0.14, -0.2, -0.1, 0));
          add('black', box(0.16, 0.16, 0.16, 0, -0.08, -0.02));
        });
        arm.position.copy(pivot);
        arm.rotation.y = ry;
        ARMS.push(arm);
      });
    }

    // ------------------------------------------------------------------ the train

    const CAR_L = 9.4;
    const CAR_GAP = 0.5;
    const CAR_OFF = (CAR_L + CAR_GAP) / 2;
    const TRAIN_HALF = CAR_L + CAR_GAP / 2;
    const DOORS = [];

    function car(lampKey, platformSide, carRy) {
      const L = CAR_L;
      const hw = 1.25;
      const y0 = 0.5;
      const y1 = 3.2;
      const r = 0.5;
      const k = 0.55 / (y1 - y0);
      const xf = (y) => L / 2 - k * (y - y0);
      const tilt = Math.atan(k);

      const s = new THREE.Shape();
      s.moveTo(-hw + 0.06, y0);
      s.lineTo(hw - 0.06, y0);
      s.lineTo(hw, y0 + 0.08);
      s.lineTo(hw, y1 - r);
      s.quadraticCurveTo(hw, y1, hw - r, y1);
      s.lineTo(-hw + r, y1);
      s.quadraticCurveTo(-hw, y1, -hw, y1 - r);
      s.lineTo(-hw, y0 + 0.08);
      const body = new THREE.ExtrudeGeometry(s, { depth: L, bevelEnabled: false, curveSegments: 4 });
      body.rotateY(Math.PI / 2).translate(-L / 2, 0, 0);
      const p = body.attributes.position;
      for (let i = 0; i < p.count; i++) if (p.getX(i) > L / 2 - 1e-3) p.setX(i, xf(p.getY(i)));
      body.computeVertexNormals();
      add('tWhite', body);

      // cab front, following the raked face
      const front = (key, w, h, y, z, depth = 0.05, out = 0.02) => add(key, new THREE.BoxGeometry(depth, h, w).rotateZ(tilt).translate(xf(y) + out, y, z));
      front('tBlack', 2.2, 1.2, 2.42, 0, 0.05, 0.015);
      for (const z of [-0.52, 0.52]) front('tGlass', 0.92, 0.92, 2.4, z, 0.05, 0.035);
      add('tDest', new THREE.PlaneGeometry(0.95, 0.24).rotateY(Math.PI / 2).rotateZ(tilt).translate(xf(2.98) + 0.05, 2.98, 0));
      front('tPink', 2.48, 0.3, 1.62, 0, 0.05, 0.01);
      front('tPinkDark', 2.48, 0.07, 1.4, 0, 0.05, 0.01);
      for (const z of [-0.8, 0.8]) front(lampKey === 'tHead' ? 'tHead' : 'tLampOff', 0.34, 0.16, 1.12, z, 0.06, 0.03);
      for (const z of [-0.47, 0.47]) front(lampKey === 'tTail' ? 'tTail' : 'tLampOff', 0.2, 0.14, 1.12, z, 0.06, 0.03);
      add('tDark', box(0.35, 0.5, 2.25, L / 2 - 0.2, 0.02, 0));
      add('tGrey', box(0.4, 0.14, 0.24, L / 2 + 0.05, 0.25, 0));

      // sides
      for (const side of [-1, 1]) {
        const zs = side * (hw + 0.012);
        add('tPink', box(L - 0.75, 0.3, 0.03, -0.2, 1.47, zs));
        add('tPinkDark', box(L - 0.75, 0.07, 0.03, -0.2, 1.33, zs));
        for (const [a, b] of [[-L / 2 + 0.45, -3.15], [-1.55, 1.55], [3.15, L / 2 - 1.25]]) {
          add('tGlass', box(b - a, 0.9, 0.035, (a + b) / 2, 1.97, side * (hw + 0.015)));
        }
        add('tGlass', box(0.5, 0.8, 0.035, L / 2 - 0.82, 2.02, side * (hw + 0.015)));
        for (const dx of [-2.35, 2.35]) {
          add('tDoorway', box(1.32, 2.2, 0.02, dx, 0.6, side * (hw + 0.006)));
          for (const leaf of [-1, 1]) {
            const g = box(0.64, 2.16, 0.04, 0, 0.62, 0);
            const at0 = [dx + leaf * 0.33, 0, side * (hw + 0.03)];
            if (side === platformSide) {
              // platform-side leaves slide apart, so they stay separate meshes
              const mesh = new THREE.Mesh(g, MAT.tDoor);
              mesh.castShadow = true;
              mesh.rotation.y = carRy;
              mesh.userData = { base: toWorld(...at0), dir: toWorld(leaf, 0, 0).sub(toWorld(0, 0, 0)) };
              DOORS.push(mesh);
            } else add('tDoor', g.translate(...at0));
          }
        }
      }

      // roof and running gear
      for (const ax of [-2.4, 2.2]) add('tGrey', box(1.7, 0.32, 1.4, ax, y1 - 0.06, 0));
      add('tGrey', box(L - 3, 0.08, 0.5, -0.3, y1 - 0.02, 0));
      add('tDark', box(L - 2.2, 0.38, 2.1, 0, 0.13, 0));
      for (const bx of [-3.05, 3.05]) {
        add('tDark', box(2.3, 0.28, 2.25, bx, 0.18, 0));
        for (const wx of [-0.75, 0.75]) {
          for (const wz of [-0.55, 0.55]) add('tWheel', new THREE.CylinderGeometry(0.3, 0.3, 0.12, 12).rotateX(Math.PI / 2).translate(bx + wx, 0.3, wz));
        }
      }
      add('tDark', box(0.26, 2.3, 1.55, -L / 2 - 0.13, 0.65, 0));
    }

    function pantograph(px) {
      const yb = 3.2;
      const top = CONTACT_Y - RAIL_Y - 0.03;
      add('tGrey', box(1.3, 0.1, 1.1, px, yb + 0.05, 0));
      for (const ix of [-0.5, 0.5]) for (const iz of [-0.4, 0.4]) add('tSilver', cyl(0.05, 0.06, 0.12, px + ix, yb - 0.05, iz, 6));
      for (const z of [-0.25, 0.25]) add('tSilver', beam(V3(px - 0.55, yb + 0.18, z), V3(px + 0.75, yb + 0.48, z * 0.4), 0.05));
      add('tSilver', beam(V3(px + 0.75, yb + 0.48, 0), V3(px - 0.25, top - 0.04, 0), 0.05));
      add('tSilver', box(0.12, 0.05, 1.45, px - 0.25, top - 0.05, 0));
      for (const z of [-1, 1]) add('tSilver', beam(V3(px - 0.25, top - 0.03, z * 0.72), V3(px - 0.25, top - 0.2, z * 0.92), 0.04));
    }

    // both cars batch into one group; the trailing car is the same car turned around
    function buildTrain() {
      const train = build(() => {
        at(CAR_OFF, 0, 0, 0, () => {
          car('tHead', -1, 0);
          pantograph(-2.6);
        });
        at(-CAR_OFF, 0, 0, Math.PI, () => car('tTail', 1, Math.PI));
      });
      for (const d of DOORS) train.add(d);
      return train;
    }

    // ------------------------------------------------------------------ assemble the static scene

    buildBlock();
    buildHills();
    buildTrack();
    buildRoad();
    buildPlatform();
    buildStation();
    for (const h of HOUSES) house(h);
    buildGarden();
    buildNature();
    buildPoles();
    buildCatenary();
    streetLamp(12.7, -6.6, Math.PI / 2);
    streetLamp(-11.4, 10.9, Math.PI);
    crossingPole(ROAD.x0 - 0.55, TRACK_Z + 3.95, 0);
    crossingPole(ROAD.x1 + 0.55, TRACK_Z - 3.95, Math.PI);

    const world = new THREE.Group();
    bake(world, batches);
    batches = new Map();
    world.traverse((o) => { o.matrixAutoUpdate = false; o.updateMatrix(); });
    scene.add(world);
    for (const arm of ARMS) scene.add(arm);

    const train = buildTrain();
    train.position.set(-40, RAIL_Y, TRACK_Z);
    scene.add(train);

    // ------------------------------------------------------------------ clouds and stars

    const clouds = build(() => {
      const spots = [[0.3, 62, -9, 1.3], [1.5, 66, -12, 1.0], [2.6, 60, -8, 1.2], [3.6, 92, 24, 1.1], [4.4, 64, -11, 1.1], [5.5, 70, -10, 0.9], [0.9, 96, 28, 0.9]];
      for (const [a, r, y, s] of spots) {
        const cx = Math.cos(a) * r;
        const cz = Math.sin(a) * r;
        for (let i = 0; i < 6; i++) {
          add('cloud', puff(rand(1.6, 2.8) * s, cx + rand(-4, 4) * s, y + rand(-0.6, 1.0) * s, cz + rand(-2.5, 2.5) * s, 0.72));
        }
      }
    });
    clouds.traverse((o) => { o.castShadow = false; o.receiveShadow = false; });
    scene.add(clouds);

    const noOutline = [];
    const stars = (() => {
      const n = 760;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2);
        const y = rand(0.04, 1);
        const r = Math.sqrt(1 - y * y);
        pos.set([Math.cos(a) * r * 600, y * 600 - 40, Math.sin(a) * r * 600], i * 3);
        const c = new THREE.Color().setHSL(rand(0.55, 0.7), 0.6, rand(0.8, 1));
        col.set([c.r, c.g, c.b], i * 3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const m = new THREE.PointsMaterial({ size: 3, sizeAttenuation: false, map: TEX.star, vertexColors: true, transparent: true, opacity: 0, depthWrite: false });
      const p = new THREE.Points(g, m);
      p.visible = false;
      return p;
    })();
    scene.add(stars);
    noOutline.push(stars);

    // ------------------------------------------------------------------ lights and glows

    const hemi = new THREE.HemisphereLight('#dceeff', '#b7d98f', 1.25);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#fff1dc', 2.0);
    sun.position.set(-26, 46, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(small ? 1536 : 2048, small ? 1536 : 2048);
    Object.assign(sun.shadow.camera, { left: -44, right: 44, top: 36, bottom: -36, near: 1, far: 140 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.03;
    sun.shadow.intensity = 0.8;
    scene.add(sun, sun.target);

    function glowMaterial(color, clip = false) {
      return new THREE.SpriteMaterial({
        map: TEX.glow, color, transparent: true, opacity: 0, depthWrite: false,
        blending: THREE.AdditiveBlending, ...(clip ? { clippingPlanes: clipPlanes } : {}),
      });
    }
    function glow(material, pos, size, parent = scene) {
      const s = new THREE.Sprite(material);
      s.position.copy(pos);
      s.scale.set(size, size, 1);
      parent.add(s);
      noOutline.push(s);
      return s;
    }

    const GLOW = {
      lamp: glowMaterial('#ffd590'),
      lampA: glowMaterial('#ff4b4b'),
      lampB: glowMaterial('#ff4b4b'),
      head: glowMaterial('#fff3d1', true),
      tail: glowMaterial('#ff4545', true),
    };
    const lampLights = [];
    for (const l of LAMPS) {
      glow(GLOW.lamp, l.pos, l.glow);
      const light = new THREE.PointLight('#ffc978', 0, 11, 1.3);
      light.position.copy(l.pos).add(V3(0, -0.25, 0));
      scene.add(light);
      lampLights.push(light);
    }
    for (const key of ['lampA', 'lampB']) for (const p of CROSS_GLOWS[key]) glow(GLOW[key], p, 1.25);

    const headX = CAR_OFF + CAR_L / 2 + 0.15;
    for (const z of [-0.8, 0.8]) glow(GLOW.head, V3(headX, 1.12, z), 1.7, train);
    for (const z of [-0.47, 0.47]) glow(GLOW.tail, V3(-headX, 1.12, z), 0.9, train);
    const headlight = new THREE.PointLight('#fff0cc', 0, 16, 1.2);
    headlight.position.set(headX + 1.6, 1.2, 0);
    train.add(headlight);

    // ------------------------------------------------------------------ petals

    const PETALS = 460;          // classic
    const PETALS_ULTRA = 1100;   // ultra fills the air a little more
    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0);
    petalShape.bezierCurveTo(0.1, 0.03, 0.12, 0.13, 0.055, 0.2);
    petalShape.lineTo(0, 0.172);
    petalShape.lineTo(-0.055, 0.2);
    petalShape.bezierCurveTo(-0.12, 0.13, -0.1, 0.03, 0, 0);
    const petalGeo = new THREE.ShapeGeometry(petalShape, 3).translate(0, -0.1, 0);
    const petalMat = new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap, side: THREE.DoubleSide });
    petalMat.userData.outlineParameters = { visible: false };
    const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS_ULTRA);
    petals.count = PETALS;
    petals.frustumCulled = false;
    petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(petals);
    noOutline.push(petals);

    const prng = mulberry32(0x0b10550a);
    const pState = {
      pos: new Float32Array(PETALS_ULTRA * 3),
      rot: new Float32Array(PETALS_ULTRA * 3),
      spin: new Float32Array(PETALS_ULTRA * 3),
      fall: new Float32Array(PETALS_ULTRA),
      phase: new Float32Array(PETALS_ULTRA),
      size: new Float32Array(PETALS_ULTRA),
      rest: new Float32Array(PETALS_ULTRA),
    };
    const petalTones = ['#ffd0dd', '#ffb8cc', '#ffe3ea', '#ffa6c0', '#fff0f3'].map((c) => new THREE.Color(c));

    function spawnPetal(i, initial) {
      const r = prng;
      let x;
      let y;
      let z;
      if (r() < 0.85) {
        const crown = CROWNS[Math.floor(r() * CROWNS.length)];
        const a = r() * Math.PI * 2;
        const d = Math.sqrt(r()) * crown.r;
        x = crown.c.x + Math.cos(a) * d;
        z = crown.c.z + Math.sin(a) * d;
        y = crown.c.y + (r() - 0.5) * crown.r;
      } else {
        x = -W / 2 - 4 + r() * 20;
        z = (r() - 0.5) * D;
        y = 6 + r() * 8;
      }
      if (initial) y = 0.3 + r() * Math.max(0.5, y);
      pState.pos.set([x, y, z], i * 3);
      pState.rot.set([r() * 6.28, r() * 6.28, r() * 6.28], i * 3);
      pState.spin.set([(r() - 0.5) * 6, (r() - 0.5) * 4, (r() - 0.5) * 6], i * 3);
      pState.fall[i] = 0.32 + r() * 0.34;
      pState.phase[i] = r() * 100;
      pState.size[i] = 1.15 + r() * 0.7;
      pState.rest[i] = 0;
    }

    function groundAt(x, z) {
      if (Math.abs(x) > W / 2 || Math.abs(z) > D / 2) return -14;
      if (x > PLAT.x0 && x < PLAT.x1 && z > PLAT.z0 && z < PLAT.z1) return PLAT.h;
      return hillHeight(x, z);
    }

    for (let i = 0; i < PETALS_ULTRA; i++) {
      spawnPetal(i, true);
      petals.setColorAt(i, petalTones[i % petalTones.length]);
    }

    const dummy = new THREE.Object3D();
    function updatePetals(dt, t) {
      const speed = reduceMotion ? 0.35 : 1;
      const step = dt * speed;
      const gust = 0.65 + 0.35 * Math.sin(t * 0.37) + 0.25 * Math.sin(t * 1.13 + 2);
      const wx = 1.3 * gust;
      const wz = 0.45 * Math.sin(t * 0.23 + 1);
      const { pos, rot, spin, fall, phase, size, rest } = pState;
      for (let i = 0; i < petals.count; i++) {
        const j = i * 3;
        if (rest[i] > 0) {
          rest[i] -= step;
          if (rest[i] <= 0) spawnPetal(i, false);
        } else {
          const ph = phase[i];
          pos[j] += (wx * (0.75 + 0.25 * Math.sin(ph * 3)) + 0.55 * Math.sin(t * 1.7 + ph)) * step;
          pos[j + 1] -= fall[i] * (0.8 + 0.4 * Math.sin(t * 2.3 + ph)) * step;
          pos[j + 2] += (wz + 0.5 * Math.cos(t * 1.3 + ph * 1.7)) * step;
          rot[j] += spin[j] * step;
          rot[j + 1] += spin[j + 1] * step;
          rot[j + 2] += spin[j + 2] * step;
          const ground = groundAt(pos[j], pos[j + 2]);
          if (pos[j + 1] < ground + 0.03) {
            if (ground < -10) spawnPetal(i, false);
            else {
              pos[j + 1] = ground + 0.03;
              rot[j] = -Math.PI / 2;
              rot[j + 2] = 0;
              rest[i] = 1.5 + prng() * 3;
            }
          } else if (Math.abs(pos[j]) > W / 2 + 8 || Math.abs(pos[j + 2]) > D / 2 + 8) spawnPetal(i, false);
        }
        dummy.position.set(pos[j], pos[j + 1], pos[j + 2]);
        dummy.rotation.set(rot[j], rot[j + 1], rot[j + 2]);
        dummy.scale.setScalar(size[i]);
        dummy.updateMatrix();
        petals.setMatrixAt(i, dummy.matrix);
      }
      petals.instanceMatrix.needsUpdate = true;
    }

    // ------------------------------------------------------------------ quality: classic and ultra
    // Classic is the scene as designed. Ultra renders it through a composer (4x MSAA in a
    // half-float target, a soft bloom that grows at night, tilt-shift blur for the miniature
    // look, a light vignette), sharpens the shadow map, adds instanced grass tufts and fills
    // the air with more petals.

    function tuftGeometry() {
      const pos = [];
      for (let b = 0; b < 3; b++) {
        const a = (b / 3) * Math.PI * 2 + 0.4;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        pos.push(-sa * 0.028, 0, ca * 0.028, sa * 0.028, 0, -ca * 0.028, ca * 0.08, 0.26 - b * 0.04, sa * 0.08);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      // light the blades like the meadow they grow from
      g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
      return g;
    }

    // tufts go where the painted meadow is green (not on paths, gravel or soil), off the
    // road and out of the buildings; a separate seed keeps the rest of the scene unchanged
    function buildTufts() {
      const c = TEX.grass.image;
      const data = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      const trng = mulberry32(0x7e57c0de);
      const blocked = [
        [ROAD.x0 - 0.25, ROAD.x1 + 0.25, -D / 2, D / 2],
        [PLAT.x0 - 0.1, PLAT.x1 + 2.3, PLAT.z0 - 1.8, PLAT.z1 + 0.1],
        [-12.4, -3.6, -16.7, -9.9],
      ];
      for (const h of HOUSES) {
        const turned = Math.abs(Math.sin(h.ry || 0)) > 0.5;
        const hx = (turned ? h.d : h.w) / 2 + 0.45;
        const hz = (turned ? h.w : h.d) / 2 + 0.45;
        blocked.push([h.x - hx, h.x + hx, h.z - hz, h.z + hz]);
      }
      const spots = [];
      for (let i = 0; i < 30000; i++) {
        const x = (trng() - 0.5) * (W - 0.8);
        const z = (trng() - 0.5) * (D - 0.8);
        const yaw = trng() * Math.PI * 2;
        const s = 0.7 + trng() * 0.75;
        const tone = trng();
        if (hillHeight(x, z) > 0) continue;
        if (blocked.some(([x0, x1, z0, z1]) => x > x0 && x < x1 && z > z0 && z < z1)) continue;
        const k = (Math.floor((z / D + 0.5) * c.height) * c.width + Math.floor((x / W + 0.5) * c.width)) * 4;
        if (!(data[k + 1] > data[k] * 1.12 && data[k + 1] > data[k + 2] * 1.35)) continue;
        spots.push([x, z, yaw, s, tone]);
      }
      const mat = new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap, side: THREE.DoubleSide });
      mat.userData.outlineParameters = { visible: false };
      const mesh = new THREE.InstancedMesh(tuftGeometry(), mat, spots.length);
      const tones = ['#6fbd4e', '#86cf5c', '#5ea947', '#9ad96d', '#7cc456'].map((t) => new THREE.Color(t));
      spots.forEach(([x, z, yaw, s, tone], i) => {
        dummy.position.set(x, 0.0, z);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(s, s * (0.8 + tone * 0.5), s);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        mesh.setColorAt(i, tones[Math.floor(tone * tones.length)]);
      });
      mesh.receiveShadow = true;
      mesh.matrixAutoUpdate = false;
      scene.add(mesh);
      noOutline.push(mesh);
      return mesh;
    }

    // the toon scene and its ink pass, drawn into the composer's multisampled target
    class ToonPass extends Pass {
      constructor() {
        super();
        this.needsSwap = false;
      }

      render(r, writeBuffer, readBuffer) {
        r.setRenderTarget(this.renderToScreen ? null : readBuffer);
        drawScene();
      }
    }

    const VignetteMultiply = {
      uniforms: { tDiffuse: { value: null }, amount: { value: 0.5 } },
      vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; varying vec2 vUv;
        void main() { vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; c.rgb *= 1.0 - amount * dot(d, d); gl_FragColor = c; }`,
    };

    let quality = 'classic';
    let qualityChosen = false;
    let composer = null;
    let bloom = null;
    let tiltH = null;
    let tiltV = null;
    let tufts = null;

    function buildComposer() {
      const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
      composer = new EffectComposer(renderer, target);
      composer.addPass(new ToonPass());
      bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.12, 0.5, 0.86);
      composer.addPass(bloom);
      tiltH = new ShaderPass(HorizontalTiltShiftShader);
      tiltV = new ShaderPass(VerticalTiltShiftShader);
      composer.addPass(tiltH);
      composer.addPass(tiltV);
      composer.addPass(new ShaderPass(VignetteMultiply));
      composer.addPass(new OutputPass());
      sizeComposer();
    }

    function sizeComposer() {
      if (!composer) return;
      const ratio = renderer.getPixelRatio();
      composer.setPixelRatio(ratio);
      composer.setSize(innerWidth, innerHeight);
      // blur grows with distance from the focus band, a few pixels at the frame edges
      tiltH.uniforms.h.value = 2.4 / (innerWidth * ratio);
      tiltV.uniforms.v.value = 2.4 / (innerHeight * ratio);
      const focus = innerWidth / innerHeight < 0.8 ? 0.6 : 0.53;
      tiltH.uniforms.r.value = focus;
      tiltV.uniforms.r.value = focus;
    }

    function setQuality(q, fromUser) {
      quality = q;
      const ultra = q === 'ultra';
      if (ultra && !composer) buildComposer();
      if (ultra && !tufts) tufts = buildTufts();
      if (tufts) tufts.visible = ultra;
      petals.count = ultra ? PETALS_ULTRA : PETALS;
      const size = ultra ? 4096 : small ? 1536 : 2048;
      if (sun.shadow.mapSize.x !== size) {
        sun.shadow.mapSize.set(size, size);
        sun.shadow.map?.dispose();
        sun.shadow.map = null;
      }
      const btn = $('btnQuality');
      btn.setAttribute('aria-pressed', String(ultra));
      $('qualityLabel').textContent = ultra ? 'Ultra' : 'Classic';
      if (fromUser) {
        qualityChosen = true;
        try { localStorage.setItem('harukaze-quality', q); } catch (err) { /* private mode */ }
      }
      // judge the frame rate afresh for the new setting
      sampled = 0;
      slowFrames = 0;
      sampleFrom = elapsed;
    }

    // ------------------------------------------------------------------ timetable
    // One 32 s cycle: the train leaves the west tunnel, calls at the platform, rings the
    // crossing on its way out and disappears into the east tunnel.

    const CYCLE = 32;
    const T_ARR0 = 2;
    const T_ARR1 = 10;
    const T_DEP0 = 17;
    const T_DEP1 = 25;
    const X_START = -CLIP_X - TRAIN_HALF - 0.6;
    const X_STOP = (PLAT.x0 + PLAT.x1) / 2;
    const X_END = CLIP_X + TRAIN_HALF + 0.6;

    function trainXAt(t) {
      if (t < T_ARR0) return X_START;
      if (t < T_ARR1) {
        const u = (t - T_ARR0) / (T_ARR1 - T_ARR0);
        return X_START + (X_STOP - X_START) * (1 - (1 - u) * (1 - u));
      }
      if (t < T_DEP0) return X_STOP;
      if (t < T_DEP1) {
        const u = (t - T_DEP0) / (T_DEP1 - T_DEP0);
        return X_STOP + (X_END - X_STOP) * u * u;
      }
      return X_END;
    }

    // when the tail clears the road, found once by stepping through the departure
    let T_CLEAR = T_DEP1;
    for (let t = T_DEP0; t < T_DEP1; t += 0.01) {
      if (trainXAt(t) - TRAIN_HALF > ROAD.x1 + 0.5) { T_CLEAR = t; break; }
    }
    const RING_START = T_DEP0 - 3.2;
    const RING_END = T_CLEAR + 0.35;
    const ARM_UP = THREE.MathUtils.degToRad(82);

    let cycleT = 0.4;
    let trainCalled = false;

    function crossingState(t) {
      const ringing = t > RING_START && t < RING_END;
      let down = 0;
      if (t > RING_START + 1.0 && t < RING_END) down = THREE.MathUtils.smoothstep(t, RING_START + 1.0, RING_START + 3.0);
      else if (t >= RING_END) down = 1 - THREE.MathUtils.smoothstep(t, RING_END, RING_END + 2.6);
      return { ringing, down };
    }

    function doorOpen(t) {
      if (t < T_ARR1 + 0.6 || t > T_DEP0 - 1.6) return 0;
      return Math.min(THREE.MathUtils.smoothstep(t, T_ARR1 + 0.6, T_ARR1 + 1.6), 1 - THREE.MathUtils.smoothstep(t, T_DEP0 - 2.6, T_DEP0 - 1.6));
    }

    function callTrain() {
      if (cycleT >= T_DEP1 || cycleT < T_ARR0) {
        cycleT = T_ARR0 - 0.4;
        trainCalled = false;
      } else trainCalled = true;
      updateStatus(true);
    }

    let ringing = false;
    function updateTimetable(dt) {
      cycleT += dt;
      if (trainCalled && cycleT >= T_DEP1 + 0.4) {
        cycleT = T_ARR0 - 0.4;
        trainCalled = false;
      }
      if (cycleT >= CYCLE) cycleT -= CYCLE;
      const t = cycleT;

      // the train never leaves the scene (that would change the light count and recompile
      // every shader); parked inside a tunnel it is simply clipped away
      const x = trainXAt(t);
      train.position.x = x;
      const inView = x > X_START + 0.01 && x < X_END - 0.01 ? 1 : 0;
      const open = doorOpen(t);
      for (const d of DOORS) d.position.copy(d.userData.base).addScaledVector(d.userData.dir, open * 0.62);

      const cross = crossingState(t);
      ringing = cross.ringing;
      for (const arm of ARMS) arm.rotation.z = ARM_UP * (1 - cross.down);
      const phase = Math.floor(performance.now() / 500) % 2;
      setLamp('lampA', cross.ringing && phase === 0);
      setLamp('lampB', cross.ringing && phase === 1);

      // the headlight brightens as the nose leaves the tunnel and fades as it re-enters
      const nose = x + TRAIN_HALF;
      const out = THREE.MathUtils.smoothstep(nose, -CLIP_X - 2, -CLIP_X + 2) * (1 - THREE.MathUtils.smoothstep(nose, CLIP_X + 1, CLIP_X + 5));
      headlight.intensity = 9 * night * out;
      GLOW.head.opacity = (0.35 + 0.65 * night) * out;
      GLOW.tail.opacity = (0.25 + 0.75 * night) * inView;
    }

    const LAMP_ON = new THREE.Color('#ff2a2a');
    function setLamp(key, on) {
      const m = MAT[key];
      m.emissive.copy(on ? LAMP_ON : _black).multiplyScalar(on ? 1.15 : 0);
      m.color.set(on ? '#ff6b6b' : '#5c1616');
      GLOW[key].opacity = on ? 0.55 + 0.45 * night : 0;
    }
    const _black = new THREE.Color(0, 0, 0);

    // ------------------------------------------------------------------ day and night

    let night = 0;
    let nightTarget = 0;
    let paintedNight = -1;
    const C = (c) => new THREE.Color(c);
    const LOOK = {
      sun: [C('#fff1dc'), C('#9fb5ff')],
      sunI: [2.7, 0.7],
      hemiSky: [C('#dceeff'), C('#4d5ea3')],
      hemiGround: [C('#b7d98f'), C('#262b4a')],
      hemiI: [1.35, 1.05],
      cloud: [C('#ffffff'), C('#727cb4')],
    };
    const WINDOW_GLOW = { window: C('#ffc768'), window2: C('#ffdf9a'), tGlass: C('#ffe9b8') };

    function applyNight(k) {
      sun.color.copy(LOOK.sun[0]).lerp(LOOK.sun[1], k);
      sun.intensity = THREE.MathUtils.lerp(LOOK.sunI[0], LOOK.sunI[1], k);
      hemi.color.copy(LOOK.hemiSky[0]).lerp(LOOK.hemiSky[1], k);
      hemi.groundColor.copy(LOOK.hemiGround[0]).lerp(LOOK.hemiGround[1], k);
      hemi.intensity = THREE.MathUtils.lerp(LOOK.hemiI[0], LOOK.hemiI[1], k);
      MAT.cloud.color.copy(LOOK.cloud[0]).lerp(LOOK.cloud[1], k);
      for (const [key, c] of Object.entries(WINDOW_GLOW)) MAT[key].emissive.copy(c).multiplyScalar(k * (key === 'window2' ? 0.7 : 0.95));
      MAT.lampLight.emissive.set('#fff1c8').multiplyScalar(k * 1.1);
      for (const key of ['vend1', 'vend2']) MAT[key].emissive.setScalar(k * 0.85);
      MAT.nameBoard.emissive.setScalar(k * 0.45);
      MAT.stationSign.emissive.setScalar(k * 0.35);
      MAT.clockFace.emissive.setScalar(k * 0.5);
      for (const l of lampLights) l.intensity = 6 * k;
      GLOW.lamp.opacity = k;
      stars.material.opacity = k;
      stars.visible = k > 0.01;
      if (Math.abs(k - paintedNight) > 0.004) {
        paintSky(k);
        paintedNight = k;
      }
    }
    applyNight(0);

    // ------------------------------------------------------------------ camera and controls

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(-1, 0.5, -1);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minPolarAngle = 0.2;
    controls.maxPolarAngle = 1.38;
    controls.autoRotate = !reduceMotion;
    controls.autoRotateSpeed = 0.5;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.8;

    const VIEW_DIR = V3(0.46, 0.53, 0.71).normalize();
    let fitDistance = 0;
    function fitCamera(initial) {
      const aspect = innerWidth / innerHeight;
      camera.aspect = aspect;
      camera.fov = aspect < 0.8 ? 44 : aspect < 1.2 ? 38 : 32;
      // lift the block above the title card and toolbar
      const lift = aspect < 0.8 ? 0.1 : innerHeight < 520 ? 0.07 : 0.035;
      camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * lift, innerWidth, innerHeight);
      camera.updateProjectionMatrix();
      const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
      const hHalf = Math.atan(Math.tan(vHalf) * aspect);
      const radius = aspect < 0.8 ? 35.5 : 40;
      const next = radius / Math.sin(Math.min(vHalf * 1.25, hHalf));
      const offset = camera.position.clone().sub(controls.target);
      const dist = offset.length();
      if (initial) camera.position.copy(controls.target).addScaledVector(VIEW_DIR, next);
      else camera.position.copy(controls.target).addScaledVector(offset.normalize(), dist * (next / fitDistance));
      fitDistance = next;
      controls.minDistance = next * 0.35;
      controls.maxDistance = next * 1.8;
    }
    fitCamera(true);

    function onResize() {
      renderer.setSize(innerWidth, innerHeight);
      sizeComposer();
      fitCamera(false);
    }
    addEventListener('resize', onResize);

    // ------------------------------------------------------------------ interface

    const btnDay = $('btnDay');
    const btnNight = $('btnNight');
    const btnOrbit = $('btnOrbit');
    const btnTrain = $('btnTrain');
    const statusEl = $('status');
    const statusText = $('statusText');
    const caption = $('caption');
    const CAPTIONS = [
      'A country halt on a single-track line, cherry trees in full bloom. Drag to look around, scroll or pinch to zoom.',
      'Spring night on the line: lamps lit, petals still falling. Drag to look around, scroll or pinch to zoom.',
    ];

    function setNight(on) {
      nightTarget = on ? 1 : 0;
      if (reduceMotion) night = nightTarget;
      btnDay.setAttribute('aria-pressed', String(!on));
      btnNight.setAttribute('aria-pressed', String(on));
      document.body.classList.toggle('night', on);
      document.querySelector('meta[name="theme-color"]').content = on ? '#10142e' : '#cfe6fb';
      caption.textContent = CAPTIONS[on ? 1 : 0];
    }

    function setOrbit(on) {
      controls.autoRotate = on;
      btnOrbit.setAttribute('aria-pressed', String(on));
      $('orbitLabel').textContent = on ? 'Orbit on' : 'Orbit off';
    }

    btnDay.addEventListener('click', () => setNight(false));
    btnNight.addEventListener('click', () => setNight(true));
    btnOrbit.addEventListener('click', () => setOrbit(!controls.autoRotate));
    btnTrain.addEventListener('click', callTrain);
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea')) return;
      const k = e.key.toLowerCase();
      if (k === 'n') setNight(nightTarget < 0.5);
      else if (k === 'o') setOrbit(!controls.autoRotate);
      else if (k === 't') callTrain();
      else if (k === 'q') setQuality(quality === 'ultra' ? 'classic' : 'ultra', true);
    });
    $('btnQuality').addEventListener('click', () => setQuality(quality === 'ultra' ? 'classic' : 'ultra', true));
    setOrbit(!reduceMotion);
    motionQuery.addEventListener?.('change', (e) => {
      reduceMotion = e.matches;
      if (reduceMotion) setOrbit(false);
    });

    let lastStatus = '';
    function updateStatus(force) {
      const t = cycleT;
      let text;
      if (t < T_ARR0) text = `Next train in ${Math.max(1, Math.ceil(T_ARR0 - t))} s`;
      else if (t < T_ARR1) text = 'Local train arriving from Sakuradai';
      else if (t < T_DEP0) text = `Now at Harukaze · departs in ${Math.max(1, Math.ceil(T_DEP0 - t))} s`;
      else if (t < T_DEP1) text = trainCalled ? 'Departing for Yamabiko · next train called' : 'Departing for Yamabiko';
      else text = trainCalled ? 'Next train on its way' : `Next train in ${Math.ceil(CYCLE - t + T_ARR0)} s`;
      if (trainCalled && t >= T_ARR0 && t < T_DEP0) text += ' · next train called';
      if (text !== lastStatus || force) {
        statusText.textContent = text;
        lastStatus = text;
      }
      statusEl.classList.toggle('ringing', ringing);
    }

    // ------------------------------------------------------------------ render loop

    // sprites, stars and petals have no outline; hide them for the ink pass so the
    // additive glows are not drawn twice
    const shown = [];
    function drawScene() {
      renderer.render(scene, camera);
      noOutline.forEach((o, i) => {
        shown[i] = o.visible;
        o.visible = false;
      });
      effect.renderOutline(scene, camera);
      noOutline.forEach((o, i) => { o.visible = shown[i]; });
    }

    function render(dt = 0) {
      if (quality === 'ultra') {
        bloom.strength = 0.12 + 0.62 * night;
        composer.render(dt);
      } else {
        drawScene();
      }
    }

    const debug = params.has('debug');
    let last = performance.now();
    let elapsed = 0;
    let slowFrames = 0;
    let sampled = 0;
    let sampleFrom = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const raw = (now - last) / 1000;
      const dt = Math.min(0.1, raw);
      last = now;
      elapsed += dt;

      if (night !== nightTarget) {
        const step = dt / 1.4;
        night = nightTarget > night ? Math.min(nightTarget, night + step) : Math.max(nightTarget, night - step);
      }
      applyNight(night);
      updateTimetable(dt);
      updatePetals(dt, elapsed);
      updateClock();
      updateStatus(false);
      if (!reduceMotion) clouds.rotation.y += dt * 0.008;
      controls.update(dt);
      if (debug) renderer.info.reset();
      render(dt);

      // if this device clearly cannot keep up, step down once: Ultra to Classic when Ultra
      // was our choice rather than the viewer's, otherwise the resolution
      if (elapsed - sampleFrom > 2 && sampled < 240) {
        sampled++;
        if (raw > 1 / 35) slowFrames++;
        if (sampled === 240 && slowFrames > 150) {
          if (quality === 'ultra' && !qualityChosen) {
            setQuality('classic', false);
          } else if (pixelRatio > 1) {
            pixelRatio = Math.max(1, pixelRatio * 0.7);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(innerWidth, innerHeight);
            sizeComposer();
          }
        }
      }
    }

    // Ultra by default on larger screens, Classic on phones; a viewer's own choice (or
    // ?quality=classic|ultra) wins and is remembered
    let savedQuality = params.get('quality');
    try { savedQuality = savedQuality || localStorage.getItem('harukaze-quality'); } catch (err) { /* private mode */ }
    const knownQuality = savedQuality === 'ultra' || savedQuality === 'classic';
    setQuality(knownQuality ? savedQuality : small ? 'classic' : 'ultra', false);
    qualityChosen = knownQuality;

    updateTimetable(0);
    updatePetals(0, 0);
    render();
    requestAnimationFrame((t) => {
      last = t;
      $('loading').classList.add('done');
      frame(t);
    });

    if (debug) {
      renderer.info.autoReset = false;
      window.__station = {
        renderer, scene, camera, controls,
        jump(t) { cycleT = t; },
        night(on) { setNight(on); night = nightTarget; },
        quality(q) { setQuality(q, false); },
        tufts() { return tufts ? tufts.count : 0; },
        calls() { return renderer.info.render.calls; },
        meshes() { let n = 0; world.traverse((o) => { if (o.isMesh) n++; }); return n; },
        buildMs: Math.round(performance.now() - buildStart),
        parts: partCount,
        cycle() { return cycleT; },
      };
    }
  </script>
</body>
</html>
